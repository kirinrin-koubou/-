<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>のんびり島ぐらし 〜スローライフ〜</title>
<style>
  :root{
    --bg:#fdf3e3; --panel:#fffaf0; --ink:#5a4632; --line:#e3d2b0;
    --green:#7fb069; --green-d:#5c8a4a; --blue:#6fb3d6; --gold:#e0a635;
    --pink:#e89ab0; --shadow:0 4px 0 rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    color:var(--ink); display:flex; justify-content:center;
    background:#222; min-height:100%;
  }
  #app{width:100%;max-width:480px;display:flex;flex-direction:column;height:100vh;background:var(--bg)}

  /* ===== TOP: status ===== */
  .top{padding:8px 10px 6px;background:var(--panel);border-bottom:2px solid var(--line)}
  .title{font-size:15px;text-align:center;letter-spacing:1px;margin-bottom:6px}
  .hud{display:flex;gap:8px;font-size:13px;align-items:center}
  .hud .pill{background:var(--bg);border:2px solid var(--line);border-radius:20px;padding:4px 10px;white-space:nowrap}
  .bar{height:9px;background:#eadfc6;border-radius:6px;overflow:hidden;flex:1;min-width:60px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#f6c54b,#e88c3b);transition:width .3s}

  /* ===== MIDDLE: the world ===== */
  .world{flex:1;position:relative;overflow:hidden}
  .scene{position:absolute;inset:0;transition:opacity .4s}
  .sky{position:absolute;inset:0}
  .scene .cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:13px;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-weight:bold;z-index:5}

  .sun{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#fff6c8,#ffd24a);
    top:30px;right:34px;box-shadow:0 0 30px #ffe08a;transition:all .6s}
  .cloud{position:absolute;background:#fff;border-radius:30px;opacity:.85;filter:blur(.3px)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{width:70px;height:22px;top:46px;left:30px}
  .c1::before{width:32px;height:32px;top:-14px;left:10px}
  .c1::after{width:24px;height:24px;top:-10px;left:36px}
  .c2{width:54px;height:18px;top:90px;right:60px;opacity:.7}
  .c2::before{width:26px;height:26px;top:-12px;left:8px}

  .ground{position:absolute;left:0;right:0;bottom:0;height:46%;
    background:linear-gradient(180deg,#9ccc6a,#7cb152);border-top:4px solid #8abb5c}
  .hill{position:absolute;bottom:38%;width:140%;left:-20%;height:140px;border-radius:50%;background:#8fc060;opacity:.6}

  /* farm */
  .farm-grid{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:88%}
  .plot{aspect-ratio:1.1;border-radius:12px;background:linear-gradient(180deg,#c49a5e,#a87c45);
    border:2px solid #8a6336;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:4px;font-size:30px;cursor:pointer;position:relative;transition:transform .1s}
  .plot:active{transform:scale(.93)}
  .plot.wet{background:linear-gradient(180deg,#8f6a3c,#6e4f29)}
  .plot small{font-size:9px;color:#fff;position:absolute;top:3px;background:rgba(0,0,0,.3);padding:0 5px;border-radius:7px}
  .plot .dw{position:absolute;bottom:3px;right:5px;font-size:12px}
  .house{position:absolute;bottom:42%;left:18px;font-size:46px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}

  /* pond */
  .pond{position:absolute;left:50%;transform:translateX(-50%);bottom:10%;width:80%;height:46%;
    background:radial-gradient(ellipse at 50% 40%,#9fd6ec,#5fa9cf 70%,#4a8fb5);
    border-radius:50%;border:5px solid #6b4f2e;cursor:pointer;overflow:hidden;
    box-shadow:inset 0 6px 16px rgba(255,255,255,.4)}
  .pond:active{filter:brightness(1.05)}
  .ripple{position:absolute;border:2px solid rgba(255,255,255,.6);border-radius:50%;
    width:20px;height:12px;animation:rip 3s linear infinite}
  @keyframes rip{0%{transform:scale(.4);opacity:.8}100%{transform:scale(3);opacity:0}}
  .lily{position:absolute;font-size:24px}
  .swim{position:absolute;font-size:22px;animation:sw 6s linear infinite;opacity:.85}
  @keyframes sw{0%{left:-10%}100%{left:100%}}
  .angler{position:absolute;bottom:8%;left:24px;font-size:40px}

  /* forest */
  .tree{position:absolute;font-size:60px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
  .for-item{position:absolute;font-size:30px}
  .forest-tap{position:absolute;inset:0;cursor:pointer}

  /* town / shop */
  .town{position:absolute;left:0;right:0;bottom:0;top:0}
  .road{position:absolute;left:0;right:0;bottom:0;height:30%;background:#d8c49a;border-top:5px solid #c2ab7c}
  .bld{position:absolute;bottom:28%;font-size:64px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25));cursor:pointer}
  .signp{position:absolute;background:#fff;border:2px solid var(--line);border-radius:10px;
    padding:3px 8px;font-size:11px;font-weight:bold;color:var(--ink)}

  /* sliding panel for shop/bag */
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:74%;overflow:auto;
    background:var(--panel);border:3px solid var(--line);border-bottom:none;
    border-radius:18px 18px 0 0;padding:14px;transform:translateY(101%);transition:transform .3s;z-index:8}
  .panel.up{transform:translateY(0)}
  .panel h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .panel h3 .x{background:var(--line);border:none;color:var(--ink);border-radius:50%;width:26px;height:26px;font-size:14px}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
  .item .ic{font-size:22px}.item .nm{flex:1}.item .ct{font-size:12px;color:#a08b6c}
  .tag{font-size:11px;background:#f0e6cf;border-radius:8px;padding:2px 7px;color:#8a7350}

  /* ===== BOTTOM: actions + nav ===== */
  .bottom{background:var(--panel);border-top:2px solid var(--line)}
  .actions{display:flex;gap:8px;padding:8px 10px}
  .log{font-size:12px;color:#8a7350;padding:0 12px 6px;text-align:center;min-height:18px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{font-family:inherit;font-size:14px;color:#fff;background:var(--green);
    border:none;border-radius:12px;padding:11px 12px;cursor:pointer;
    box-shadow:0 3px 0 var(--green-d);transition:transform .08s;flex:1}
  button:active{transform:translateY(2px)}
  button.b{background:var(--blue);box-shadow:0 3px 0 #4f8aa8}
  button.g{background:var(--gold);box-shadow:0 3px 0 #b07d1e}
  button.p{background:var(--pink);box-shadow:0 3px 0 #c06f88}
  button.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
  button:disabled{opacity:.45;filter:grayscale(.4)}
  .nav{display:flex;gap:4px;padding:6px 8px 10px}
  .nav button{font-size:12px;padding:9px 4px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
  .nav button.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}

  .pop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  .pop.show{display:flex}
  .card{background:var(--panel);border-radius:18px;padding:20px;max-width:320px;width:100%;text-align:center;border:3px solid var(--line)}
  .card .big{font-size:46px;margin:6px 0}
  .float{position:fixed;left:50%;top:42%;transform:translateX(-50%);font-size:22px;font-weight:bold;
    color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none;animation:fl 1.1s ease-out forwards;z-index:30}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <div class="title">🏝️ のんびり島ぐらし</div>
    <div class="hud">
      <span class="pill">🪙 <b id="gold">0</b></span>
      <span class="pill">📅 <b id="day">1</b>日目</span>
      <span class="pill" id="timeTxt">☀️ 朝</span>
      <span class="pill" style="flex:1;display:flex;align-items:center;gap:6px">⚡<div class="bar"><i id="enBar"></i></div></span>
    </div>
  </div>

  <div class="world" id="world"></div>

  <div class="bottom">
    <div class="actions" id="actions"></div>
    <div class="log" id="log"></div>
    <div class="nav">
      <button data-v="farm" class="on">🌱 畑</button>
      <button data-v="pond">🎣 池</button>
      <button data-v="forest">🌲 森</button>
      <button data-v="shop">🏪 店</button>
      <button data-v="bag">🎒 袋</button>
    </div>
  </div>
</div>

<div class="pop" id="pop">
  <div class="card">
    <div class="big" id="popIc">🌙</div>
    <h2 id="popTitle" style="font-size:17px"></h2>
    <p id="popBody" style="margin:10px 0;font-size:14px"></p>
    <button class="g" style="flex:none;padding:11px 26px" onclick="closePop()">つづける</button>
  </div>
</div>

<script>
const ITEMS={
  kabu_s:{n:"カブの種",ic:"🫛",buy:8}, tomato_s:{n:"トマトの種",ic:"🫛",buy:15}, corn_s:{n:"トウモロコシの種",ic:"🫛",buy:25},
  kabu:{n:"カブ",ic:"🥬",sell:18}, tomato:{n:"トマト",ic:"🍅",sell:34}, corn:{n:"トウモロコシ",ic:"🌽",sell:60},
  fune:{n:"フナ",ic:"🐟",sell:14}, koi:{n:"コイ",ic:"🐠",sell:40}, nushi:{n:"ぬし",ic:"🐡",sell:150},
  ki:{n:"きのこ",ic:"🍄",sell:12}, ichigo:{n:"野いちご",ic:"🍓",sell:22}, hachi:{n:"はちみつ",ic:"🍯",sell:55}, eda:{n:"枝",ic:"🪵",sell:5},
};
const GROW={kabu_s:{into:"kabu",days:2},tomato_s:{into:"tomato",days:3},corn_s:{into:"corn",days:4}};
const SHOP=["kabu_s","tomato_s","corn_s"];
const fresh=()=>({gold:50,day:1,time:0,energy:100,
  plots:Array.from({length:8},()=>({seed:null,age:0,wet:false,ready:false})),
  bag:{kabu_s:3},view:"farm"});
let S=load()||fresh();
const TIMES=[["☀️ 朝",["#bfe0f2","#dff0f7"]],["🌤️ 昼",["#a9d6ee","#cdeaf3"]],
  ["🌇 夕方",["#f3b27a","#f6d9b0"]],["🌙 夜",["#3a3a6e","#5b5b95"]]];
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("nonbiri2",JSON.stringify(S))}
function load(){try{return JSON.parse(localStorage.getItem("nonbiri2"))}catch(e){return null}}
function log(t){$("log").textContent=t}
function floatTxt(t){const f=document.createElement("div");f.className="float";f.textContent=t;
  document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}
function spend(e){if(S.energy<e){log("⚡ つかれた…休もう（時間をすすめる）。");return false}S.energy-=e;return true}
function give(k,n=1){S.bag[k]=(S.bag[k]||0)+n}
function take(k,n=1){if((S.bag[k]||0)<n)return false;S.bag[k]-=n;if(S.bag[k]<=0)delete S.bag[k];return true}

function advanceTime(){S.time++;if(S.time>=4){sleep();return}save();draw()}
function sleep(){
  S.day++;S.time=0;S.energy=100;let grew=0;
  S.plots.forEach(p=>{if(p.seed){if(p.wet&&!p.ready){p.age++;const g=GROW[p.seed];if(g&&p.age>=g.days){p.ready=true;grew++}}p.wet=false}});
  save();
  $("popIc").textContent="🌙";$("popTitle").textContent=`${S.day-1}日目 おわり`;
  $("popBody").textContent=grew>0?`ぐっすり眠った。作物が ${grew}個 実ったみたい！`:"ぐっすり眠って体力が回復した。";
  $("pop").classList.add("show");draw();
}
function closePop(){$("pop").classList.remove("show")}

/* ---- backdrop ---- */
function skyHTML(){
  const[g1,g2]=TIMES[S.time][1], night=S.time===3;
  return `<div class="sky" style="background:linear-gradient(180deg,${g1},${g2})"></div>
    <div class="sun" style="${night?'background:radial-gradient(circle,#fff,#e8e8ff);box-shadow:0 0 24px #cdcdff;top:28px':''}">${night?'🌙':''}</div>
    ${night?'':'<div class="cloud c1"></div><div class="cloud c2"></div>'}`;
}

/* ---- FARM ---- */
function farmScene(){
  let s=skyHTML()+`<div class="ground"></div><div class="hill"></div>
    <div class="cap">🌱 みんなの畑</div><div class="house">🏡</div><div class="farm-grid">`;
  S.plots.forEach((p,i)=>{
    let face="",sub="";
    if(p.seed){
      if(p.ready){face=ITEMS[GROW[p.seed].into].ic;sub="しゅうかく!"}
      else{face=p.age===0?"🌱":p.age===1?"🌿":"🍀";sub=`あと${GROW[p.seed].days-p.age}日`}
    }
    s+=`<div class="plot ${p.wet?'wet':''}" onclick="plot(${i})">
      ${sub?`<small>${sub}</small>`:''}${p.wet&&!p.ready?'<span class="dw">💧</span>':''}${face}</div>`;
  });
  return s+`</div>`;
}
function farmActions(){
  let seeds=Object.keys(S.bag).filter(k=>GROW[k]);
  if(!seeds.length){window._seed=null;return `<button class="ghost" disabled>種がない（店で購入）</button>
    <button class="g" onclick="advanceTime()">⏳ 時間をすすめる</button>`}
  if(!window._seed||!S.bag[window._seed])window._seed=seeds[0];
  return `<button class="g" onclick="cycleSeed()">🫛 ${ITEMS[window._seed].n}</button>
    <button class="b" onclick="advanceTime()">⏳ 時間をすすめる</button>`;
}
function cycleSeed(){let s=Object.keys(S.bag).filter(k=>GROW[k]);
  s.length&&(window._seed=s[(s.indexOf(window._seed)+1)%s.length]);draw()}
function plot(i){
  const p=S.plots[i];
  if(!p.seed){const sd=window._seed;if(!sd||!S.bag[sd]){log("🫛 種がないよ。");return}
    if(!spend(4))return;take(sd);p.seed=sd;p.age=0;p.wet=false;p.ready=false;
    log(`🌱 ${ITEMS[sd].n}をまいた`);floatTxt("🌱 -4⚡");}
  else if(p.ready){const c=GROW[p.seed].into;give(c);log(`🧺 ${ITEMS[c].n}を収穫！`);
    floatTxt(`${ITEMS[c].ic} +1`);p.seed=null;p.age=0;p.ready=false;p.wet=false;}
  else if(!p.wet){if(!spend(2))return;p.wet=true;log("💧 水をやった");floatTxt("💧 -2⚡");}
  else log("もう水やり済み。夜になれば育つよ。");
  save();draw();
}

/* ---- POND ---- */
function pondScene(){
  return skyHTML()+`<div class="ground"></div>
    <div class="cap">🎣 静かな池</div>
    <div class="pond" onclick="fish()">
      <div class="ripple" style="left:30%;top:40%"></div>
      <div class="ripple" style="left:60%;top:55%;animation-delay:1.4s"></div>
      <div class="lily" style="left:18%;top:30%">🪷</div>
      <div class="lily" style="left:70%;top:60%">🪷</div>
      <div class="swim" style="top:50%">🐟</div>
      <div class="swim" style="top:70%;animation-delay:3s">🐠</div>
    </div><div class="angler">🧑‍🌾</div>`;
}
function pondActions(){return `<button class="b" onclick="fish()">🎣 釣りをする (-6⚡)</button>
  <button class="ghost" onclick="advanceTime()">⏳ 時間をすすめる</button>`}
function fish(){
  if(!spend(6))return;floatTxt("🎣 -6⚡");
  const night=S.time>=3,r=Math.random();let k;
  if(r<(night?.10:.03))k="nushi";else if(r<(night?.45:.30))k="koi";
  else if(r<.85)k="fune";else{log("🌊 …逃げられた。");save();draw();return}
  give(k);log(`🎣 ${ITEMS[k].n}が釣れた！`);
  if(k==="nushi"){$("popIc").textContent="🐡";$("popTitle").textContent="ぬしを釣った!!";
    $("popBody").textContent="池の主が姿を現した…!すごい大物だ！";$("pop").classList.add("show")}
  save();draw();
}

/* ---- FOREST ---- */
function forestScene(){
  return skyHTML()+`<div class="ground" style="background:linear-gradient(180deg,#7fae5a,#5e8c40);height:52%"></div>
    <div class="cap">🌲 おさんぽの森</div>
    <div class="tree" style="bottom:34%;left:6%">🌲</div>
    <div class="tree" style="bottom:40%;left:34%;font-size:74px">🌳</div>
    <div class="tree" style="bottom:34%;right:8%">🌲</div>
    <div class="tree" style="bottom:46%;right:34%;font-size:50px">🌲</div>
    <div class="for-item" style="bottom:14%;left:20%">🍄</div>
    <div class="for-item" style="bottom:10%;left:55%">🍓</div>
    <div class="for-item" style="bottom:20%;right:18%">🐝</div>
    <div class="forest-tap" onclick="forage()"></div>`;
}
function forestActions(){return `<button onclick="forage()">🧺 採取する (-5⚡)</button>
  <button class="ghost" onclick="advanceTime()">⏳ 時間をすすめる</button>`}
function forage(){
  if(!spend(5))return;floatTxt("🧺 -5⚡");
  const t=[["ki",.40],["eda",.30],["ichigo",.22],["hachi",.08]];
  let r=Math.random(),a=0,g="ki";for(const[k,p]of t){a+=p;if(r<=a){g=k;break}}
  give(g);log(`🧺 ${ITEMS[g].n}を見つけた！`);save();draw();
}

/* ---- TOWN (shop/bag share the town view) ---- */
function townScene(){
  return skyHTML()+`<div class="road"></div>
    <div class="cap">🏘️ 港町</div>
    <div class="bld" style="left:8%" onclick="openPanel('shop')">🏪</div>
    <div class="signp" style="bottom:24%;left:9%">よろず屋</div>
    <div class="bld" style="left:40%;font-size:70px">🏠</div>
    <div class="bld" style="right:8%" onclick="openPanel('bag')">🎒</div>
    <div class="signp" style="bottom:24%;right:9%">もちもの</div>
    <div class="for-item" style="bottom:6%;left:50%">🚶</div>`;
}
function shopPanelHTML(){
  let h=`<h3>🏪 よろず屋 <button class="x" onclick="closePanel()">×</button></h3><div class="list">`;
  SHOP.forEach(k=>h+=`<div class="item"><span class="ic">${ITEMS[k].ic}</span>
    <span class="nm">${ITEMS[k].n}<br><span class="ct">🪙${ITEMS[k].buy}</span></span>
    <button class="g" style="flex:0;min-width:60px" onclick="buy('${k}')">買う</button></div>`);
  h+=`</div><h3 style="margin-top:14px">💰 売る</h3><div class="list">`;
  let sl=Object.keys(S.bag).filter(k=>ITEMS[k].sell);
  if(!sl.length)h+=`<p style="font-size:13px;color:#a08b6c">売れる物がない。</p>`;
  sl.forEach(k=>h+=`<div class="item"><span class="ic">${ITEMS[k].ic}</span>
    <span class="nm">${ITEMS[k].n} <span class="tag">×${S.bag[k]}</span><br><span class="ct">🪙${ITEMS[k].sell}/個</span></span>
    <button class="p" style="flex:0;min-width:48px" onclick="sell1('${k}')">1個</button>
    <button class="b" style="flex:0;min-width:58px" onclick="sellAll('${k}')">全部</button></div>`);
  return h+`</div>`;
}
function bagPanelHTML(){
  let ks=Object.keys(S.bag);
  let h=`<h3>🎒 もちもの <button class="x" onclick="closePanel()">×</button></h3><div class="list">`;
  if(!ks.length)h+=`<p style="font-size:13px;color:#a08b6c">袋はからっぽ。</p>`;
  ks.forEach(k=>h+=`<div class="item"><span class="ic">${ITEMS[k].ic}</span>
    <span class="nm">${ITEMS[k].n}</span><span class="tag">×${S.bag[k]}</span></div>`);
  return h+`</div><button class="ghost" style="margin-top:12px" onclick="resetGame()">🔄 最初から</button>`;
}
function openPanel(which){
  $("panel").innerHTML=which==="shop"?shopPanelHTML():bagPanelHTML();
  $("panel").classList.add("up");
}
function closePanel(){$("panel").classList.remove("up");if(S.view==="shop"||S.view==="bag")setNav("farm")}
function buy(k){if(S.gold<ITEMS[k].buy){log("🪙 お金が足りない…");return}
  S.gold-=ITEMS[k].buy;give(k);log(`🛒 ${ITEMS[k].n}を買った`);save();refreshPanel("shop")}
function sell1(k){if(!take(k))return;S.gold+=ITEMS[k].sell;log(`💰 ${ITEMS[k].n}を売った (+${ITEMS[k].sell})`);save();refreshPanel("shop")}
function sellAll(k){const n=S.bag[k]||0;if(!n)return;const g=n*ITEMS[k].sell;delete S.bag[k];
  S.gold+=g;log(`💰 ${ITEMS[k].n}×${n} (+${g})`);save();refreshPanel("shop")}
function refreshPanel(w){$("panel").innerHTML=w==="shop"?shopPanelHTML():bagPanelHTML();$("gold").textContent=S.gold}
function resetGame(){if(!confirm("最初からやり直しますか？"))return;S=fresh();save();log("🌅 あたらしい暮らしがはじまった。");closePanel();setNav("farm")}

/* ---- RENDER ---- */
const SCENES={farm:farmScene,pond:pondScene,forest:forestScene,shop:townScene,bag:townScene};
const ACTS={farm:farmActions,pond:pondActions,forest:forestActions,
  shop:()=>`<button class="g" onclick="openPanel('shop')">🏪 お店に入る</button><button class="ghost" onclick="advanceTime()">⏳ 時間をすすめる</button>`,
  bag:()=>`<button class="p" onclick="openPanel('bag')">🎒 袋をひらく</button><button class="ghost" onclick="advanceTime()">⏳ 時間をすすめる</button>`};
function draw(){
  $("gold").textContent=S.gold;$("day").textContent=S.day;
  $("timeTxt").textContent=TIMES[S.time][0];$("enBar").style.width=S.energy+"%";
  $("world").innerHTML=`<div class="scene">${SCENES[S.view]()}</div><div class="panel" id="panel"></div>`;
  $("actions").innerHTML=ACTS[S.view]();
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  if(S.view==="shop")openPanel("shop");
  if(S.view==="bag")openPanel("bag");
}
function setNav(v){S.view=v;save();draw()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setNav(b.dataset.v));
log("🌅 ようこそ、のんびり島へ。");
draw();
</script>
</body>
</html>
