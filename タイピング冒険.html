<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>タイピング冒険</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      background: #2a5a20;
    }

    /* ===== ホーム画面 ===== */
    #home-screen {
      position: absolute;
      inset: 0;
      cursor: pointer;
      transition: opacity 0.4s;
    }

    #home-screen.fade-out { opacity: 0; pointer-events: none; }

    .map-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-40px); }
    }
    @keyframes smoke {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-18px) scale(1.5); opacity: 0; }
    }

    .tap-hint { animation: pulse 1.8s ease-in-out infinite; }
    .smoke1 { animation: smoke 2.2s ease-out infinite; }
    .smoke2 { animation: smoke 2.2s ease-out 0.9s infinite; }

    /* ===== タイピング画面 ===== */
    #typing-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(170deg, #0d1b35 0%, #1a3560 55%, #0d2040 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #typing-screen.active {
      opacity: 1;
      pointer-events: all;
    }

    .stop-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: white;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .stop-btn:hover { background: rgba(255,255,255,0.22); }

    /* 星の背景 */
    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--d) ease-in-out infinite var(--delay);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: var(--bright); }
    }

    /* 単語表示エリア */
    .word-panel {
      margin-top: clamp(60px, 16vh, 110px);
      text-align: center;
      padding: 22px 36px 26px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(4px);
      min-width: min(300px, 80vw);
    }

    .furigana-text {
      font-size: clamp(1rem, 4vw, 1.4rem);
      color: #90c8f0;
      letter-spacing: 5px;
      margin-bottom: 6px;
      min-height: 1.6em;
    }

    .kanji-text {
      font-size: clamp(2.8rem, 12vw, 5rem);
      color: white;
      font-weight: 900;
      line-height: 1.1;
      transition: color 0.15s;
      text-shadow: 0 0 20px rgba(100,180,255,0.4);
    }
    .kanji-text.wrong { color: #e74c3c; }

    .romaji-text {
      margin-top: 14px;
      font-size: clamp(1.3rem, 5vw, 2rem);
      letter-spacing: 6px;
      font-weight: 700;
      min-height: 2em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1px;
    }
    .r-typed   { color: #2ecc71; }
    .r-current { color: #f1c40f; text-decoration: underline; text-underline-offset: 4px; }
    .r-remain  { color: rgba(255,255,255,0.35); }

    /* スコア */
    .score-bar {
      position: absolute;
      top: 18px;
      left: 18px;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    .score-val {
      font-size: 1.2rem;
      color: #f1c40f;
      font-weight: 700;
    }

    /* キーボード */
    .keyboard {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      padding: 0 6px;
    }
    .key-row {
      display: flex;
      justify-content: center;
      gap: clamp(2px, 0.8vw, 5px);
      margin-bottom: clamp(3px, 0.8vw, 5px);
    }
    .key {
      width: clamp(26px, 8.5vw, 44px);
      height: clamp(30px, 9vw, 46px);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(9px, 2.6vw, 15px);
      font-weight: 700;
      background: rgba(160,160,180,0.18);
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s, color 0.1s, transform 0.08s;
      letter-spacing: 0;
    }
    .key.hit {
      background: #f1c40f !important;
      color: #1a1a00 !important;
      border-color: #d4a700 !important;
      box-shadow: 0 0 12px rgba(241,196,15,0.7), 0 2px 0 #a07800;
      transform: translateY(1px);
    }
    .key:active { transform: translateY(2px); }
  </style>
</head>

  'きゃ':['kya'],'きぃ':['kyi'],'きゅ':['kyu'],'きぇ':['kye'],'きょ':['kyo'],
  'しゃ':['sha','sya'],'しぃ':['syi'],'しゅ':['shu','syu'],'しぇ':['she','sye'],'しょ':['sho','syo'],
  'ちゃ':['cha','tya','cya'],'ちぃ':['tyi'],'ちゅ':['chu','tyu','cyu'],'ちぇ':['che','tye'],'ちょ':['cho','tyo','cyo'],
  'にゃ':['nya'],'にぃ':['nyi'],'にゅ':['nyu'],'にぇ':['nye'],'にょ':['nyo'],
  'ひゃ':['hya'],'ひぃ':['hyi'],'ひゅ':['hyu'],'ひぇ':['hye'],'ひょ':['hyo'],
  'みゃ':['mya'],'みぃ':['myi'],'みゅ':['myu'],'みぇ':['mye'],'みょ':['myo'],
  'りゃ':['rya'],'りぃ':['ryi'],'りゅ':['ryu'],'りぇ':['rye'],'りょ':['ryo'],
  'ぎゃ':['gya'],'ぎぃ':['gyi'],'ぎゅ':['gyu'],'ぎぇ':['gye'],'ぎょ':['gyo'],
  'じゃ':['ja','jya','zya'],'じぃ':['jyi','zyi'],'じゅ':['ju','jyu','zyu'],'じぇ':['je','jye','zye'],'じょ':['jo','jyo','zyo'],
  'ぢゃ':['dya'],'ぢぃ':['dyi'],'ぢゅ':['dyu'],'ぢぇ':['dye'],'ぢょ':['dyo'],
  'びゃ':['bya'],'びぃ':['byi'],'びゅ':['byu'],'びぇ':['bye'],'びょ':['byo'],
  'ぴゃ':['pya'],'ぴぃ':['pyi'],'ぴゅ':['pyu'],'ぴぇ':['pye'],'ぴょ':['pyo'],
  'ふぁ':['fa'],'ふぃ':['fi'],'ふぇ':['fe'],'ふぉ':['fo'],
  'てぃ':['thi'],'てゅ':['thu'],'でぃ':['dhi'],'でゅ':['dhu'],
  'うぁ':['wha'],'うぃ':['whi'],'うぇ':['whe'],'うぉ':['who'],
  'いぇ':['ye'],
};

// ===== セグメント構築 =====
// 各セグメント: { kana, opts, special }
//   special: null | 'sokuon'(っ) | 'n'(ん)
function buildSegments(hiragana) {
  const segs = [];
  let i = 0;
  while (i < hiragana.length) {
    // 2文字複合優先
    if (i + 1 < hiragana.length) {
      const two = hiragana[i] + hiragana[i+1];
      if (COMPOUND_MAP[two]) {
        segs.push({ kana: two, opts: [...COMPOUND_MAP[two]], special: null });
        i += 2; continue;
      }
    }
    const c = hiragana[i];
    if (c === 'っ') {
      segs.push({ kana: c, opts: ['ltu','xtu','ltsu','xtsu'], special: 'sokuon' });
    } else if (c === 'ん') {
      segs.push({ kana: c, opts: ['nn'], special: 'n' });
    } else {
      segs.push({ kana: c, opts: [...(SINGLE_MAP[c] || [c])], special: null });
    }
    i++;
  }

  // 後処理: っ の促音（次の子音を先頭に追加）、ん の文脈判定
  for (let j = 0; j < segs.length; j++) {
    const seg = segs[j];
    const next = segs[j + 1];
    if (seg.special === 'sokuon' && next) {
      const consonants = new Set();
      next.opts.forEach(opt => {
        if (opt.length > 0 && !'aiueo'.includes(opt[0])) consonants.add(opt[0]);
      });
      // 促音（kka など）を先頭に、ltu/xtu を後ろに
      seg.opts = [...consonants, ...seg.opts];
    }
    if (seg.special === 'n') {
      if (!next) {
        seg.opts = ['nn', 'n']; // 語末は両方OK
      } else {
        const nextFirst = next.opts[0][0];
        // 母音・n・y の前は nn のみ、子音前は n も可
        if (!'aiueoyn'.includes(nextFirst)) seg.opts = ['nn', 'n'];
        // else ['nn'] のまま
      }
    }
  }
  return segs;
}

// ===== タイピング状態 =====
let st = { segs:[], idx:0, partial:'', valid:[], done:'' };

function initTyping(furigana) {
  st.segs    = buildSegments(furigana);
  st.idx     = 0;
  st.partial = '';
  st.done    = '';
  st.valid   = st.segs.length ? [...st.segs[0].opts] : [];
}

function advanceSeg(typed) {
  st.done += typed;
  st.idx++;
  st.partial = '';
  if (st.idx < st.segs.length) st.valid = [...st.segs[st.idx].opts];
}

// 戻り値: 'correct' | 'complete' | 'wrong'
function processChar(c) {
  c = c.toLowerCase();
  if (st.idx >= st.segs.length) return 'complete';

  const newPartial = st.partial + c;
  const newValid   = st.valid.filter(opt => opt.startsWith(newPartial));

  if (newValid.length === 0) {
    // 今の partial が完全一致なら advance してリトライ（ん の n→次の子音 など）
    if (st.valid.includes(st.partial)) {
      advanceSeg(st.partial);
      return processChar(c);
    }
    return 'wrong';
  }

  const isExact   = newValid.includes(newPartial);
  const hasLonger = newValid.some(opt => opt.length > newPartial.length);

  if (isExact) {
    // ん が 'n' で一致 かつ 'nn' もまだ有効 → 保留して次の文字を待つ
    if (hasLonger && st.segs[st.idx].special === 'n') {
      st.partial = newPartial;
      st.valid   = newValid;
      return 'correct';
    }
    advanceSeg(newPartial);
    if (st.idx >= st.segs.length) return 'complete';
    return 'correct';
  }

  st.partial = newPartial;
  st.valid   = newValid;
  return 'correct';
}

// ===== 表示用データ =====
function getRomajiParts() {
  if (!st.segs.length) return { done:'', cur:'', rest:'' };
  const seg = st.segs[st.idx];
  if (!seg) return { done: st.done, cur:'', rest:'' };

  const curOpt  = st.valid[0] || '';
  const nextCh  = curOpt[st.partial.length] || '';
  const restSeg = curOpt.slice(st.partial.length + 1);
  const future  = st.segs.slice(st.idx + 1).map(s => s.opts[0]).join('');
  return { done: st.done + st.partial, cur: nextCh, rest: restSeg + future };
}

function getNextKey() {
  return getRomajiParts().cur.toUpperCase() || null;
}

// ===== UI 更新 =====
let score    = 0;
let wordPool = [];

function updateDisplay() {
  const { done, cur, rest } = getRomajiParts();
  document.getElementById('romaji-disp').innerHTML =
    `<span class="r-typed">${done}</span>` +
    `<span class="r-current">${cur}</span>` +
    `<span class="r-remain">${rest}</span>`;

  document.querySelectorAll('.key').forEach(k => k.classList.remove('hit'));
  const nk = getNextKey();
  if (nk) { const el = document.getElementById('key-' + nk); if (el) el.classList.add('hit'); }
}

// ===== 星を生成 =====
function makeStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.8;
    s.style.cssText = `
      left:${Math.random()*100}%;top:${Math.random()*70}%;
      width:${size}px;height:${size}px;
      --d:${(Math.random()*3+1.5).toFixed(1)}s;
      --delay:${(Math.random()*4).toFixed(1)}s;
      --bright:${(Math.random()*0.5+0.3).toFixed(2)};
    `;
    container.appendChild(s);
  }
}

// ===== キーボード構築 =====
function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KEY_ROWS.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'key-row';
    row.forEach(k => {
      const div = document.createElement('div');
      div.className = 'key';
      div.id = 'key-' + k;
      div.textContent = k;
      div.addEventListener('pointerdown', () => onVirtualKey(k));
      rowDiv.appendChild(div);
    });
    kb.appendChild(rowDiv);
  });
}

// ===== 次の単語をロード =====
function loadWord() {
  if (wordPool.length === 0) wordPool = [...WORDS].sort(() => Math.random() - 0.5);
  const word = wordPool.pop();
  document.getElementById('kanji-disp').textContent    = word.kanji;
  document.getElementById('furigana-disp').textContent = word.furigana;
  initTyping(word.furigana);
  updateDisplay();
}

// ===== キー入力処理 =====
function onKey(ch) {
  const result = processChar(ch);
  if (result === 'wrong') {
    const kEl = document.getElementById('kanji-disp');
    kEl.classList.add('wrong');
    setTimeout(() => kEl.classList.remove('wrong'), 180);
  } else {
    updateDisplay();
    if (result === 'complete') {
      score++;
      document.getElementById('score-val').textContent = score;
      setTimeout(loadWord, 280);
    }
  }
}

function onVirtualKey(k) { onKey(k); }

function handleKeyDown(e) {
  if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) onKey(e.key);
}

// ===== 画面切り替え =====
function startGame() {
  document.getElementById('home-screen').classList.add('fade-out');
  document.getElementById('typing-screen').classList.add('active');
  score = 0;
  document.getElementById('score-val').textContent = '0';
  wordPool = [];
  buildKeyboard();
  loadWord();
  document.addEventListener('keydown', handleKeyDown);
}

function stopGame() {
  document.getElementById('typing-screen').classList.remove('active');
  document.getElementById('home-screen').classList.remove('fade-out');
  document.removeEventListener('keydown', handleKeyDown);
}

// ===== 初期化 =====
makeStars();
document.getElementById('home-screen').addEventListener('click', startGame);
document.getElementById('stop-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  stopGame();
});
</script>
