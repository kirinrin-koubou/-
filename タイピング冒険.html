<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>タイピング冒険</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { width:100vw; height:100vh; overflow:hidden; font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif; }

    /* ===== ホーム画面 ===== */
    #home-screen {
      position:absolute; inset:0;
      transition:opacity .4s;
    }
    #home-screen.fade-out { opacity:0; pointer-events:none; }
    .map-svg { width:100%; height:100%; display:block; }

    /* 地図上のタブボタン */
    .map-tab {
      position:absolute; z-index:10;
      padding:9px 18px;
      border-radius:10px;
      font-size:clamp(.9rem,3.8vw,1.15rem);
      font-weight:900; letter-spacing:2px;
      cursor:pointer; border:2.5px solid transparent;
      box-shadow:0 4px 10px rgba(0,0,0,.45);
      transition:transform .15s,box-shadow .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .map-tab:active { transform:scale(.95); box-shadow:0 2px 5px rgba(0,0,0,.4); }

    /* ばっさい：緑・右上の森エリア */
    .tab-bassai {
      top:6%; right:3%;
      background:linear-gradient(160deg,#4aaa28,#2d7a18);
      color:#fff;
      border-color:#1d5a08;
      text-shadow:0 1px 3px rgba(0,0,0,.4);
    }
    /* はっくつ：灰色・左上の洞窟エリア */
    .tab-hakkutsu {
      top:24%; left:3%;
      background:linear-gradient(160deg,#888,#666);
      color:#7adaff;
      border-color:#444;
    }

    @keyframes smoke {
      0%   { transform:translateY(0)    scale(1);   opacity:.6; }
      100% { transform:translateY(-18px) scale(1.5); opacity:0;  }
    }
    .smoke1 { animation:smoke 2.2s ease-out infinite; }
    .smoke2 { animation:smoke 2.2s ease-out .9s infinite; }

    /* ===== 共通タイピング画面 ===== */
    .typing-screen {
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center;
      opacity:0; pointer-events:none;
      transition:opacity .35s;
    }
    .typing-screen.active { opacity:1; pointer-events:all; }

    .back-btn {
      position:absolute; top:14px; right:14px;
      border:1.5px solid rgba(255,255,255,.5);
      color:#fff; background:rgba(255,255,255,.1);
      padding:7px 18px; border-radius:20px;
      font-size:.85rem; cursor:pointer; letter-spacing:1px;
      transition:background .2s;
    }
    .back-btn:hover { background:rgba(255,255,255,.2); }

    .mode-label {
      position:absolute; top:18px; left:16px;
      font-size:clamp(.9rem,3.8vw,1.2rem);
      font-weight:900; letter-spacing:2px;
    }

    /* カウンター */
    .counter-area {
      position:absolute; top:46px; left:16px;
      font-size:clamp(.8rem,3.2vw,1rem);
      font-weight:700;
    }
    .counter-num {
      font-size:clamp(1rem,4vw,1.4rem);
      font-weight:900;
    }

    /* 単語パネル */
    .word-panel {
      margin-top:clamp(55px,15vh,100px);
      text-align:center;
      padding:20px 32px 24px;
      border-radius:18px;
      min-width:min(300px,82vw);
      backdrop-filter:blur(6px);
    }

    .furigana-text {
      font-size:clamp(.95rem,3.8vw,1.3rem);
      letter-spacing:4px;
      margin-bottom:5px;
      min-height:1.6em;
    }
    /* 小文字かな（ゃゅょ等）を小さく表示 */
    .furigana-text .sk {
      font-size:.65em;
      vertical-align:top;
      line-height:1.9;
    }

    .kanji-text {
      font-size:clamp(2.6rem,11vw,4.5rem);
      font-weight:900; line-height:1.1;
      transition:color .15s,text-shadow .15s;
    }
    .kanji-text.wrong   { color:#e74c3c !important; }
    .kanji-text.correct { color:#2ecc71 !important; }

    .romaji-text {
      margin-top:12px;
      font-size:clamp(1.1rem,4.5vw,1.8rem);
      letter-spacing:5px; font-weight:700;
      min-height:1.8em;
      display:flex; justify-content:center; align-items:center;
    }
    .r-typed   { color:#2ecc71; }
    .r-current { color:#f1c40f; text-decoration:underline; text-underline-offset:4px; }
    .r-remain  { color:rgba(255,255,255,.3); }

    /* キーボード */
    .keyboard {
      position:absolute; bottom:14px; left:0; right:0;
      padding:0 5px;
    }
    .key-row {
      display:flex; justify-content:center;
      gap:clamp(2px,.8vw,5px);
      margin-bottom:clamp(3px,.7vw,5px);
    }
    .key {
      width:clamp(26px,8.5vw,44px); height:clamp(30px,9vw,46px);
      border-radius:7px;
      display:flex; align-items:center; justify-content:center;
      font-size:clamp(9px,2.6vw,15px); font-weight:700;
      background:rgba(160,160,180,.18);
      color:rgba(255,255,255,.4);
      border:1px solid rgba(255,255,255,.15);
      cursor:pointer; user-select:none;
      transition:background .1s,color .1s,transform .08s;
    }
    .key.hit {
      background:#f1c40f !important; color:#1a1a00 !important;
      border-color:#d4a700 !important;
      box-shadow:0 0 12px rgba(241,196,15,.7),0 2px 0 #a07800;
      transform:translateY(1px);
    }
    .key:active { transform:translateY(2px); }

    /* ===== ばっさい画面 ===== */
    #bassai-screen {
      background:
        repeating-linear-gradient(90deg,
          transparent 0,transparent 36px,rgba(0,0,0,.07) 36px,rgba(0,0,0,.07) 38px),
        repeating-linear-gradient(0deg,
          transparent 0,transparent 5px,rgba(0,0,0,.04) 5px,rgba(0,0,0,.04) 6px),
        linear-gradient(175deg,#7a4510 0%,#5a3008 40%,#6b3c10 100%);
    }
    #bassai-screen .mode-label { color:#d4ff80; }
    #bassai-screen .counter-area { color:#e8d090; }
    #bassai-screen .counter-num  { color:#ffe060; }
    #bassai-screen .word-panel {
      background:rgba(0,0,0,.38);
      border:1px solid rgba(255,200,80,.25);
    }
    #bassai-screen .furigana-text { color:#ffd080; }
    #bassai-screen .kanji-text    { color:#fff8e0; text-shadow:0 0 18px rgba(255,200,80,.5); }

    /* 材木の山 */
    #lumber-pile {
      position:absolute; bottom:125px; right:12px;
      display:flex; flex-direction:column-reverse;
      align-items:center; gap:2px;
      pointer-events:none;
    }
    .log {
      width:clamp(36px,9vw,52px); height:clamp(10px,2.5vw,16px);
      background:linear-gradient(0deg,#4a2808,#8b5a20,#6a4010);
      border-radius:8px; border:1px solid #3a2008;
      box-shadow:0 1px 4px rgba(0,0,0,.5);
      animation:logDrop .3s ease-out;
    }
    @keyframes logDrop {
      from { transform:translateY(-24px); opacity:0; }
      to   { transform:translateY(0);    opacity:1; }
    }

    /* ===== はっくつ画面 ===== */
    #hakkutsu-screen {
      background:radial-gradient(ellipse at 30% 20%,#221808 0%,#140e04 50%,#0a0702 100%);
    }
    #hakkutsu-screen .mode-label  { color:#7adaff; }
    #hakkutsu-screen .counter-area{ color:#c0e8ff; }
    #hakkutsu-screen .counter-num { color:#7adaff; }
    #hakkutsu-screen .word-panel {
      background:rgba(0,0,0,.52);
      border:1px solid rgba(100,200,255,.2);
    }
    #hakkutsu-screen .furigana-text { color:#80d0ff; }
    #hakkutsu-screen .kanji-text    { color:#e0f4ff; text-shadow:0 0 20px rgba(80,180,255,.4); }

    /* 洞窟の宝石装飾 */
    #gems-bg {
      position:absolute; inset:0;
      pointer-events:none; overflow:hidden;
    }
    .gem-deco {
      position:absolute;
      clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);
      animation:gemTwinkle var(--gd) ease-in-out infinite var(--gdelay);
    }
    @keyframes gemTwinkle {
      0%,100% { opacity:.1;  transform:scale(1);   }
      50%     { opacity:.85; transform:scale(1.25); }
    }

    /* タイマー */
    #timer-wrap {
      width:min(320px,82vw);
      margin-top:10px;
    }
    #timer-bg {
      width:100%; height:11px;
      background:rgba(255,255,255,.12);
      border-radius:6px; overflow:hidden;
    }
    #timer-fill {
      height:100%; border-radius:6px;
      background:linear-gradient(90deg,#7adaff,#40b0ff);
      transition:width .1s linear,background .4s;
    }
    #timer-fill.danger { background:linear-gradient(90deg,#ff7060,#ff3030); }
    #timer-num {
      text-align:right; margin-top:3px;
      font-size:.82rem; color:rgba(255,255,255,.55);
    }

    /* 集めた宝石の山 */
    #gem-pile {
      position:absolute; bottom:125px; right:10px;
      display:flex; flex-wrap:wrap-reverse;
      width:clamp(44px,11vw,64px);
      gap:3px; justify-content:center;
      pointer-events:none;
    }
    .gem-collected {
      width:clamp(11px,2.8vw,16px); height:clamp(11px,2.8vw,16px);
      clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);
      animation:gemPop .4s ease-out;
    }
    @keyframes gemPop {
      0%  { transform:scale(0); opacity:0; }
      60% { transform:scale(1.4); }
      100%{ transform:scale(1); opacity:1; }
    }
  </style>
</head>

<script>
// ===== 単語データ =====
const WORDS = [
  { kanji:'嵐',     furigana:'あらし'     },
  { kanji:'稲妻',   furigana:'いなずま'   },

  { kanji:'大蛇',   furigana:'おろち'     },
  { kanji:'霧',     furigana:'きり'       },
  { kanji:'荒野',   furigana:'こうや'     },
  { kanji:'大地',   furigana:'だいち'     },
  { kanji:'滝',     furigana:'たき'       },

// ===== セグメント構築 =====
function buildSegments(kana) {
  const segs = [];
  let i = 0;
  while (i < kana.length) {
    if (i + 1 < kana.length) {
      const two = kana[i] + kana[i+1];
      if (COMPOUND_MAP[two]) {
        segs.push({ kana:two, opts:[...COMPOUND_MAP[two]], special:null });
        i += 2; continue;
      }
    }
    const c = kana[i];
    if (c === 'っ')      segs.push({ kana:c, opts:['ltu','xtu','ltsu','xtsu'], special:'sokuon' });
    else if (c === 'ん') segs.push({ kana:c, opts:['nn'], special:'n' });
    else                 segs.push({ kana:c, opts:[...(SINGLE_MAP[c]||[c])], special:null });
    i++;
  }
  // 後処理: っ促音・ん文脈
  for (let j = 0; j < segs.length; j++) {
    const seg = segs[j], next = segs[j+1];
    if (seg.special === 'sokuon' && next) {
      const cs = new Set();
      next.opts.forEach(o => { if(!'aiueo'.includes(o[0])) cs.add(o[0]); });
      seg.opts = [...cs, ...seg.opts];
    }
    if (seg.special === 'n') {
      if (!next) seg.opts = ['nn','n'];
      else if (!'aiueoyn'.includes(next.opts[0][0])) seg.opts = ['nn','n'];
    }
  }
  return segs;
}

// ===== タイピング状態 =====
let st = { segs:[], idx:0, partial:'', valid:[], done:'' };

function initTyping(furigana) {
  st.segs=buildSegments(furigana); st.idx=0; st.partial=''; st.done='';
  st.valid = st.segs.length ? [...st.segs[0].opts] : [];
}

function advanceSeg(typed) {
  st.done += typed; st.idx++;  st.partial='';
  if (st.idx < st.segs.length) st.valid=[...st.segs[st.idx].opts];
}

function processChar(c) {
  c = c.toLowerCase();
  if (st.idx >= st.segs.length) return 'complete';
  const np = st.partial + c;
  const nv = st.valid.filter(o => o.startsWith(np));
  if (!nv.length) {
    if (st.valid.includes(st.partial)) { advanceSeg(st.partial); return processChar(c); }
    return 'wrong';
  }
  const exact = nv.includes(np);
  const hasLonger = nv.some(o => o.length > np.length);
  if (exact) {
    if (hasLonger && st.segs[st.idx].special==='n') { st.partial=np; st.valid=nv; return 'correct'; }
    advanceSeg(np);
    if (st.idx >= st.segs.length) return 'complete';
    return 'correct';
  }
  st.partial=np; st.valid=nv; return 'correct';
}

function getRomajiParts() {
  if (!st.segs.length) return {done:'',cur:'',rest:''};
  const seg = st.segs[st.idx];
  if (!seg) return {done:st.done,cur:'',rest:''};
  const opt = st.valid[0]||'';
  return {
    done: st.done + st.partial,
    cur:  opt[st.partial.length]||'',
    rest: opt.slice(st.partial.length+1) + st.segs.slice(st.idx+1).map(s=>s.opts[0]).join('')
  };
}
function getNextKey() { return getRomajiParts().cur.toUpperCase()||null; }

// ===== ふりがな小文字レンダリング =====
const SMALL_KANA = new Set('ぁぃぅぇぉゃゅょっ');
function renderFurigana(kana) {
  return [...kana].map(c => SMALL_KANA.has(c)
    ? `<span class="sk">${c}</span>` : c
  ).join('');
}

// ===== ゲーム状態 =====
let mode      = null; // 'bassai' | 'hakkutsu'
let lumber    = 0;
let gems      = 0;
let wordPool  = [];
let timerSec  = 15;
let timerMax  = 15;
let timerRAF  = null;
let timerStart= 0;

// IDs per mode
const IDS = {
  bassai:   { furigana:'b-furigana', kanji:'b-kanji', romaji:'b-romaji', kb:'b-keyboard' },
  hakkutsu: { furigana:'h-furigana', kanji:'h-kanji', romaji:'h-romaji', kb:'h-keyboard' },
};

// ===== キーボード構築 =====
function buildKeyboard(kbId) {
  const kb = document.getElementById(kbId);
  kb.innerHTML = '';
  KEY_ROWS.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'key-row';
    row.forEach(k => {
      const d = document.createElement('div');
      d.className='key'; d.id=kbId+'-key-'+k; d.textContent=k;
      d.addEventListener('pointerdown', ()=>onKey(k));
      rowDiv.appendChild(d);
    });
    kb.appendChild(rowDiv);
  });
}

function updateDisplay() {
  if (!mode) return;
  const ids = IDS[mode];
  const {done,cur,rest} = getRomajiParts();
  document.getElementById(ids.romaji).innerHTML =
    `<span class="r-typed">${done}</span><span class="r-current">${cur}</span><span class="r-remain">${rest}</span>`;

  const kbId = ids.kb;
  document.querySelectorAll(`#${kbId} .key`).forEach(k => k.classList.remove('hit'));
  const nk = getNextKey();
  if (nk) {
    const el = document.getElementById(kbId+'-key-'+nk);
    if (el) el.classList.add('hit');
  }
}

function loadWord() {
  if (!mode) return;
  if (!wordPool.length) wordPool = [...WORDS].sort(()=>Math.random()-.5);
  const word = wordPool.pop();
  const ids = IDS[mode];
  document.getElementById(ids.furigana).innerHTML = renderFurigana(word.furigana);
  document.getElementById(ids.kanji).textContent  = word.kanji;
  initTyping(word.furigana);
  updateDisplay();
  if (mode === 'hakkutsu') resetTimer();
}

function onKey(ch) {
  const result = processChar(ch);
  const kanjiEl = document.getElementById(IDS[mode].kanji);
  if (result === 'wrong') {
    kanjiEl.classList.add('wrong');
    setTimeout(()=>kanjiEl.classList.remove('wrong'), 180);
  } else {
    updateDisplay();
    if (result === 'complete') onWordComplete();
  }
}

function onWordComplete() {
  const kanjiEl = document.getElementById(IDS[mode].kanji);
  kanjiEl.classList.add('correct');
  setTimeout(()=>kanjiEl.classList.remove('correct'), 250);

  if (mode === 'bassai') {
    lumber++;
    document.getElementById('lumber-num').textContent = lumber;
    addLog();
  } else if (mode === 'hakkutsu') {
    stopTimer();
    gems++;
    document.getElementById('gem-num').textContent = gems;
    addGem();
  }
  setTimeout(loadWord, 300);
}

// ===== 材木を追加 =====
function addLog() {
  const pile = document.getElementById('lumber-pile');
  if (pile.children.length >= 16) pile.removeChild(pile.lastChild);
  const log = document.createElement('div');
  log.className = 'log';
  pile.prepend(log);
}

// ===== 宝石を追加 =====
const GEM_COLORS = ['#ff5555','#55aaff','#55ff88','#cc55ff','#ffcc44','#ff88cc'];
function addGem() {
  const pile = document.getElementById('gem-pile');
  if (pile.children.length >= 18) pile.removeChild(pile.lastChild);
  const g = document.createElement('div');
  g.className = 'gem-collected';
  g.style.background = GEM_COLORS[Math.floor(Math.random()*GEM_COLORS.length)];
  pile.prepend(g);
}

// ===== タイマー（はっくつ） =====
function resetTimer() {
  stopTimer();
  timerSec = timerMax;
  timerStart = performance.now();
  document.getElementById('timer-fill').style.width = '100%';
  document.getElementById('timer-fill').classList.remove('danger');
  document.getElementById('timer-num').textContent = timerMax;
  timerRAF = requestAnimationFrame(tickTimer);
}
function stopTimer() {
  if (timerRAF) { cancelAnimationFrame(timerRAF); timerRAF=null; }
}
function tickTimer(now) {
  const elapsed = (now - timerStart) / 1000;
  const remain  = Math.max(0, timerMax - elapsed);
  const pct     = (remain / timerMax) * 100;
  const fill    = document.getElementById('timer-fill');
  fill.style.width = pct + '%';
  fill.classList.toggle('danger', remain < 5);
  document.getElementById('timer-num').textContent = Math.ceil(remain);
  if (remain <= 0) { loadWord(); return; }
  timerRAF = requestAnimationFrame(tickTimer);
}

// ===== 洞窟の宝石背景を生成 =====
function buildGemsBg() {
  const bg = document.getElementById('gems-bg');
  bg.innerHTML = '';
  const positions = [
    [8,15],[18,35],[5,55],[25,70],[12,82],
    [88,8],[75,22],[92,40],[80,60],[70,75],[85,88],
    [40,5],[55,12],[45,90],[60,85],
    [30,45],[65,50],[50,70],
  ];
  positions.forEach(([left,top]) => {
    const g = document.createElement('div');
    g.className = 'gem-deco';
    const size = 8 + Math.random()*14;
    g.style.cssText = `
      left:${left}%;top:${top}%;
      width:${size}px;height:${size}px;
      background:${GEM_COLORS[Math.floor(Math.random()*GEM_COLORS.length)]};
      --gd:${(1.5+Math.random()*2.5).toFixed(1)}s;
      --gdelay:${(Math.random()*3).toFixed(1)}s;
    `;
    bg.appendChild(g);
  });
}

// ===== 画面遷移 =====
function startMode(m) {
  mode = m;
  document.getElementById('home-screen').classList.add('fade-out');
  document.getElementById(m+'-screen').classList.add('active');
  buildKeyboard(IDS[m].kb);
  if (m === 'bassai') {
    lumber = 0;
    document.getElementById('lumber-num').textContent = '0';
    document.getElementById('lumber-pile').innerHTML = '';
  } else {
    gems = 0;
    document.getElementById('gem-num').textContent = '0';
    document.getElementById('gem-pile').innerHTML = '';
    buildGemsBg();
  }
  wordPool = [];
  loadWord();
  document.addEventListener('keydown', handleKeyDown);
}

function stopMode() {
  if (!mode) return;
  stopTimer();
  document.getElementById(mode+'-screen').classList.remove('active');
  document.getElementById('home-screen').classList.remove('fade-out');
  document.removeEventListener('keydown', handleKeyDown);
  mode = null;
}

function handleKeyDown(e) {
  if (e.key.length===1 && /[a-zA-Z]/.test(e.key)) onKey(e.key);
}

// ===== 初期化 =====
document.getElementById('btn-bassai').addEventListener('click', ()=>startMode('bassai'));
document.getElementById('btn-hakkutsu').addEventListener('click', ()=>startMode('hakkutsu'));
document.getElementById('back-bassai').addEventListener('click', (e)=>{ e.stopPropagation(); stopMode(); });
document.getElementById('back-hakkutsu').addEventListener('click', (e)=>{ e.stopPropagation(); stopMode(); });
