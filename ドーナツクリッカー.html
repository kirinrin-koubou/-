<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドーナツクリッカー | Donut Clicker Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat {
            background: #f5f5f5;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            min-width: 150px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
        }

        .main-area {
            display: flex;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .clicker-section {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6cc 100%);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }

        .donut-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            font-size: 80px;
            cursor: pointer;
            background: #fff;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 20px 0;
        }

        .donut-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .donut-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .click-bonus {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
        }

        .shop-section {
            flex: 1;
            min-width: 280px;
        }

        .section-title {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .item {
            background: #f9f9f9;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f0f0f0;
        }

        .item.disabled:hover {
            border-color: #eee;
            box-shadow: none;
            transform: none;
        }

        .item-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .item-name {
            font-weight: bold;
            color: #333;
            font-size: 0.9em;
            margin-bottom: 8px;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-count {
            color: #999;
            font-size: 0.8em;
            margin-bottom: 8px;
        }

        .item-cost {
            background: #667eea;
            color: white;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.85em;
        }

        .item.purchased .item-cost {
            background: #4caf50;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .footer {
            text-align: center;
            color: #999;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .stats {
                gap: 20px;
            }

            .main-area {
                gap: 20px;
                margin: 20px 0;
            }

            .donut-button {
                width: 120px;
                height: 120px;
                font-size: 60px;
            }

            .shop-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍩 ドーナツクリッカー 🍩</h1>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">ドーナツ</div>
                    <div class="stat-value" id="donutCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">毎秒</div>
                    <div class="stat-value" id="dpsDisplay">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">合計獲得</div>
                    <div class="stat-value" id="totalEarned">0</div>
                </div>
            </div>
        </div>

        <div class="main-area">
            <div class="clicker-section">
                <h2>クリックしてください！</h2>
                <button class="donut-button" id="donutButton">🍩</button>
                <div class="click-bonus" id="clickBonus">+1 per click</div>
            </div>

            <div class="shop-section">
                <h2 class="section-title">👷 ワーカー</h2>
                <div class="shop-grid" id="workersGrid"></div>

                <h2 class="section-title" style="margin-top: 30px;">⭐ アップグレード</h2>
                <div class="shop-grid" id="upgradesGrid"></div>
            </div>
        </div>

        <div class="footer">
            <p>ゲーム状態は自動保存されます | Game progress is automatically saved</p>
        </div>
    </div>

    <script>
        // ============================================
        // GAME STATE
        // ============================================
        const gameState = {
            donuts: 0,
            donutsPerClick: 1,
            donutsPerSecond: 0,
            totalEarned: 0,
            workers: {
                baker: {
                    name: '🧑‍🍳 ベーカー',
                    count: 0,
                    production: 0.1,
                    baseCost: 10,
                    description: '毎秒0.1個'
                },
                assistant: {
                    name: '👔 アシスタント',
                    count: 0,
                    production: 0.5,
                    baseCost: 100,
                    description: '毎秒0.5個'
                },
                manager: {
                    name: '💼 マネージャー',
                    count: 0,
                    production: 2,
                    baseCost: 1000,
                    description: '毎秒2個'
                },
                chef: {
                    name: '🍳 シェフ',
                    count: 0,
                    production: 10,
                    baseCost: 10000,
                    description: '毎秒10個'
                },
                factory: {
                    name: '🏭 ドーナツ工場',
                    count: 0,
                    production: 50,
                    baseCost: 100000,
                    description: '毎秒50個'
                }
            },
            upgrades: {
                betterOven: {
                    name: '⭐ より良いオーブン',
                    cost: 50,
                    multiplier: 2,
                    purchased: false,
                    description: 'クリック力を2倍に'
                },
                goldenSpoon: {
                    name: '🥄 ゴールデンスプーン',
                    cost: 500,
                    multiplier: 2,
                    purchased: false,
                    description: 'クリック力を2倍に'
                },
                magicHands: {
                    name: '✨ 魔法の手',
                    cost: 5000,
                    multiplier: 2,
                    purchased: false,
                    description: 'クリック力を2倍に'
                },
                powerBelt: {
                    name: '⚡ パワーベルト',
                    cost: 50000,
                    multiplier: 3,
                    purchased: false,
                    description: 'クリック力を3倍に'
                }
            }
        };

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return Math.floor(num).toString();
        }

        function getWorkerCost(workerType) {
            const worker = gameState.workers[workerType];
            return Math.floor(worker.baseCost * Math.pow(1.15, worker.count));
        }

        function calculateTotalDPS() {
            let dps = 0;
            for (let workerType in gameState.workers) {
                const worker = gameState.workers[workerType];
                dps += worker.count * worker.production;
            }
            return dps;
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // ============================================
        // SAVE/LOAD SYSTEM
        // ============================================
        function saveGameState() {
            localStorage.setItem('donutClickerSave', JSON.stringify(gameState));
        }

        function loadGameState() {
            const saved = localStorage.getItem('donutClickerSave');
            if (saved) {
                Object.assign(gameState, JSON.parse(saved));
            }
        }

        // ============================================
        // GAME MECHANICS
        // ============================================
        function handleDonutClick() {
            gameState.donuts += gameState.donutsPerClick;
            gameState.totalEarned += gameState.donutsPerClick;
            updateUI();
        }

        function buyWorker(workerType) {
            const worker = gameState.workers[workerType];
            const cost = getWorkerCost(workerType);

            if (gameState.donuts >= cost) {
                gameState.donuts -= cost;
                worker.count += 1;
                gameState.donutsPerSecond = calculateTotalDPS();
                showNotification(`🎉 ${worker.name} を雇いました！`);
                updateUI();
                saveGameState();
            } else {
                showNotification(`❌ あと ${formatNumber(cost - gameState.donuts)} 個必要です`);
            }
        }

        function buyUpgrade(upgradeName) {
            const upgrade = gameState.upgrades[upgradeName];

            if (upgrade.purchased) {
                showNotification('✨ このアップグレードは既に購入済みです');
                return;
            }

            if (gameState.donuts >= upgrade.cost) {
                gameState.donuts -= upgrade.cost;
                gameState.donutsPerClick *= upgrade.multiplier;
                upgrade.purchased = true;
                showNotification(`⭐ ${upgrade.name} をアンロック！`);
                updateUI();
                saveGameState();
            } else {
                showNotification(`❌ あと ${formatNumber(upgrade.cost - gameState.donuts)} 個必要です`);
            }
        }

        // ============================================
        // UI UPDATES
        // ============================================
        function updateUI() {
            // Update counters
            document.getElementById('donutCount').textContent = formatNumber(gameState.donuts);
            document.getElementById('dpsDisplay').textContent = formatNumber(gameState.donutsPerSecond) + '/sec';
            document.getElementById('totalEarned').textContent = formatNumber(gameState.totalEarned);
            document.getElementById('clickBonus').textContent = `+${gameState.donutsPerClick} per click`;

            // Update workers grid
            const workersGrid = document.getElementById('workersGrid');
            workersGrid.innerHTML = '';
            for (let workerType in gameState.workers) {
                const worker = gameState.workers[workerType];
                const cost = getWorkerCost(workerType);
                const canAfford = gameState.donuts >= cost;

                const item = document.createElement('div');
                item.className = 'item' + (canAfford ? '' : ' disabled');
                item.innerHTML = `
                    <div class="item-icon">${worker.name.split(' ')[0]}</div>
                    <div class="item-name">${worker.name.split(' ').slice(1).join(' ')}</div>
                    <div class="item-count">所有: ${worker.count}</div>
                    <div class="item-cost">${formatNumber(cost)}</div>
                `;
                item.onclick = canAfford ? () => buyWorker(workerType) : null;
                workersGrid.appendChild(item);
            }

            // Update upgrades grid
            const upgradesGrid = document.getElementById('upgradesGrid');
            upgradesGrid.innerHTML = '';
            for (let upgradeName in gameState.upgrades) {
                const upgrade = gameState.upgrades[upgradeName];
                if (upgrade.purchased) continue; // Hide purchased upgrades

                const canAfford = gameState.donuts >= upgrade.cost;
                const item = document.createElement('div');
                item.className = 'item' + (canAfford ? '' : ' disabled');
                item.innerHTML = `
                    <div class="item-icon">${upgrade.name.split(' ')[0]}</div>
                    <div class="item-name">${upgrade.name.split(' ').slice(1).join(' ')}</div>
                    <div class="item-count">${upgrade.description}</div>
                    <div class="item-cost">${formatNumber(upgrade.cost)}</div>
                `;
                item.onclick = canAfford ? () => buyUpgrade(upgradeName) : null;
                upgradesGrid.appendChild(item);
            }
        }

        // ============================================
        // GAME LOOP
        // ============================================
        let lastSaveTime = Date.now();

        function gameLoop() {
            const now = Date.now();
            const deltaTime = (now - lastSaveTime) / 1000; // Convert to seconds

            // Add production
            if (gameState.donutsPerSecond > 0) {
                gameState.donuts += gameState.donutsPerSecond * deltaTime;
                gameState.totalEarned += gameState.donutsPerSecond * deltaTime;
            }

            // Auto-save every 5 seconds
            if (now - lastSaveTime > 5000) {
                saveGameState();
                lastSaveTime = now;
            }

            updateUI();
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadGameState();
            gameState.donutsPerSecond = calculateTotalDPS();

            // Attach event listeners
            document.getElementById('donutButton').addEventListener('click', handleDonutClick);

            updateUI();
            gameLoop();
        });
    </script>
</body>
</html>
