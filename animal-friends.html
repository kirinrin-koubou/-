<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アニマルフレンズ - Animal Friends</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a1020; font-family:"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif; color:#fff; user-select:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; }

  /* ====== Loading ====== */
  #loading { position:fixed; inset:0; background:linear-gradient(160deg,#1b2a4a,#0a1020); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9000; }
  #loading h1 { font-size:42px; letter-spacing:4px; background:linear-gradient(90deg,#7ad7ff,#9affc4,#ffe27a); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:6px; }
  #loading .sub { color:#9fb3d8; margin-bottom:24px; font-size:14px; }
  .bar { width:280px; height:10px; border-radius:6px; background:#22304f; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#5ad1ff,#7affb0); transition:width .25s; }
  #loading .tip { margin-top:18px; color:#7e93bb; font-size:12px; max-width:320px; text-align:center; line-height:1.6; }

  /* ====== Home ====== */
  #home { position:fixed; inset:0; z-index:8000; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 18%, rgba(120,200,255,.25), transparent 60%), linear-gradient(170deg,#244a7a 0%, #14264a 55%, #0a1530 100%); }
  #home .logo { font-size:60px; font-weight:800; letter-spacing:6px; text-shadow:0 6px 24px rgba(0,0,0,.5);
    background:linear-gradient(90deg,#9be8ff,#b6ffd0,#ffe9a3); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #home .logo small { display:block; font-size:16px; letter-spacing:8px; color:#bcd6ff; -webkit-text-fill-color:#bcd6ff; margin-top:8px; text-align:center; }
  #home .menuwrap { margin-top:42px; display:flex; flex-direction:column; gap:14px; width:300px; }
  .homebtn { padding:15px 18px; border-radius:14px; border:1px solid rgba(255,255,255,.18); cursor:pointer;
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); color:#fff; font-size:18px; font-weight:600;
    display:flex; align-items:center; gap:12px; transition:transform .12s, background .2s; backdrop-filter: blur(4px); }
  .homebtn:hover { transform:translateY(-2px); background:linear-gradient(180deg, rgba(140,210,255,.35), rgba(140,210,255,.12)); }
  .homebtn .ic { font-size:22px; }
  #home .foot { position:absolute; bottom:18px; color:#9ab3da; font-size:12px; }
  .floatleaf { position:absolute; font-size:26px; opacity:.5; animation:fall linear infinite; }
  @keyframes fall { 0%{ transform:translateY(-40px) rotate(0deg);} 100%{ transform:translateY(110vh) rotate(360deg);} }

  /* ====== HUD ====== */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:500; display:none; }
  #topleft { position:absolute; top:12px; left:12px; background:rgba(10,20,40,.55); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:10px 14px; min-width:170px; backdrop-filter:blur(6px); }
  #topleft .row { display:flex; align-items:center; gap:8px; font-size:14px; margin:3px 0; }
  #topleft .row .k { color:#9fc6ff; width:54px; }
  #topleft .clock { font-size:22px; font-weight:700; letter-spacing:1px; }
  #minimap { position:absolute; right:12px; bottom:12px; width:150px; height:150px; border-radius:12px; overflow:hidden;
    border:2px solid rgba(255,255,255,.25); background:#0a1830; box-shadow:0 6px 24px rgba(0,0,0,.4); }
  #minimap canvas { width:100%; height:100%; }
  #modebadge { position:absolute; left:12px; bottom:12px; background:rgba(10,20,40,.6); border:1px solid rgba(255,255,255,.14);
    border-radius:12px; padding:8px 14px; font-size:14px; font-weight:600; }
  #modebadge .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#6affb0; margin-right:6px; vertical-align:middle; }

  #itembar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; pointer-events:auto; }
  .slot { width:56px; height:56px; border-radius:12px; background:rgba(10,20,40,.6); border:2px solid rgba(255,255,255,.16);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:24px; position:relative; transition:.15s; }
  .slot small { font-size:9px; color:#bcd; position:absolute; bottom:2px; }
  .slot.sel { border-color:#7affb0; box-shadow:0 0 14px rgba(120,255,170,.5); transform:translateY(-4px); }

  #tabbar { position:absolute; bottom:78px; left:50%; transform:translateX(-50%); display:flex; gap:8px; pointer-events:auto; }
  .tab { padding:7px 12px; border-radius:10px; background:rgba(10,20,40,.55); border:1px solid rgba(255,255,255,.14);
    font-size:12px; cursor:pointer; transition:.15s; }
  .tab:hover { background:rgba(120,200,255,.3); }

  /* ====== Panels ====== */
  .panel { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; pointer-events:auto; }
  .panel .bg { position:absolute; inset:0; background:rgba(4,10,24,.6); backdrop-filter:blur(3px); }
  .card { position:relative; z-index:2; width:min(880px,94vw); max-height:88vh; overflow:auto; border-radius:18px;
    background:linear-gradient(180deg,#1a2c50,#101d38); border:1px solid rgba(255,255,255,.16); box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .card .head { position:sticky; top:0; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    background:linear-gradient(180deg,#22386a,#1a2c50); border-bottom:1px solid rgba(255,255,255,.12); }
  .card .head h2 { font-size:22px; letter-spacing:1px; }
  .card .body { padding:18px 20px; }
  .closebtn { width:36px; height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08);
    color:#fff; font-size:18px; cursor:pointer; }
  .closebtn:hover { background:rgba(255,120,120,.3); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; }
  .item { border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); transition:.12s; }
  .item:hover { background:rgba(120,200,255,.28); transform:translateY(-2px); }
  .item.active { border-color:#7affb0; box-shadow:0 0 0 2px rgba(120,255,170,.4) inset; }
  .item .ic { font-size:30px; line-height:1.2; }
  .item .nm { font-size:11px; color:#cfe0ff; margin-top:4px; }
  .item .sw { width:100%; height:14px; border-radius:6px; margin-top:6px; border:1px solid rgba(0,0,0,.3); }

  .seg { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .segbtn { padding:8px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
    cursor:pointer; font-size:13px; }
  .segbtn.on { background:linear-gradient(180deg,#3aa0ff,#1f6fd6); border-color:#7ec8ff; }

  table.dex { width:100%; border-collapse:collapse; font-size:13px; }
  table.dex th, table.dex td { padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.1); text-align:left; }
  table.dex th { color:#9fc6ff; position:sticky; top:64px; background:#1a2c50; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:rgba(120,200,255,.2); margin:1px; }
  .found { color:#7affb0; } .lost { color:#7d8db0; }

  .row2 { display:flex; gap:16px; flex-wrap:wrap; }
  .col { flex:1; min-width:220px; }
  label.set { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px; }
  input[type=range]{ width:140px; }
  .toggle { width:52px; height:28px; border-radius:999px; background:#33456e; position:relative; cursor:pointer; transition:.2s; border:1px solid rgba(255,255,255,.2); }
  .toggle.on { background:#3aa0ff; }
  .toggle i { position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; }
  .toggle.on i { left:26px; }

  .btn { padding:10px 16px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:linear-gradient(180deg,#3aa0ff,#1f6fd6);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:rgba(255,255,255,.08); }
  .btn:hover { filter:brightness(1.08); }

  /* ====== Dialog ====== */
  #dialog { position:fixed; left:50%; bottom:120px; transform:translateX(-50%); width:min(620px,92vw); z-index:1500;
    background:rgba(8,16,34,.92); border:2px solid rgba(140,210,255,.5); border-radius:16px; padding:16px 20px; display:none; pointer-events:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #dialog .nm { color:#9affc4; font-weight:700; margin-bottom:6px; font-size:15px; }
  #dialog .tx { font-size:15px; line-height:1.7; min-height:48px; }
  #dialog .hint { text-align:right; font-size:12px; color:#9ab3da; margin-top:8px; }

  #toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toastmsg { background:rgba(10,22,46,.92); border:1px solid rgba(140,210,255,.5); border-radius:12px; padding:10px 18px; font-size:14px;
    animation:tin .3s ease, tout .4s ease 2.6s forwards; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  @keyframes tin { from{opacity:0; transform:translateY(-12px);} } @keyframes tout { to{opacity:0; transform:translateY(-12px);} }

  /* ====== Event flash ====== */
  #eventbanner { position:fixed; top:30%; left:50%; transform:translate(-50%,-50%); z-index:1800; text-align:center; display:none; pointer-events:none; }
  #eventbanner .big { font-size:46px; font-weight:800; text-shadow:0 4px 20px rgba(0,0,0,.6);
    background:linear-gradient(90deg,#ffe9a3,#9be8ff,#b6ffd0); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop .6s ease; }
  #eventbanner .small { color:#dfeaff; font-size:16px; margin-top:6px; }
  @keyframes pop { 0%{transform:scale(.6); opacity:0;} 60%{transform:scale(1.1);} 100%{transform:scale(1); opacity:1;} }

  /* ====== Mobile controls ====== */
  #mobile { position:fixed; inset:0; z-index:600; pointer-events:none; display:none; }
  #pad { position:absolute; left:22px; bottom:96px; width:140px; height:140px; pointer-events:auto; }
  #pad .base { position:absolute; inset:0; border-radius:50%; background:rgba(10,22,46,.45); border:2px solid rgba(255,255,255,.22); }
  #pad .stick { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #bfe6ff, #4d9be0); border:2px solid rgba(255,255,255,.6); }
  .mbtn { position:absolute; pointer-events:auto; width:62px; height:62px; border-radius:50%; background:rgba(20,40,80,.6);
    border:2px solid rgba(255,255,255,.3); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .mbtn:active { background:rgba(120,200,255,.6); }
  #mb_jump { right:24px; bottom:150px; } #mb_act { right:96px; bottom:96px; } #mb_dash { right:24px; bottom:80px; }
  #mb_cam { right:96px; bottom:170px; width:50px; height:50px; font-size:11px; }
  #camjoy { position:absolute; right:22px; top:90px; width:96px; height:96px; pointer-events:auto; display:none; }
  #camjoy .base { position:absolute; inset:0; border-radius:50%; background:rgba(10,22,46,.4); border:2px solid rgba(255,255,255,.2); }
  #camjoy .stick { position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; background:#7ec8ff; }

  .help { font-size:12px; color:#9fb3d8; line-height:1.8; }
  .kbd { display:inline-block; padding:1px 7px; border-radius:6px; background:#2a3c63; border:1px solid rgba(255,255,255,.2); font-size:11px; margin:0 2px; }
  .crafthint { font-size:12px; color:#9fb3d8; margin-top:4px; }
  .matline { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .progressbar { height:8px; border-radius:5px; background:#22304f; overflow:hidden; margin-top:8px; }
  .progressbar > i { display:block; height:100%; background:linear-gradient(90deg,#5ad1ff,#7affb0); }
  .resbar { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; margin-bottom:14px; }
  .resbar span { background:rgba(255,255,255,.06); padding:6px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.12); }
</style>
</head>
<body>
<div id="game"></div>

<!-- Loading -->
<div id="loading">
  <h1>アニマルフレンズ</h1>
  <div class="sub">Animal Friends — ほのぼの3D島づくりシミュレーション</div>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="tip" id="loadtip">島を生成しています…</div>
</div>

<!-- Home -->
<div id="home">
  <div class="logo">アニマルフレンズ<small>A N I M A L &nbsp; F R I E N D S</small></div>
  <div class="menuwrap">
    <div class="homebtn" data-home="continue"><span class="ic">🌱</span> 続きから / はじめる</div>
    <div class="homebtn" data-home="craft"><span class="ic">🔨</span> いまのクラフト家具</div>
    <div class="homebtn" data-home="dex"><span class="ic">📖</span> 動物図鑑</div>
    <div class="homebtn" data-home="house"><span class="ic">🏠</span> 家カスタマイズ</div>
    <div class="homebtn" data-home="settings"><span class="ic">⚙️</span> 設定</div>
  </div>
  <div class="foot">© Animal Friends — ↑↓←→で移動 / WASDでカメラ / クリックで調べる</div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="topleft">
    <div class="clock" id="hudClock">06:00</div>
    <div class="row"><span class="k">天気</span><span id="hudWeather">☀ 快晴</span></div>
    <div class="row"><span class="k">季節</span><span id="hudSeason">🌸 春</span></div>
    <div class="row"><span class="k">島評価</span><span id="hudRating">★☆☆☆☆</span></div>
  </div>
  <div id="minimap"><canvas id="mmcanvas" width="150" height="150"></canvas></div>
  <div id="modebadge"><span class="dot"></span><span id="modeText">さんぽモード</span></div>
  <div id="tabbar">
    <div class="tab" data-tab="terrain">🏔 地形編集</div>
    <div class="tab" data-tab="ground">🟩 地面編集</div>
    <div class="tab" data-tab="nature">🌳 自然</div>
    <div class="tab" data-tab="craft">🔨 クラフト</div>
    <div class="tab" data-tab="menu">📋 メニュー(M)</div>
  </div>
  <div id="itembar"></div>
</div>

<!-- Mobile controls -->
<div id="mobile">
  <div id="pad"><div class="base"></div><div class="stick" id="padStick"></div></div>
  <div id="camjoy"><div class="base"></div><div class="stick" id="camStick"></div></div>
  <div class="mbtn" id="mb_jump">JUMP</div>
  <div class="mbtn" id="mb_act">調べる</div>
  <div class="mbtn" id="mb_dash">DASH</div>
  <div class="mbtn" id="mb_cam">CAM</div>
</div>

<!-- Dialog -->
<div id="dialog"><div class="nm" id="dlgName"></div><div class="tx" id="dlgText"></div><div class="hint">クリック/Zで次へ ・ Xで戻る</div></div>

<!-- Toast & banners -->
<div id="toast"></div>
<div id="eventbanner"><div class="big" id="evBig"></div><div class="small" id="evSmall"></div></div>

<!-- Panels (filled by JS) -->
<div class="panel" id="panel_menu"></div>
<div class="panel" id="panel_terrain"></div>
<div class="panel" id="panel_ground"></div>
<div class="panel" id="panel_nature"></div>
<div class="panel" id="panel_craft"></div>
<div class="panel" id="panel_dex"></div>
<div class="panel" id="panel_house"></div>
<div class="panel" id="panel_settings"></div>
<div class="panel" id="panel_map"></div>

 *  4. 地形生成
 * ------------------------------------------------------------------ */
function genWorld(){
  State.height = []; State.block = []; State.natureMap = {}; State.animals = []; State.furniture = [];
  // simple multi-octave value noise via random + smoothing
  let raw=[];
  for(let x=0;x<GW;x++){ raw[x]=[]; for(let z=0;z<GH;z++) raw[x][z]=Math.random(); }
  const smooth=(src)=>{ let out=[]; for(let x=0;x<GW;x++){out[x]=[];for(let z=0;z<GH;z++){
    let s=0,c=0; for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){const nx=x+dx,nz=z+dz; if(nx>=0&&nx<GW&&nz>=0&&nz<GH){s+=src[nx][nz];c++;}}
    out[x][z]=s/c; }} return out; };
  for(let i=0;i<3;i++) raw=smooth(raw);
  const cx=GW/2, cz=GH/2;
  for(let x=0;x<GW;x++){
    State.height[x]=[]; State.block[x]=[];
    for(let z=0;z<GH;z++){
      // island falloff
      const d = dist2(x,z,cx,cz)/(GW/2);
      const fall = clamp(1.1 - d*1.25, 0, 1);
      let h = Math.round( (raw[x][z]*4) * fall );
      h = clamp(h, 0, MAXY);
      // central plain (starting meadow) flatter
      if(d<0.22) h = clamp(h,1,2);
      State.height[x][z] = h;
      // pick ground type
      let b="grass";
      if(d>0.92) b="water";
      else if(d>0.84) b="beach";
      else if(h>=4) b="stone";
      else if(h>=3) b="gravel";
      else if(h===0 && d>0.6) b="sand";
      else b = choice(["grass","grass","grass2","grass3","meadow"]);
      State.block[x][z]=b;
    }
  }
  // a small starting river from center to edge
  let rx=Math.floor(cx), rz=Math.floor(cz)+2;
  for(let i=0;i<26;i++){
    if(rx>1&&rx<GW-1&&rz>1&&rz<GH-1){
      State.block[rx][rz]="water"; State.height[rx][rz]=0;
      State.block[rx+1][rz]="water"; State.height[rx+1][rz]=0;
    }
    rz += 1; rx += randi(-1,1);
    rx=clamp(rx,2,GW-2); if(rz>=GH-2) break;
  }
  // scatter starter forest & flowers
  for(let i=0;i<60;i++){
    const x=randi(4,GW-5), z=randi(4,GH-5);
    if(State.block[x][z]==="water") continue;
    const key=x+","+z;
    if(State.natureMap[key]) continue;
    const r=Math.random();
    if(r<0.4) placeNatureData(x,z,"oak");
    else if(r<0.55) placeNatureData(x,z,"pine");
    else if(r<0.7) placeNatureData(x,z,"bush");
    else if(r<0.85) placeNatureData(x,z, choice(["flower_r","flower_y","flower_b","flower_p","flower_w"]));
    else placeNatureData(x,z,"grass_t");
  }
}
function placeNatureData(x,z,id){
  const def = NATURE.find(n=>n.id===id); if(!def) return;
  State.natureMap[x+","+z] = {id, x, z, grow:0.6+Math.random()*0.4};
}

/* --- terrain mesh build (instanced-ish via merged boxes per column) --- */
let groundMat = {};
function getGroundMat(blockId){
  if(groundMat[blockId]) return groundMat[blockId];
  const def = GROUND_BLOCKS.find(b=>b.id===blockId) || {col:0x5fa845};
  const m = new THREE.MeshLambertMaterial({color:def.col});
  groundMat[blockId]=m; return m;
}
let columnMeshes=[]; // columnMeshes[x][z]
function buildTerrainMesh(){
  // clear
  while(worldGroup.children.length) worldGroup.remove(worldGroup.children[0]);
  waterMeshes.length=0;
  columnMeshes=[];
  const boxGeo = new THREE.BoxGeometry(CELL, 1, CELL);
  for(let x=0;x<GW;x++){
    columnMeshes[x]=[];
    for(let z=0;z<GH;z++){
      const h = State.height[x][z];
      const b = State.block[x][z];
      const isWater = b==="water";
      const top = Math.max(h,1);
      const mat = isWater ? getGroundMat("sand") : getGroundMat(b);
      const colH = isWater ? 1 : Math.max(h,1);
      const mesh = new THREE.Mesh(boxGeo, mat);
      mesh.scale.y = colH;
      mesh.position.set(x-GW/2, colH/2 - 1, z-GH/2);
      mesh.receiveShadow=true; mesh.castShadow=(colH>1);
      mesh.userData={x,z};
      worldGroup.add(mesh);
      columnMeshes[x][z]=mesh;
      if(isWater){
        const wm = new THREE.Mesh(boxGeo, waterMaterial());
        wm.scale.y=0.2; wm.position.set(x-GW/2, 0.0, z-GH/2);
        wm.userData={x,z,water:true};
        worldGroup.add(wm); waterMeshes.push(wm);
      }
    }
  }
}
let _waterMat=null;
function waterMaterial(){
  if(_waterMat) return _waterMat;
  _waterMat = new THREE.MeshLambertMaterial({color:0x3aa0e0, transparent:true, opacity:0.78});
  return _waterMat;
}
function rebuildColumn(x,z){
  // remove old water mesh for cell if any
  const old = columnMeshes[x] && columnMeshes[x][z];
  if(old){ worldGroup.remove(old); }
  // remove associated water
  for(let i=waterMeshes.length-1;i>=0;i--){ const w=waterMeshes[i]; if(w.userData.x===x&&w.userData.z===z){ worldGroup.remove(w); waterMeshes.splice(i,1);} }
  const boxGeo = new THREE.BoxGeometry(CELL,1,CELL);
  const h=State.height[x][z], b=State.block[x][z];
  const isWater=b==="water";
  const colH=isWater?1:Math.max(h,1);
  const mat=isWater?getGroundMat("sand"):getGroundMat(b);
  const mesh=new THREE.Mesh(boxGeo,mat);
  mesh.scale.y=colH; mesh.position.set(x-GW/2, colH/2-1, z-GH/2);
  mesh.receiveShadow=true; mesh.castShadow=(colH>1); mesh.userData={x,z};
  worldGroup.add(mesh); columnMeshes[x][z]=mesh;
  if(isWater){ const wm=new THREE.Mesh(boxGeo,waterMaterial()); wm.scale.y=0.2; wm.position.set(x-GW/2,0,z-GH/2); wm.userData={x,z,water:true}; worldGroup.add(wm); waterMeshes.push(wm); }
}
function groundTopY(x,z){
  if(x<0||x>=GW||z<0||z>=GH) return 0;
  const b=State.block[x][z];
  if(b==="water") return 0.1;
  return Math.max(State.height[x][z],1) - 1 + 0.0; // top surface world Y (mesh top)
}
function surfaceY(x,z){ // world Y of walkable top
  if(x<0||x>=GW||z<0||z>=GH) return 0;
  const b=State.block[x][z];
  const colH = (b==="water")?1:Math.max(State.height[x][z],1);
  return colH - 1; // since mesh centered at colH/2-1, top = colH-1
}
/* ------------------------------------------------------------------ *
 *  6. 自然オブジェクトのメッシュ生成
 * ------------------------------------------------------------------ */
let natureMeshes={}; // key -> group
function buildAllNature(){
  while(natureGroup.children.length) natureGroup.remove(natureGroup.children[0]);
  natureMeshes={};
  for(const key in State.natureMap){ buildNatureAt(key); }
}
function buildNatureAt(key){
  const data = State.natureMap[key]; if(!data) return;
  const def = NATURE.find(n=>n.id===data.id); if(!def) return;
  if(natureMeshes[key]){ natureGroup.remove(natureMeshes[key]); }
  const g = new THREE.Group();
  const x=data.x, z=data.z;
  const wy = surfaceY(x,z);
  const grow = data.grow!=null?data.grow:1;
  buildNatureModel(g, def, grow);
  g.position.set(x-GW/2, wy, z-GH/2);
  g.userData={x,z,nature:true,id:def.id};
  natureGroup.add(g); natureMeshes[key]=g;
}
function mat(c){ return new THREE.MeshLambertMaterial({color:c}); }
function buildNatureModel(g, def, grow){
  const s = (def.h||1)*grow;
  if(def.kind==="tree"){
    const trunkH = s*0.45;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,trunkH,6), mat(def.trunk||0x6b4a2a));
    trunk.position.y=trunkH/2; trunk.castShadow=true; g.add(trunk);
    if(def.id==="palm"){
      for(let i=0;i<6;i++){ const leaf=new THREE.Mesh(new THREE.ConeGeometry(0.12,1.0,4),mat(def.col)); leaf.position.y=trunkH; leaf.rotation.z=Math.PI/2.6; leaf.rotation.y=i*Math.PI/3; leaf.position.x=Math.cos(i*Math.PI/3)*0.3; leaf.position.z=Math.sin(i*Math.PI/3)*0.3; leaf.castShadow=true; g.add(leaf);}
    } else {
      const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(s*0.42,0), mat(seasonalLeafColor(def.col)));
      crown.position.y=trunkH+s*0.32; crown.castShadow=true; g.add(crown);
      if(def.id!=="deadtree"){ const c2=new THREE.Mesh(new THREE.IcosahedronGeometry(s*0.3,0),mat(seasonalLeafColor(def.col))); c2.position.y=trunkH+s*0.6; c2.castShadow=true; g.add(c2);}
      if(def.fruit){ for(let i=0;i<4;i++){ const f=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),mat(def.fruit)); f.position.set(rand(-.3,.3),trunkH+s*0.3+rand(-.1,.2),rand(-.3,.3)); g.add(f);} }
    }
  } else if(def.kind==="bush"){
    const b=new THREE.Mesh(new THREE.IcosahedronGeometry(s*0.5,0),mat(seasonalLeafColor(def.col))); b.position.y=s*0.4; b.castShadow=true; g.add(b);
    if(def.fruit){ for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,6),mat(def.fruit)); f.position.set(rand(-.3,.3),s*0.4,rand(-.3,.3)); g.add(f);} }

function buildAnimalMesh(def){
  const g=new THREE.Group();
  const sz=def.size||1;
  const bodyCol=def.col;
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.2*sz,0.45*sz,4,8),mat(bodyCol));
  body.rotation.z=Math.PI/2; body.position.y=0.3*sz; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.2*sz,10,10),mat(bodyCol)); head.position.set(0.32*sz,0.42*sz,0); head.castShadow=true; g.add(head);
  // ears
  const earL=new THREE.Mesh(new THREE.ConeGeometry(0.07*sz,0.16*sz,5),mat(bodyCol)); earL.position.set(0.34*sz,0.6*sz,0.08*sz); g.add(earL);
  const earR=new THREE.Mesh(new THREE.ConeGeometry(0.07*sz,0.16*sz,5),mat(bodyCol)); earR.position.set(0.34*sz,0.6*sz,-0.08*sz); g.add(earR);
  // legs
  const legs=[];
  for(const[dx,dz] of [[0.18,0.1],[0.18,-0.1],[-0.18,0.1],[-0.18,-0.1]]){
    const l=new THREE.Mesh(new THREE.CylinderGeometry(0.04*sz,0.04*sz,0.25*sz,5),mat(bodyCol));
    l.position.set(dx*sz,0.12*sz,dz*sz); g.add(l); legs.push(l);
  }
  // tail
  const tail=new THREE.Mesh(new THREE.SphereGeometry(0.08*sz,6,6),mat(bodyCol)); tail.position.set(-0.34*sz,0.32*sz,0); g.add(tail);
  g.userData={legs, head, tail, base:0.3*sz};
  // birds/bugs float
  if(["butterfly","bee","ladybug","dragonfly","firefly","bat","crow","sparrow","robin","parrot","eagle","kingfisher","fairy","phoenix"].includes(def.id)){
    g.userData.fly=true;
  }
  return g;
}
function spawnAnimal(def, x, z){
  const g=buildAnimalMesh(def);
  const wy=surfaceY(Math.floor(x),Math.floor(z));
  g.position.set(x-GW/2, wy, z-GH/2);
  g.userData.def=def; g.userData.id=uid();
  g.userData.tx=x; g.userData.tz=z; g.userData.gx=x; g.userData.gz=z;
  g.userData.state="idle"; g.userData.timer=rand(1,3); g.userData.dir=rand(0,6.28);
  g.userData.flyH = g.userData.fly? rand(1.5,3.0):0;
  animalGroup.add(g);
  State.animals.push(g);
  return g;
}
function clearAnimals(){ while(animalGroup.children.length) animalGroup.remove(animalGroup.children[0]); State.animals.length=0; }

// pick animals appropriate for current season; populate up to a target count
function repopulateAnimals(){
  clearAnimals();

 * ------------------------------------------------------------------ */
function countNature(filter){ let c=0; for(const k in State.natureMap){ const d=State.natureMap[k]; const def=NATURE.find(n=>n.id===d.id); if(filter(def,d))c++; } return c; }
function countWater(){ let c=0; for(let x=0;x<GW;x++)for(let z=0;z<GH;z++) if(State.block[x][z]==="water")c++; return c; }
function checkRareSpawns(){
  const season=SEASONS[State.seasonIdx].id;
  const night = State.timeMin<5*60 || State.timeMin>19*60;
  const flowers = countNature(d=>d&&d.kind==="flower");
  const grasses = countNature(d=>d&&d.kind==="grass");
  const water = countWater();
  const tryRare=(id,ok)=>{ if(ok && Math.random()<0.6 && !State.animals.some(a=>a.userData.def.id===id)){
      const def=ANIMALS.find(a=>a.id===id);
      let x=randi(6,GW-6),z=randi(6,GH-6); spawnAnimal(def,x,z);
      toast("✨ レア生物が現れた…！周囲をよく見てみよう");
  }};
  tryRare("unicorn", flowers>=50 && season==="sp");
  tryRare("tsuchinoko", grasses>=20);
  tryRare("nessie", water>=20 && (season==="su"||season==="au"));
  tryRare("kirin", State.rating>=5 && season==="au");
  tryRare("fairy", flowers>=10 && night && State.animals.some(a=>a.userData.def.id==="firefly"));
  tryRare("pegasus", State.weather==="rainbow");
  tryRare("dragon", State.discoveredRuins && night && (season==="su"||season==="au"));
  tryRare("phoenix", State.discoveredGlow && season==="su" && !night);
  tryRare("yeti", season==="wi" && State.weather==="snowstorm");
  tryRare("kraken", State.weather==="heavyrain" && water>=12);
}

/* ------------------------------------------------------------------ *
 *  10. 動物 AI 更新
 * ------------------------------------------------------------------ */
function updateAnimals(dt){
  const ppx=Player.x, ppz=Player.z;
  for(const a of State.animals){
    const u=a.userData; const def=u.def;
    u.timer-=dt;
    // pick new wander target
    if(u.timer<=0){
      u.timer=rand(2,5);
      if(Math.random()<0.6){ u.state="walk"; u.tx=clamp(u.gx+randi(-5,5),2,GW-3); u.tz=clamp(u.gz+randi(-5,5),2,GH-3);}
      else u.state="idle";
    }
    // flee from player if close (shy animals)
    const dp = dist2(u.gx,u.gz, ppx,ppz);
    if(dp<2.2 && !u.tame && Math.random()<0.02){ u.state="walk"; const ang=Math.atan2(u.gz-ppz,u.gx-ppx); u.tx=clamp(u.gx+Math.cos(ang)*5,2,GW-3); u.tz=clamp(u.gz+Math.sin(ang)*5,2,GH-3);}
    if(u.state==="walk"){
      const ang=Math.atan2(u.tz-u.gz, u.tx-u.gx);
      const sp=(def.speed||1)*1.4*dt;
      u.gx+=Math.cos(ang)*sp; u.gz+=Math.sin(ang)*sp;
      u.dir=ang;
      if(dist2(u.gx,u.gz,u.tx,u.tz)<0.3) u.state="idle";
      // animate legs
      u.legs && u.legs.forEach((l,i)=>{ l.rotation.x=Math.sin(performance.now()*0.012 + i*1.6)*0.5; });
    } else {
      u.legs && u.legs.forEach(l=> l.rotation.x*=0.9);
    }
    const wy=surfaceY(Math.floor(u.gx),Math.floor(u.gz));
    let targetY = wy + (u.flyH||0);
    a.position.x=u.gx-GW/2; a.position.z=u.gz-GH/2;
    a.position.y = lerp(a.position.y, targetY, 0.15);
    a.rotation.y = -u.dir + Math.PI/2;
    if(u.fly){ a.position.y = targetY + Math.sin(performance.now()*0.004 + u.gx)*0.25; }
    if(u.tail) u.tail.rotation.x=Math.sin(performance.now()*0.006)*0.3;
  }
}

const DAY_MIN = 1440;
let timeScale = 0.6; // game-min per real-second
function updateTime(dt){
  State.timeMin += dt*timeScale*60;
  if(State.timeMin>=DAY_MIN){
    State.timeMin-=DAY_MIN; State.dayCount++;
    onNewDay();
  }
  applyDayNight();
  updateWeatherVisual(dt);
}
function onNewDay(){
  // auto season change every 4 days
  if(State.settings.autoSeason && State.dayCount%4===1){
    nextSeason();
  }
  // morning weather roll
  rollWeather();
  // sometimes a random event
  if(Math.random()<0.5) triggerRandomEvent();
  // sometimes a season event
  if(Math.random()<0.4) triggerSeasonEvent();
  // animals refresh + rare check
  repopulateAnimals();
  recalcRating();
  saveGame();
}
function nextSeason(){
  State.seasonIdx=(State.seasonIdx+1)%4;
  State.seasonsSeen[SEASONS[State.seasonIdx].id]=true;
  applySeasonVisual();
  buildAllNature();
  repopulateAnimals();
  checkAchievements();
  const s=SEASONS[State.seasonIdx];
  showEvent(s.ic+" "+s.nm+"になった", "島の景色が移り変わる");
}
function applySeasonVisual(){
  const s=SEASONS[State.seasonIdx];
  if(skyMesh) skyMesh.material.color.setHex(s.sky);
  scene.fog.color.setHex(s.fog);

}
function rollWeather(){
  const s=SEASONS[State.seasonIdx].id;
  const r=Math.random();
  if(s==="wi"){ State.weather = r<0.5?"snow": r<0.65?"snowstorm":"sunny"; }
  else if(s==="su"){ State.weather = r<0.6?"sunny": r<0.78?"cloudy": r<0.9?"heavyrain":"sunny"; }
  else { State.weather = r<0.55?"sunny": r<0.75?"cloudy": r<0.9?"rain":"sunny"; }
  updateWeatherHUD();
  setupWeatherParticles();
}
const WEATHER_LABEL={sunny:"☀ 快晴",cloudy:"☁ くもり",rain:"🌧 雨",heavyrain:"⛈ 大雨",snow:"❄ 雪",snowstorm:"🌨 吹雪",rainbow:"🌈 虹",wind:"🌬 強風",aurora:"🌌 オーロラ"};
function updateWeatherHUD(){ $("#hudWeather").textContent = WEATHER_LABEL[State.weather]||"☀ 快晴"; }

// weather particle system
let weatherParticles=null;
function setupWeatherParticles(){
  if(weatherParticles){ fxGroup.remove(weatherParticles); weatherParticles=null; }
  const w=State.weather;
  let count=0, color=0xffffff, size=0.1, speed=8;
  if(w==="rain"){count=600;color=0x9fd0ff;size=0.06;speed=22;}
  else if(w==="heavyrain"){count=1100;color=0x8fc0ff;size=0.08;speed=30;}
  else if(w==="snow"){count=500;color=0xffffff;size=0.12;speed=3;}
  else if(w==="snowstorm"){count=1200;color=0xffffff;size=0.13;speed=6;}
  if(count===0) return;
  const geo=new THREE.BufferGeometry(); const pos=[];
  for(let i=0;i<count;i++){ pos.push(rand(-40,40),rand(0,40),rand(-40,40)); }
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  const mt=new THREE.PointsMaterial({color,size,transparent:true,opacity:0.8,fog:false});
  weatherParticles=new THREE.Points(geo,mt); weatherParticles.userData={speed,kind:w};
  fxGroup.add(weatherParticles);
}
function updateWeatherVisual(dt){
  if(weatherParticles){
    const arr=weatherParticles.geometry.attributes.position.array;
    const sp=weatherParticles.userData.speed*dt;
    const drift = (weatherParticles.userData.kind.includes("snow"))?Math.sin(performance.now()*0.001)*0.5:0;
    for(let i=0;i<arr.length;i+=3){
      arr[i+1]-=sp; arr[i]+=drift*dt;
      if(arr[i+1]<0){ arr[i+1]=40; arr[i]=Player.x-GW/2+rand(-40,40); arr[i+2]=Player.z-GH/2+rand(-40,40);}
    }
    weatherParticles.geometry.attributes.position.needsUpdate=true;
    weatherParticles.position.set(0,0,0);
  }
}

// day/night lighting
function applyDayNight(){
  const t=State.timeMin/DAY_MIN; // 0..1
  const ang=(t-0.25)*Math.PI*2; // sun angle, noon at t=0.25? actually shift
  const sunY=Math.sin((t-0.0)*Math.PI*2 - Math.PI/2); // -1 at midnight, +1 noon? approx
  const elev=Math.sin((t)*Math.PI*2 - Math.PI/2); // midnight low
  // map time to brightness
  let day = clamp(Math.sin((t-0.0)*Math.PI), 0, 1); // crude
  // better: define phases
  let bright;
  const hm=State.timeMin;
  if(hm<300) bright=0.12;            // 0-5 night
  else if(hm<420) bright=lerp(0.12,1,(hm-300)/120); // 5-7 dawn
  else if(hm<1020) bright=1;         // 7-17 day
  else if(hm<1200) bright=lerp(1,0.2,(hm-1020)/180); // 17-20 dusk
  else bright=0.12;                  // night
  sun.intensity=0.3+bright*0.9;
  ambient.intensity=0.15+bright*0.35;
  hemi.intensity=0.25+bright*0.55;
  // sun position arcs
  const ph=(hm/DAY_MIN)*Math.PI*2;
  sun.position.set(Math.cos(ph-Math.PI/2)*40, Math.max(8,Math.sin(ph-Math.PI/2)*55+15), 20);
  // sky color tween between day sky & night
  const sky=SEASONS[State.seasonIdx].sky;
  const night=0x0a1430, dusk=0xe89a5a;
  let skyc=new THREE.Color(sky);
  if(bright<0.5){ skyc=new THREE.Color(night).lerp(new THREE.Color(sky),bright*2); }
  if(hm>1020&&hm<1200){ skyc.lerp(new THREE.Color(dusk),0.4); }
  if(skyMesh) skyMesh.material.color.copy(skyc);
  scene.background = skyc;
  if(starsMesh) starsMesh.material.opacity = clamp((0.4-bright)*2.5,0,0.9);
  // aurora glow handled separately
  if(sun.target){ sun.target.position.set(Player.x-GW/2,0,Player.z-GH/2); }
  sun.position.x += Player.x-GW/2; sun.position.z += Player.z-GH/2;
  // clock HUD
  const hh=Math.floor(hm/60), mm=Math.floor(hm%60);
  $("#hudClock").textContent = String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}
function timeOfDayName(){
  const hm=State.timeMin;
  if(hm<300||hm>=1200) return "夜"; if(hm<420)return "朝"; if(hm<1020)return "昼"; return "夕方";
}

function growWater(){
  // raise visual water level a touch — symbolic: convert some adjacent low cells near water to water
  let added=0;
  for(let x=1;x<GW-1&&added<8;x++)for(let z=1;z<GH-1&&added<8;z++){
    if(State.block[x][z]!=="water" && State.height[x][z]<=1){
      const near=["water"].some(()=> State.block[x+1][z]==="water"||State.block[x-1][z]==="water"||State.block[x][z+1]==="water"||State.block[x][z-1]==="water");
      if(near && Math.random()<0.3){ State.block[x][z]="water"; State.height[x][z]=0; rebuildColumn(x,z); added++; }
    }
  }
}

  if(State.weather==="aurora"){ if(!auroraMesh) spawnAurora(); if(auroraMesh) auroraMesh.material.opacity=0.3+Math.sin(performance.now()*0.001)*0.15; }

function recalcRating(){
  let score=0;
  score += Object.keys(State.dexAnimals).length*2;
  score += State.flowersPlanted*0.5;
  score += State.treesPlanted*0.6;
  score += State.furniture.length*1.5;
  score += Object.keys(State.dexNature).length;
  score += State.craftedCount;
  let r=1;
  if(score>=30) r=2; if(score>=70) r=3; if(score>=130) r=4; if(score>=220) r=5;
  if(r!==State.rating){ State.rating=r; toast("島評価が ★"+r+" になった！"); }
  $("#hudRating").textContent = "★".repeat(State.rating)+"☆".repeat(5-State.rating);
  checkAchievements();
}
function unlock(id){
  if(State.achievements[id]) return;
  const a=ACHIEVEMENTS.find(x=>x.id===id); if(!a) return;
  State.achievements[id]=Date.now();
  toast("🏆 実績解除：「"+a.nm+"」"); playSfx("achieve");
}
function checkAchievements(){
  const nA=Object.keys(State.dexAnimals).length;
  const nR=Object.keys(State.raresFound).length;
  if(nA>=1) unlock("first");
  if(nA>=10) unlock("ten");
  if(nA>=30) unlock("thirty");
  if(nA>=ANIMALS.length) unlock("allanim");
  if(nR>=1) unlock("rare1");
  const totalRare=ANIMALS.filter(a=>a.rare).length;
  if(nR>=totalRare) unlock("allrare");
  if(Object.keys(State.seasonsSeen).length>=4) unlock("allseason");
  if(State.rating>=5) unlock("rating");
  if(State.flowersPlanted>=100) unlock("garden");
  if(State.terrainEdits>=200) unlock("builder");
  if(State.craftedCount>=20) unlock("crafter");
  if(State.treesPlanted>=50) unlock("forest");
}

let AC=null, masterGain=null, bgmTimer=null;
function initAudio(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); masterGain=AC.createGain(); masterGain.gain.value=State.settings.volume; masterGain.connect(AC.destination);}catch(e){}
}
function tone(freq,dur,type="sine",vol=0.2,when=0){
  if(!AC||!State.settings.sfx) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, AC.currentTime+when);
  g.gain.linearRampToValueAtTime(vol, AC.currentTime+when+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+when+dur);
  o.connect(g); g.connect(masterGain); o.start(AC.currentTime+when); o.stop(AC.currentTime+when+dur+0.05);
}
function playSfx(kind){
  if(!AC||!State.settings.sfx) return;
  if(kind==="click") tone(660,0.08,"square",0.12);
  else if(kind==="place") { tone(440,0.1,"triangle",0.15); tone(660,0.1,"triangle",0.1,0.05); }
  else if(kind==="remove") tone(220,0.12,"sawtooth",0.1);
  else if(kind==="pet") { tone(523,0.12,"sine",0.15); tone(659,0.12,"sine",0.12,0.08); tone(784,0.16,"sine",0.1,0.16); }
  else if(kind==="discover"){ [523,659,784,1047].forEach((f,i)=>tone(f,0.18,"sine",0.14,i*0.09)); }
  else if(kind==="achieve"){ [659,784,988,1319].forEach((f,i)=>tone(f,0.2,"triangle",0.14,i*0.1)); }
  else if(kind==="event"){ tone(392,0.3,"sine",0.12); tone(523,0.3,"sine",0.1,0.12); }
  else if(kind==="craft"){ tone(330,0.08,"square",0.12); tone(440,0.08,"square",0.12,0.1); tone(550,0.12,"square",0.1,0.2); }
  else if(kind==="jump") tone(520,0.1,"sine",0.1);
}
// gentle ambient BGM: arpeggio loop
const BGM_NOTES=[261.6,329.6,392,329.6,440,392,329.6,293.7];
let bgmStep=0;
function startBGM(){
  if(bgmTimer) clearInterval(bgmTimer);
  if(!State.settings.bgm) return;
  bgmTimer=setInterval(()=>{
    if(!AC||!State.settings.bgm) return;
    const base=BGM_NOTES[bgmStep%BGM_NOTES.length];
    const oct = timeOfDayName()==="夜"?0.5:1;
    tone(base*oct,0.5,"sine",0.05);
    if(bgmStep%2===0) tone(base*oct/2,0.9,"triangle",0.04);
    bgmStep++;
  }, 480);
}
function stopBGM(){ if(bgmTimer){clearInterval(bgmTimer); bgmTimer=null;} }

const Keys={};
let camYaw=0.6, camPitch=0.7, camDist=12;
window.addEventListener("keydown",e=>{
  if(gameStarted && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  Keys[e.key.toLowerCase()]=true;
  handleKeyPress(e);
});
window.addEventListener("keyup",e=>{ Keys[e.key.toLowerCase()]=false; });
function handleKeyPress(e){
  const k=e.key.toLowerCase();
  if(!gameStarted) return;
  if(dialogOpen){ if(k==="z"||k==="enter") nextDialog(); if(k==="x"||k==="backspace") closeDialog(); return; }
  if(k==="m"){ togglePanel("menu"); }
  else if(k==="c"){ togglePanel("map"); }
  else if(k==="v"){ toggleCamMode(); }
  else if(k==="x"||k==="backspace"){ if(anyPanelOpen()) closeAllPanels(); else setMode("walk"); }
  else if(k==="escape"){ closeAllPanels(); }
}
let camMode=false;

/* ------------------------------------------------------------------ *
 *  16. プレイヤー移動 & カメラ
 * ------------------------------------------------------------------ */
let mobileMove={x:0,y:0}, mobileCam={x:0,y:0}, mobileJump=false, mobileDash=false;
function updatePlayer(dt){
  let mx=0, mz=0;
  if(Keys["arrowup"]) mz-=1; if(Keys["arrowdown"]) mz+=1;
  if(Keys["arrowleft"]) mx-=1; if(Keys["arrowright"]) mx+=1;
  mx+=mobileMove.x; mz+=mobileMove.y;
  const dash = (Keys[" "]&&(mx||mz)) || mobileDash;
  let len=Math.hypot(mx,mz);
  // camera-relative movement
  if(len>0.05){
    mx/=len; mz/=len;
    const cos=Math.cos(camYaw), sin=Math.sin(camYaw);
    const wx = mx*cos - mz*sin;
    const wz = mx*sin + mz*cos;
    const sp=Player.speed*(dash?2.1:1)*(dt*60);
    let nx=Player.x+wx*sp, nz=Player.z+wz*sp;
    // collision: stay in bounds, can't walk into deep water (allow shallow)
    nx=clamp(nx,1.5,GW-1.5); nz=clamp(nz,1.5,GH-1.5);
    Player.x=nx; Player.z=nz;
    Player.dir=Math.atan2(wx,wz);
    Player.anim+=sp*0.6;
  } else Player.anim*=0.8;
  // jump
  const ground=surfaceY(Math.floor(Player.x),Math.floor(Player.z));
  const wantJump = (Keys[" "]&&!(mx||mz)) || mobileJump;
  if(wantJump && Player.onGround){ Player.vy=0.22; Player.onGround=false; playSfx("jump"); mobileJump=false; }
  Player.vy-=0.012*(dt*60); Player.y+=Player.vy*(dt*60);
  if(Player.y<=ground){ Player.y=ground; Player.vy=0; Player.onGround=true; }
  // apply mesh
  playerMesh.position.set(Player.x-GW/2, Player.y, Player.z-GH/2);
  playerMesh.rotation.y=Player.dir;
  // leg anim
  const ud=playerMesh.userData;
  ud.legL.rotation.x=Math.sin(Player.anim)*0.6;
  ud.legR.rotation.x=-Math.sin(Player.anim)*0.6;
  ud.head.position.y=0.95+Math.abs(Math.sin(Player.anim))*0.03;
  playerShadow.position.set(Player.x-GW/2, ground+0.02, Player.z-GH/2);
  // camera control
  if(camMode || Keys["a"]||Keys["d"]||Keys["w"]||Keys["s"]){
    if(Keys["a"]) camYaw-=0.03*(dt*60);
    if(Keys["d"]) camYaw+=0.03*(dt*60);
    if(Keys["w"]) camPitch=clamp(camPitch-0.02*(dt*60),0.15,1.4);
    if(Keys["s"]) camPitch=clamp(camPitch+0.02*(dt*60),0.15,1.4);
  }
  camYaw+=mobileCam.x*0.04; camPitch=clamp(camPitch+mobileCam.y*0.03,0.15,1.4);
  // camera follow
  const tx=Player.x-GW/2, ty=Player.y+1.2, tz=Player.z-GH/2;
  const cx=tx+Math.sin(camYaw)*Math.cos(camPitch)*camDist;
  const cy=ty+Math.sin(camPitch)*camDist;
  const cz=tz+Math.cos(camYaw)*Math.cos(camPitch)*camDist;
  camera.position.lerp(new THREE.Vector3(cx,cy,cz),0.15);
  camera.lookAt(tx,ty,tz);
}

function pickCellFromEvent(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouseNDC.x=((ev.clientX-r.left)/r.width)*2-1;
  mouseNDC.y=-((ev.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouseNDC,camera);
  const hits=raycaster.intersectObjects(worldGroup.children,false);
  for(const h of hits){ if(h.object.userData && h.object.userData.x!=null) return {x:h.object.userData.x, z:h.object.userData.z, point:h.point}; }
  return null;
}
function pickAnimalFromEvent(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouseNDC.x=((ev.clientX-r.left)/r.width)*2-1;
  mouseNDC.y=-((ev.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouseNDC,camera);
  const hits=raycaster.intersectObjects(animalGroup.children,true);
  if(hits.length){ let o=hits[0].object; while(o&&!o.userData.def) o=o.parent; if(o) return o; }
  return null;
}
function pickNatureFromEvent(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouseNDC.x=((ev.clientX-r.left)/r.width)*2-1;
  mouseNDC.y=-((ev.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouseNDC,camera);
  const hits=raycaster.intersectObjects(natureGroup.children,true);
  if(hits.length){ let o=hits[0].object; while(o&&!o.userData.nature) o=o.parent; if(o) return o; }
  return null;
}

let lastClickTime=0;
function onCanvasClick(ev){
  if(!gameStarted || anyPanelOpen()) return;
  const now=performance.now();
  const dbl = (now-lastClickTime)<300; lastClickTime=now;
  // editing modes
  if(MODE==="terrain"||MODE==="ground"||MODE==="nature"||MODE==="build"){
    const cell=pickCellFromEvent(ev);
    if(!cell) return;
    if(dbl && !activeTool){ removeAt(cell.x,cell.z); return; }
    if(!activeTool){ // double click handled above; single click with no tool tries inspect
      inspectCell(cell.x,cell.z); return;
    }
    applyTool(cell.x,cell.z);
    return;
  }
  // walk mode: pet animal / inspect
  const a=pickAnimalFromEvent(ev);
  if(a){ interactAnimal(a); return; }
  const n=pickNatureFromEvent(ev);
  if(n){ inspectNature(n); return; }
  const cell=pickCellFromEvent(ev);
  if(cell) inspectCell(cell.x,cell.z);
}

function applyTool(x,z){
  if(activeToolKind==="terrain") applyTerrain(x,z);
  else if(activeToolKind==="ground") applyGround(x,z);
  else if(activeToolKind==="nature") applyNature(x,z);
  else if(activeToolKind==="furniture") applyFurniture(x,z);
}
function applyTerrain(x,z){
  const tool=TERRAIN_TOOLS.find(t=>t.id===activeTool); if(!tool) return;
  let h=State.height[x][z];
  if(tool.id==="raise"||tool.id==="hill") h=clamp(h+1,0,MAXY);
  else if(tool.id==="dig"||tool.id==="valley") h=clamp(h-1,0,MAXY);
  else if(tool.id==="cliff") h=clamp(h+2,0,MAXY);
  else if(tool.id==="plateau") h=clamp(Math.max(h,3),0,MAXY);
  else if(tool.id==="pillar") h=clamp(h+3,0,MAXY);
  else if(tool.id==="flat"){ // set neighbours to same as this
    const target=h; for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){const nx=x+dx,nz=z+dz; if(nx>=0&&nx<GW&&nz>=0&&nz<GH){State.height[nx][nz]=target; rebuildColumn(nx,nz); shiftNature(nx,nz);}}
    finishEdit(); return;
  }
  else if(tool.id==="smooth"){ // average with neighbours
    let s=0,c=0; for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){const nx=x+dx,nz=z+dz; if(nx>=0&&nx<GW&&nz>=0&&nz<GH){s+=State.height[nx][nz];c++;}}
    h=Math.round(s/c);
  }
  else if(tool.id==="slope"){ // step toward neighbour heights
    h=clamp(h+ (Math.random()<0.5?1:-1),0,MAXY);
  }
  if(State.block[x][z]==="water" && h>0){ State.block[x][z]="dirt"; }
  State.height[x][z]=h;
  rebuildColumn(x,z); shiftNature(x,z);
  finishEdit();
}
function applyGround(x,z){
  if(activeTool==="water"){ State.block[x][z]="water"; State.height[x][z]=0; }
  else State.block[x][z]=activeTool;
  rebuildColumn(x,z); shiftNature(x,z); finishEdit();
}
function applyNature(x,z){
  if(State.block[x][z]==="water" && activeTool!=="water" && activeTool!=="lake" && activeTool!=="reed"){
    toast("水の上には置けません"); return;
  }
  const def=NATURE.find(n=>n.id===activeTool); if(!def) return;
  if(def.kind==="water"){ State.block[x][z]="water"; State.height[x][z]=0; rebuildColumn(x,z); }
  else {
    placeNatureData(x,z,activeTool);
    buildNatureAt(x+","+z);
    if(def.kind==="flower") State.flowersPlanted++;
    if(def.kind==="tree") State.treesPlanted++;
    discoverNature(def.nm);
  }
  playSfx("place"); finishEdit(); checkRareSpawns();
}
function applyFurniture(x,z){
  const rec=RECIPES.find(r=>r.id===activeTool);
  if(!rec) return;
  if(!(State.craftInventory[rec.id]>0)){ toast("先にクラフトで作ってね"); return; }
  State.craftInventory[rec.id]--;
  const g=new THREE.Group();
  const fm=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),mat(0xc89a5a));
  fm.position.y=0.25; fm.castShadow=true; g.add(fm);
  const top=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.1,0.6),mat(0xe0b070)); top.position.y=0.55; g.add(top);
  g.position.set(x-GW/2, surfaceY(x,z), z-GH/2);
  g.userData={furniture:true, id:rec.id, x, z};
  furnitureGroup.add(g);
  State.furniture.push({id:rec.id,x,z});
  toast(rec.ic+" "+rec.nm+"を置いた"); playSfx("place"); finishEdit();
}
function shiftNature(x,z){ const key=x+","+z; if(natureMeshes[key]) natureMeshes[key].position.y=surfaceY(x,z); }
function removeAt(x,z){
  const key=x+","+z;
  if(natureMeshes[key]){ natureGroup.remove(natureMeshes[key]); delete natureMeshes[key]; delete State.natureMap[key]; playSfx("remove"); return; }
  // remove furniture on cell
  for(let i=State.furniture.length-1;i>=0;i--){ if(State.furniture[i].x===x&&State.furniture[i].z===z){ State.furniture.splice(i,1);
      furnitureGroup.children.forEach(c=>{ if(c.userData.x===x&&c.userData.z===z) furnitureGroup.remove(c); }); playSfx("remove"); return; } }
  toast("ここには消せるものがありません");
}
function finishEdit(){ State.terrainEdits++; checkAchievements(); recalcRating(); }

function interactAnimal(a){
  const def=a.userData.def;
  discoverAnimal(def);
  a.userData.tame=true; a.userData.timer=2;
  // little hop
  a.userData.flyH = a.userData.fly? a.userData.flyH : 0;
  playSfx("pet");
  // floating heart
  spawnHeart(a.position);
  const opts=["撫でた！","写真を撮った！","じっと観察した。","落とし物を拾った！","エサをあげた！"];
  const act=choice(opts);
  if(act==="落とし物を拾った！"){ const m=choice(["feather","acorn","shell"]); State.materials[m]=(State.materials[m]||0)+1; refreshItembar(); }
  if(act==="エサをあげた！"){ if(State.craftInventory.food>0){State.craftInventory.food--;} }
  openDialog(def.ic+" "+def.nm, [
    def.desc,
    act+" "+def.nm+"はうれしそうだ。",
    "【好きな環境】"+def.hab+"　【季節】"+seasonLabels(def.season)+(def.rare?"\n✨これはレア生物だ！":"")
  ]);
}
function seasonLabels(s){ return s.split(",").map(x=>({sp:"春",su:"夏",au:"秋",wi:"冬"}[x])).join("・"); }
function discoverAnimal(def){
  const first=!State.dexAnimals[def.id];
  if(first){ State.dexAnimals[def.id]={count:1, firstSeen:State.dayCount, hab:def.hab}; playSfx("discover"); toast("📖 図鑑に「"+def.nm+"」を登録！");
    if(def.rare){ State.raresFound[def.id]=true; showEvent("✨ レア発見！", def.nm+"を見つけた！"); }
    recalcRating(); checkAchievements();
  } else State.dexAnimals[def.id].count++;
}
function discoverNature(nm){ if(!State.dexNature[nm]){ State.dexNature[nm]=true; recalcRating(); } }
function inspectNature(n){
  const def=NATURE.find(x=>x.id===n.userData.id); if(!def) return;
  discoverNature(def.nm);
  let extra="";
  if(def.kind==="tree"){ extra="木材が手に入った！"; State.materials.wood=(State.materials.wood||0)+1; if(Math.random()<0.4){State.materials.acorn++;} }
  else if(def.kind==="flower"){ extra="花を摘んだ。"; State.materials.flower=(State.materials.flower||0)+1; }

function inspectCell(x,z){
  const b=State.block[x][z]; const def=GROUND_BLOCKS.find(g=>g.id===b)||{nm:"水",ic:"💧"};
  openDialog("🔍 地面", ["ここは「"+(def.nm||"水")+"」だ。", "高さ: "+State.height[x][z]+" / 季節: "+SEASONS[State.seasonIdx].nm+" / "+timeOfDayName()]);

function spawnHeart(pos){
  const h=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), new THREE.MeshBasicMaterial({color:0xff7aa0,fog:false}));
  h.position.copy(pos); h.position.y+=1; fxGroup.add(h);

let mmCtx=null;
function updateMinimap(){
  if(!mmCtx) mmCtx=$("#mmcanvas").getContext("2d");
  const ctx=mmCtx, S=150, cell=S/GW;
  for(let x=0;x<GW;x++)for(let z=0;z<GH;z++){
    const b=State.block[x][z]; let c="#5fa845";
    if(b==="water") c="#3aa0e0";
    else if(b.startsWith("sand")||b==="beach") c="#e4d29a";
    else if(b.startsWith("stone")||b.startsWith("gravel")) c="#8d8b86";
    else if(b.startsWith("snow")||b==="ice") c="#e6eef8";
    else { const g=GROUND_BLOCKS.find(gg=>gg.id===b); if(g) c="#"+g.col.toString(16).padStart(6,"0"); }
    const sh=State.height[x][z]/MAXY; ctx.fillStyle=shade(c,1-sh*0.25);
    ctx.fillRect(x*cell, z*cell, cell+0.5, cell+0.5);
  }
  // nature dots
  ctx.fillStyle="#2e6e3a";
  for(const k in State.natureMap){ const d=State.natureMap[k]; const def=NATURE.find(n=>n.id===d.id); if(def&&def.kind==="tree"){ ctx.fillRect(d.x*cell,d.z*cell,cell,cell);} }
  // animals
  ctx.fillStyle="#ffd24a";
  for(const a of State.animals){ ctx.fillRect(a.userData.gx*cell-1,a.userData.gz*cell-1,2.5,2.5); }
  // player
  ctx.fillStyle="#ff3a6a"; ctx.beginPath(); ctx.arc(Player.x*cell,Player.z*cell,3,0,7); ctx.fill();
}
function shade(hex,f){ const c=parseInt(hex.slice(1),16); let r=(c>>16)&255,g=(c>>8)&255,b=c&255; r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f); return "rgb("+r+","+g+","+b+")"; }

function setMode(m){
  MODE=m; activeTool=null; activeToolKind=null;
  const labels={walk:"さんぽモード", terrain:"地形編集モード", ground:"地面編集モード", nature:"自然配置モード", build:"家具配置モード", craft:"クラフトモード"};
  $("#modeText").textContent=labels[m]||m;
  cursorMesh.visible=(m!=="walk");
  refreshItembar();
}
function refreshItembar(){
  const bar=$("#itembar"); bar.innerHTML="";
  // material counts always shown as small badges in walk mode
  if(MODE==="walk"){
    MATERIALS.forEach(mt=>{ const s=el("div","slot"); s.innerHTML=mt.ic+"<small>"+(State.materials[mt.id]||0)+"</small>"; bar.appendChild(s); });
    return;
  }
  let list=[];
  if(MODE==="terrain"){ list=TERRAIN_TOOLS.map(t=>({id:t.id,ic:t.ic,nm:t.nm,kind:"terrain"})); }
  else if(MODE==="ground"){ list=GROUND_BLOCKS.slice(0,10).map(b=>({id:b.id,ic:b.ic,nm:b.nm,kind:"ground"})); }
  else if(MODE==="nature"){ list=NATURE.slice(0,10).map(n=>({id:n.id,ic:n.ic,nm:n.nm,kind:"nature"})); }
  else if(MODE==="build"){ list=RECIPES.filter(r=>State.craftInventory[r.id]>0).map(r=>({id:r.id,ic:r.ic,nm:r.nm+"×"+State.craftInventory[r.id],kind:"furniture"})); if(!list.length){ const s=el("div","slot"); s.innerHTML="🔨<small>無</small>"; bar.appendChild(s); return; } }
  list.forEach(it=>{
    const s=el("div","slot"); s.innerHTML=it.ic+"<small>"+it.nm.slice(0,4)+"</small>";
    if(activeTool===it.id) s.classList.add("sel");
    s.onclick=()=>{ activeTool=it.id; activeToolKind=it.kind; refreshItembar(); playSfx("click"); };
    bar.appendChild(s);
  });
  // "more" opens full panel
  const more=el("div","slot"); more.innerHTML="➕<small>もっと</small>";
  more.onclick=()=>{ openPanel(MODE==="build"?"craft":MODE); };
  bar.appendChild(more);
}
function el(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }

function panelShell(id,title,bodyHTML){
  const p=$("#panel_"+id);
  p.innerHTML=`<div class="bg"></div><div class="card"><div class="head"><h2>${title}</h2><button class="closebtn">✕</button></div><div class="body">${bodyHTML}</div></div>`;
  p.querySelector(".bg").onclick=()=>closePanel(id);
  p.querySelector(".closebtn").onclick=()=>closePanel(id);
  return p;
}
let openPanels={};
function openPanel(id){ buildPanel(id); $("#panel_"+id).style.display="flex"; openPanels[id]=true; }
function closePanel(id){ $("#panel_"+id).style.display="none"; openPanels[id]=false; }
function closeAllPanels(){ for(const id in openPanels){ closePanel(id); } }
function anyPanelOpen(){ return Object.values(openPanels).some(v=>v); }
function togglePanel(id){ if(openPanels[id]) closePanel(id); else { closeAllPanels(); openPanel(id); } }

function buildPanel(id){

function craft(id){
  const r=RECIPES.find(x=>x.id===id); if(!r) return;
  if(!Object.entries(r.cost).every(([k,v])=>(State.materials[k]||0)>=v)){ toast("素材が足りません"); playSfx("remove"); return; }
  for(const[k,v] of Object.entries(r.cost)) State.materials[k]-=v;
  State.craftInventory[id]=(State.craftInventory[id]||0)+1;
  State.craftedCount++;
  toast(r.ic+" "+r.nm+"を作った！"); playSfx("craft");
  checkAchievements(); recalcRating(); buildCraftPanel(); refreshItembar();
}

let houseGroup=null;
function buildHouse(){
  if(houseGroup) scene.remove(houseGroup);
  houseGroup=new THREE.Group();
  const hx=Math.floor(GW/2)-6, hz=Math.floor(GH/2)-6;
  const wy=surfaceY(hx,hz);
  const wall=WALLS.find(w=>w.id===State.house.wall)||WALLS[0];
  const floor=FLOORS.find(f=>f.id===State.house.floor)||FLOORS[0];
  // base/floor
  const fl=new THREE.Mesh(new THREE.BoxGeometry(4,0.2,4),mat(floor.col)); fl.position.y=0.1; fl.receiveShadow=true; houseGroup.add(fl);
  // walls
  const wmat=mat(wall.col);
  const back=new THREE.Mesh(new THREE.BoxGeometry(4,2.2,0.2),wmat); back.position.set(0,1.1,-2); back.castShadow=true; houseGroup.add(back);
  const left=new THREE.Mesh(new THREE.BoxGeometry(0.2,2.2,4),wmat); left.position.set(-2,1.1,0); left.castShadow=true; houseGroup.add(left);
  const right=new THREE.Mesh(new THREE.BoxGeometry(0.2,2.2,4),wmat); right.position.set(2,1.1,0); right.castShadow=true; houseGroup.add(right);
  const frontL=new THREE.Mesh(new THREE.BoxGeometry(1.4,2.2,0.2),wmat); frontL.position.set(-1.3,1.1,2); houseGroup.add(frontL);
  const frontR=new THREE.Mesh(new THREE.BoxGeometry(1.4,2.2,0.2),wmat); frontR.position.set(1.3,1.1,2); houseGroup.add(frontR);
  // roof
  const roof=new THREE.Mesh(new THREE.ConeGeometry(3.4,1.6,4),mat(0xc0533a)); roof.position.y=3.0; roof.rotation.y=Math.PI/4; roof.castShadow=true; houseGroup.add(roof);
  // door
  const door=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.6,0.1),mat(0x6a4a2a)); door.position.set(0,0.8,2.05); houseGroup.add(door);

function mobileAction(){

function setupJoystick(base,stick,onMove,onEnd){
  let active=false, id=null, cx=0, cy=0, R=46;
  const start=(e)=>{ active=true; const t=e.changedTouches?e.changedTouches[0]:e; id=t.identifier; const r=base.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; move(e); };
  const move=(e)=>{ if(!active) return; let t=e.changedTouches?Array.from(e.changedTouches).find(t=>t.identifier===id):e; if(!t)return; let dx=t.clientX-cx, dy=t.clientY-cy; const len=Math.hypot(dx,dy); if(len>R){dx=dx/len*R; dy=dy/len*R;} stick.style.transform=`translate(${dx}px,${dy}px)`; onMove(dx/R, dy/R); };
  const end=(e)=>{ active=false; stick.style.transform="translate(0,0)"; onEnd(); };
  base.addEventListener("touchstart",e=>{e.preventDefault();start(e);},{passive:false});
  base.addEventListener("touchmove",e=>{e.preventDefault();move(e);},{passive:false});
  base.addEventListener("touchend",end); base.addEventListener("touchcancel",end);
  base.addEventListener("mousedown",start); window.addEventListener("mousemove",e=>{if(active)move(e);}); window.addEventListener("mouseup",e=>{if(active)end(e);});
}
function bindBtn(elm,down,up){
  elm.addEventListener("touchstart",e=>{e.preventDefault();down();},{passive:false});
  elm.addEventListener("touchend",e=>{e.preventDefault();up();},{passive:false});
  elm.addEventListener("mousedown",e=>{e.preventDefault();down();});
  elm.addEventListener("mouseup",e=>{e.preventDefault();up();});
}

function timeBand(){ const hm=State.timeMin; return (hm<300||hm>=1200)?"night":"day"; }
function tryFish(){
  const water = State.block[clamp(Math.round(Player.x+Math.sin(Player.dir)),0,GW-1)] && State.block[clamp(Math.round(Player.x+Math.sin(Player.dir)),0,GW-1)][clamp(Math.round(Player.z+Math.cos(Player.dir)),0,GH-1)];
  if(water!=="water"){ toast("水辺で前を向いて使ってね"); return; }
  const season=SEASONS[State.seasonIdx].id, band=timeBand();
  const pool=FISH.filter(f=>f.season.includes(season)&&(f.time==="all"||f.time===band));
  if(!pool.length){ toast("今は何も釣れないみたい…"); return; }
  // weighted by inverse rarity
  const f=weightedPick(pool);
  discoverNature(f.nm); playSfx("discover");
  State.materials.shell=(State.materials.shell||0)+ (Math.random()<0.3?1:0); refreshItembar();
  openDialog("🎣 つり", [f.ic+" 「"+f.nm+"」を釣り上げた！", "レア度: "+"★".repeat(f.rarity), "自然図鑑(魚)に登録した。"]);
  recalcRating();
}
function tryCatchBug(){
  const season=SEASONS[State.seasonIdx].id, band=timeBand();
  const pool=BUGS.filter(b=>b.season.includes(season)&&(b.time==="all"||b.time===band));
  if(!pool.length){ toast("今の季節・時間に虫はいないみたい…"); return; }
  const b=weightedPick(pool);
  discoverNature(b.nm); playSfx("discover");
  openDialog("🪲 虫とり", [b.ic+" 「"+b.nm+"」をつかまえた！", "レア度: "+"★".repeat(b.rarity), "自然図鑑(虫)に登録した。"]);
  recalcRating();
}
function weightedPick(pool){ const w=pool.map(p=>1/(p.rarity*p.rarity)); const sum=w.reduce((a,b)=>a+b,0); let r=Math.random()*sum; for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i]; } return pool[pool.length-1]; }

// 図鑑(動物)の行クリックで詳細ダイアログを開く
const _origBuildDex=buildDexPanel;
buildDexPanel=function(){
  _origBuildDex();
  const p=$("#panel_dex");
  const rows=p.querySelectorAll("table.dex tr");
  rows.forEach((tr,i)=>{
    if(i===0) return;
    const a=ANIMALS[i-1]; if(!a) return;
    if(!State.dexAnimals[a.id]) return;
    tr.style.cursor="pointer";
    tr.onclick=()=>showAnimalDetail(a);
  });
};
function showAnimalDetail(a){
  const f=ANIMAL_FACTS[a.id]||{};
  const d=State.dexAnimals[a.id]||{};
  openDialog(a.ic+" "+a.nm+(a.rare?"（レア生物）":""), [
    a.desc,
    "【鳴き声】"+(f.call||"？")+"　【好物】"+(f.food||"？"),
    "【活動】"+(f.active||"？")+"　【好む環境】"+a.hab+"　【季節】"+seasonLabels(a.season),
    f.trivia||"",
    "【観察回数】"+(d.count||0)+"回　【初発見】"+(d.firstSeen||"?")+"日目"
  ].filter(Boolean));
}

const _origInspectNature=inspectNature;
inspectNature=function(n){
  const def=NATURE.find(x=>x.id===n.userData.id);
  const _od=openDialog;
  if(def && NATURE_FACTS[def.id]){
    openDialog=function(name,lines){ if(Array.isArray(lines)) lines.push(NATURE_FACTS[def.id]); _od(name,lines); openDialog=_od; };
  }
  _origInspectNature(n);
};

      const pillow=new THREE.Mesh(new THREE.BoxGeometry(.5,.1,.25),mat(0xf0d0d8)); pillow.position.set(0,.42,-.35); g.add(pillow); break; }
    case "fence":{ const r1=new THREE.Mesh(new THREE.BoxGeometry(.9,.06,.06),mat(wood)); r1.position.y=.45; g.add(r1);
      const r2=r1.clone(); r2.position.y=.25; g.add(r2);
      for(const dx of[-.4,0,.4]){const p=new THREE.Mesh(new THREE.BoxGeometry(.08,.6,.08),mat(dark));p.position.set(dx,.3,0);g.add(p);} break; }
    case "bridge":{ const deck=new THREE.Mesh(new THREE.BoxGeometry(1,.1,.7),mat(wood)); deck.position.y=.2; g.add(deck);
      for(const dx of[-.45,.45]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.06,.3,.7),mat(dark));rail.position.set(dx,.4,0);g.add(rail);} break; }
    case "lamp": case "lantern":{ const pole=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.7,8),mat(dark)); pole.position.y=.35; g.add(pole);
      const light=new THREE.Mesh(new THREE.SphereGeometry(.14,10,10),new THREE.MeshLambertMaterial({color:0xfff0a0,emissive:0xffd060})); light.position.y=.78; g.add(light); g.userData.glow=light; break; }
    case "food":{ const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.2,.14,.15,12),mat(0xa07040)); bowl.position.y=.1; g.add(bowl);
      const f=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8),mat(0xe0b050)); f.position.y=.18; g.add(f); break; }
    case "toy":{ const b=new THREE.Mesh(new THREE.SphereGeometry(.18,12,12),mat(red)); b.position.y=.18; g.add(b);
      const s=new THREE.Mesh(new THREE.TorusGeometry(.1,.03,6,12),mat(white)); s.position.y=.18; s.rotation.x=1; g.add(s); break; }
    case "vase":{ const v=new THREE.Mesh(new THREE.CylinderGeometry(.1,.16,.4,10),mat(0x8aa0c0)); v.position.y=.2; g.add(v);
      for(let i=0;i<3;i++){const fl=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),mat(choice([0xe25a5a,0xf0d24a,0xf08ac0]))); fl.position.set(rand(-.1,.1),.45,rand(-.1,.1)); g.add(fl);} break; }
    case "birdhouse":{ const post=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.8,6),mat(dark)); post.position.y=.4; g.add(post);
      const box=new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.3),mat(wood)); box.position.y=.85; g.add(box);

      const body=new THREE.Mesh(new THREE.DodecahedronGeometry(.25,0),mat(0xb0aca4)); body.position.y=.45; g.add(body); break; }
    case "flowerpot":{ const pot=new THREE.Mesh(new THREE.CylinderGeometry(.14,.1,.2,10),mat(0xc06a4a)); pot.position.y=.1; g.add(pot);
      const f=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),mat(green)); f.position.y=.28; g.add(f); break; }
    case "well":{ const ring=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,.4,12),mat(0x9a9690)); ring.position.y=.2; g.add(ring);
      const water=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.05,12),waterMaterial()); water.position.y=.35; g.add(water);
      for(const dx of[-.35,.35]){const p=new THREE.Mesh(new THREE.BoxGeometry(.06,.7,.06),mat(dark));p.position.set(dx,.6,0);g.add(p);}
      const roof=new THREE.Mesh(new THREE.ConeGeometry(.5,.3,4),mat(red)); roof.position.y=1.05; roof.rotation.y=.785; g.add(roof); break; }
    case "swing":{ for(const dx of[-.4,.4]){const p=new THREE.Mesh(new THREE.BoxGeometry(.06,.9,.06),mat(dark));p.position.set(dx,.45,0);p.rotation.z=dx>0?-.1:.1;g.add(p);}
      const top=new THREE.Mesh(new THREE.BoxGeometry(.9,.06,.06),mat(dark)); top.position.y=.9; g.add(top);
      const seat=new THREE.Mesh(new THREE.BoxGeometry(.3,.04,.15),mat(wood)); seat.position.set(0,.35,0); g.add(seat); break; }
    case "campfire":{ const ring=[]; for(let i=0;i<6;i++){const a=i/6*6.28;const s=new THREE.Mesh(new THREE.DodecahedronGeometry(.08,0),mat(0x8a8780));s.position.set(Math.cos(a)*.2,.05,Math.sin(a)*.2);g.add(s);}
      const logs=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.3,5),mat(dark)); logs.rotation.z=1.2; logs.position.y=.08; g.add(logs);
      const fire=new THREE.Mesh(new THREE.ConeGeometry(.12,.3,6),new THREE.MeshLambertMaterial({color:0xff7a2a,emissive:0xd04010,transparent:true,opacity:.9})); fire.position.y=.25; g.add(fire); g.userData.fire=fire; break; }
    case "signpost":{ const p=new THREE.Mesh(new THREE.BoxGeometry(.06,.7,.06),mat(dark)); p.position.y=.35; g.add(p);
      const b=new THREE.Mesh(new THREE.BoxGeometry(.4,.18,.04),mat(wood)); b.position.y=.55; g.add(b); break; }
    case "birdbath":{ const stem=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.4,8),mat(0x9a9690)); stem.position.y=.2; g.add(stem);

      const w=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.04,12),waterMaterial()); w.position.y=.47; g.add(w); break; }
    case "hammock":{ for(const dx of[-.5,.5]){const t=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.7,6),mat(dark));t.position.set(dx,.35,0);g.add(t);}
      const net=new THREE.Mesh(new THREE.BoxGeometry(.8,.04,.3),mat(0xe0c890)); net.position.y=.3; net.rotation.x=.05; g.add(net); break; }
    case "snowman":{ const b1=new THREE.Mesh(new THREE.SphereGeometry(.22,12,12),mat(0xf4f8ff)); b1.position.y=.22; g.add(b1);
      const b2=new THREE.Mesh(new THREE.SphereGeometry(.16,12,12),mat(0xf4f8ff)); b2.position.y=.5; g.add(b2);
      const nose=new THREE.Mesh(new THREE.ConeGeometry(.03,.12,6),mat(0xe0902a)); nose.position.set(0,.52,.16); nose.rotation.x=1.5; g.add(nose); break; }
    case "scarecrow":{ const p=new THREE.Mesh(new THREE.BoxGeometry(.06,.9,.06),mat(dark)); p.position.y=.45; g.add(p);
      const arm=new THREE.Mesh(new THREE.BoxGeometry(.6,.06,.06),mat(dark)); arm.position.y=.65; g.add(arm);
      const head=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8),mat(0xe0c890)); head.position.y=.9; g.add(head);
      const hat=new THREE.Mesh(new THREE.ConeGeometry(.18,.2,8),mat(0x8a5a30)); hat.position.y=1.02; g.add(hat); break; }
    case "torii":{ for(const dx of[-.4,.4]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,1.0,8),mat(0xd0402a));p.position.set(dx,.5,0);g.add(p);}
      const top=new THREE.Mesh(new THREE.BoxGeometry(1.0,.1,.12),mat(0xd0402a)); top.position.y=1.0; g.add(top);
      const top2=new THREE.Mesh(new THREE.BoxGeometry(.9,.08,.1),mat(0x303030)); top2.position.y=.85; g.add(top2); break; }
    case "windmill":{ const tower=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.0,8),mat(white)); tower.position.y=.5; g.add(tower);
      const hub=new THREE.Group(); hub.position.set(0,.9,.22);
      for(let i=0;i<4;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,.02),mat(wood));b.position.set(Math.cos(i*1.57)*.25,Math.sin(i*1.57)*.25,0);b.rotation.z=i*1.57;hub.add(b);}
      g.add(hub); g.userData.spin=hub; break; }
    case "flowerarch":{ for(const dx of[-.4,.4]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.9,6),mat(green));p.position.set(dx,.45,0);g.add(p);}
      const top=new THREE.Mesh(new THREE.TorusGeometry(.4,.05,6,12,Math.PI),mat(green)); top.position.y=.9; g.add(top);
      for(let i=0;i<8;i++){const a=i/8*Math.PI;const f=new THREE.Mesh(new THREE.SphereGeometry(.06,6,6),mat(choice([0xe25a8a,0xf0d24a,0xf08ac0])));f.position.set(Math.cos(a)*.4,.9+Math.sin(a)*.4,0);g.add(f);} break; }
    default:{ const fm=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.4),mat(wood)); fm.position.y=.2; g.add(fm); }
  }
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  return g;
}
// applyFurniture を専用モデル版に差し替え

let ambientBirds=[], ambientButterflies=[];
function initAmbientLife(){
  // birds gliding high
  for(let i=0;i<6;i++){
    const b=new THREE.Group();
    const wL=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.4,3),mat(0x404048)); wL.rotation.z=Math.PI/2; wL.position.x=-0.2;
    const wR=wL.clone(); wR.position.x=0.2; wR.rotation.z=-Math.PI/2;
    b.add(wL,wR); b.userData={wL,wR, ang:rand(0,6.28), r:rand(15,30), y:rand(18,28), sp:rand(0.1,0.25)};
    fxGroup.add(b); ambientBirds.push(b);
  }
  // butterflies near ground
  for(let i=0;i<10;i++){
    const m=new THREE.Mesh(new THREE.CircleGeometry(0.12,3), new THREE.MeshBasicMaterial({color:choice([0x8ab0e8,0xf0c020,0xf08ac0,0xffffff]),side:THREE.DoubleSide}));
    m.userData={bx:rand(5,GW-5), bz:rand(5,GH-5), t:rand(0,6.28)};
    fxGroup.add(m); ambientButterflies.push(m);
  }
}
function updateAmbientLife(dt){
  const t=performance.now()*0.001;
  for(const b of ambientBirds){
    b.userData.ang+=b.userData.sp*dt;
    const a=b.userData.ang;
    b.position.set(Player.x-GW/2+Math.cos(a)*b.userData.r, b.userData.y+Math.sin(a*2)*1.5, Player.z-GH/2+Math.sin(a)*b.userData.r);
    b.rotation.y=-a+Math.PI/2;
    const flap=Math.sin(t*8+b.userData.ang*5)*0.5;
    b.userData.wL.rotation.x=flap; b.userData.wR.rotation.x=-flap;
    b.visible = timeBand()==="day";
  }
  for(const m of ambientButterflies){
    m.userData.t+=dt;
    m.userData.bx+=Math.sin(m.userData.t*1.3)*dt*0.6;
    m.userData.bz+=Math.cos(m.userData.t*1.1)*dt*0.6;
    m.userData.bx=clamp(m.userData.bx,3,GW-3); m.userData.bz=clamp(m.userData.bz,3,GH-3);
    const gy=surfaceY(Math.floor(m.userData.bx),Math.floor(m.userData.bz));
    m.position.set(m.userData.bx-GW/2, gy+0.8+Math.sin(m.userData.t*3)*0.3, m.userData.bz-GH/2);
    m.rotation.y=m.userData.t*2; m.rotation.x=Math.sin(m.userData.t*5)*0.5;
    const season=SEASONS[State.seasonIdx].id;
    m.visible=(season==="sp"||season==="su") && timeBand()==="day";
  }
}
let seasonParticles=null, seasonParticleKind=null;
function setupSeasonParticles(){
  const season=SEASONS[State.seasonIdx].id;
  let kind=null;
  if(season==="sp") kind="petal"; else if(season==="au") kind="leaf";
  if(kind===seasonParticleKind) return;
  seasonParticleKind=kind;
  if(seasonParticles){ fxGroup.remove(seasonParticles); seasonParticles=null; }
  if(!kind) return;
  const count=200, geo=new THREE.BufferGeometry(), pos=[];
  for(let i=0;i<count;i++) pos.push(rand(-35,35),rand(0,25),rand(-35,35));
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  const col=kind==="petal"?0xf6b9d4:0xd07a2a;
  seasonParticles=new THREE.Points(geo,new THREE.PointsMaterial({color:col,size:0.18,transparent:true,opacity:0.85,fog:true}));
  fxGroup.add(seasonParticles);
}
function updateSeasonParticles(dt){
  if(!seasonParticles) return;
  const arr=seasonParticles.geometry.attributes.position.array;
  for(let i=0;i<arr.length;i+=3){
    arr[i+1]-=dt*1.5; arr[i]+=Math.sin(performance.now()*0.001+i)*dt*0.5;
    if(arr[i+1]<0){ arr[i+1]=25; arr[i]=Player.x-GW/2+rand(-35,35); arr[i+2]=Player.z-GH/2+rand(-35,35); }
  }
  seasonParticles.geometry.attributes.position.needsUpdate=true;
}

/* ==================================================================== *
 *  45. 地面ブロックの手続き的テクスチャ（canvasで生成して見栄えを向上）
 * ==================================================================== */
const _texCache={};
function rc(){ return Math.random(); }
function makeBlockTexture(id, baseHex){
  if(_texCache[id]) return _texCache[id];
  const S=64, cv=document.createElement("canvas"); cv.width=cv.height=S; const ctx=cv.getContext("2d");
  const base="#"+baseHex.toString(16).padStart(6,"0");
  ctx.fillStyle=base; ctx.fillRect(0,0,S,S);
  const darken=(f)=>{const c=baseHex; let r=((c>>16)&255)*f,g=((c>>8)&255)*f,b=(c&255)*f; return `rgb(${r|0},${g|0},${b|0})`;};
  const lighten=(f)=>{const c=baseHex; let r=Math.min(255,((c>>16)&255)*f),g=Math.min(255,((c>>8)&255)*f),b=Math.min(255,(c&255)*f); return `rgb(${r|0},${g|0},${b|0})`;};
  const grassLike=["grass","grass2","grass3","meadow","clover","flowerf","moss","darkgrs"];
  const stoneLike=["stone","stone2","granite","basalt","slate","cobble","gravel","gravel2","moss2","ash","ruin2"];
  const sandLike=["sand","sand2","beach","redsand","dirt","dirt2","farm","mud"];
  const woodLike=["wood","wood2","plank","bamboofl","path"];
  const snowLike=["snow","snow2","ice","frost"];
  if(grassLike.includes(id)){
    for(let i=0;i<120;i++){ ctx.strokeStyle= i%2?darken(0.8):lighten(1.15); ctx.beginPath(); const x=rc()*S,y=rc()*S; ctx.moveTo(x,y); ctx.lineTo(x+rc()*2-1,y-2-rc()*3); ctx.stroke(); }
    if(id==="flowerf"||id==="clover"){ for(let i=0;i<14;i++){ ctx.fillStyle=choice(["#e8d24a","#e86a8a","#ffffff","#f0a0c0"]); ctx.beginPath(); ctx.arc(rc()*S,rc()*S,1.6,0,7); ctx.fill(); } }
  } else if(stoneLike.includes(id)){
    for(let i=0;i<60;i++){ ctx.fillStyle= rc()<0.5?darken(0.85):lighten(1.1); const x=rc()*S,y=rc()*S,r=1+rc()*3; ctx.fillRect(x,y,r,r); }
    ctx.strokeStyle=darken(0.7); for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(rc()*S,rc()*S); ctx.lineTo(rc()*S,rc()*S); ctx.stroke(); }
    if(id==="moss2"){ for(let i=0;i<30;i++){ ctx.fillStyle="rgba(80,140,60,0.6)"; ctx.beginPath(); ctx.arc(rc()*S,rc()*S,rc()*4,0,7); ctx.fill(); } }
  } else if(sandLike.includes(id)){
    for(let i=0;i<300;i++){ ctx.fillStyle= rc()<0.5?darken(0.92):lighten(1.06); ctx.fillRect(rc()*S,rc()*S,1,1); }
    if(id==="farm"){ ctx.strokeStyle=darken(0.8); for(let y=4;y<S;y+=10){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); } }
  } else if(woodLike.includes(id)){
    ctx.strokeStyle=darken(0.8); for(let y=0;y<S;y+=8){ ctx.beginPath(); ctx.moveTo(0,y+rc()*2); ctx.lineTo(S,y+rc()*2); ctx.lineWidth=1.5; ctx.stroke(); }
    for(let i=0;i<40;i++){ ctx.fillStyle=darken(0.85); ctx.fillRect(rc()*S,rc()*S,1,3); }
  } else if(snowLike.includes(id)){
    for(let i=0;i<80;i++){ ctx.fillStyle="rgba(255,255,255,0.9)"; ctx.fillRect(rc()*S,rc()*S,rc()*2,rc()*2); }
    if(id==="ice"){ ctx.strokeStyle="rgba(180,220,240,0.8)"; for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(rc()*S,rc()*S); ctx.lineTo(rc()*S,rc()*S); ctx.stroke(); } }
  } else if(id==="brick"||id==="brick2"){
    ctx.strokeStyle=darken(0.7); ctx.lineWidth=1.5;
    for(let y=0;y<S;y+=12){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); const off=(y/12)%2?0:S/4; for(let x=off;x<S;x+=S/2){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+12); ctx.stroke(); } }
  } else if(id==="tile"||id==="tile2"||id==="cobble"||id==="stonepth"||id==="goldtile"||id==="marble"){
    ctx.strokeStyle=darken(0.75); ctx.lineWidth=1;
    for(let g=0;g<=S;g+=16){ ctx.beginPath(); ctx.moveTo(g,0); ctx.lineTo(g,S); ctx.moveTo(0,g); ctx.lineTo(S,g); ctx.stroke(); }
    if(id==="tile2"){ for(let x=0;x<S;x+=16)for(let y=0;y<S;y+=16){ if(((x+y)/16)%2===0){ ctx.fillStyle=darken(0.9); ctx.fillRect(x,y,16,16);} } }
  } else if(id==="lava"||id==="glow"||id==="crystal"||id==="cloud"){
    for(let i=0;i<40;i++){ ctx.fillStyle= lighten(1.3); ctx.beginPath(); ctx.arc(rc()*S,rc()*S,rc()*3,0,7); ctx.fill(); }
  } else {
    for(let i=0;i<60;i++){ ctx.fillStyle= rc()<0.5?darken(0.92):lighten(1.08); ctx.fillRect(rc()*S,rc()*S,2,2); }
  }
  const tex=new THREE.CanvasTexture(cv); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.magFilter=THREE.NearestFilter;
  _texCache[id]=tex; return tex;
}
// getGroundMat をテクスチャ対応に差し替え＆既存マテリアルへ適用
const _origGetGroundMat=getGroundMat;
getGroundMat=function(blockId){
  const m=_origGetGroundMat(blockId);
  if(!m.map){ const def=GROUND_BLOCKS.find(b=>b.id===blockId); if(def){ m.map=makeBlockTexture(blockId,def.col); m.needsUpdate=true; } }
  return m;
};

}

let habitatGroup=null;
function ensureHabitatGroup(){ if(!habitatGroup){ habitatGroup=new THREE.Group(); scene.add(habitatGroup); } }
function placeHabitat(x,z){
  const def=HABITATS.find(h=>h.id===activeTool); if(!def) return;
  ensureHabitatGroup();
  const g=buildHabitatModel(def.id); g.position.set(x-GW/2, surfaceY(x,z), z-GH/2); g.userData={habitat:true,id:def.id,x,z}; habitatGroup.add(g);
  State.habitats.push({id:def.id,x,z});
  toast(def.ic+" "+def.nm+"を作った！動物が集まるかも"); playSfx("place");
  // immediately attract a matching animal
  attractToHabitat(def.attract, x, z);
  recalcRating();
}
function attractToHabitat(habName, x, z){
  const season=SEASONS[State.seasonIdx].id;
  const pool=ANIMALS.filter(a=>!a.rare && a.hab===habName && a.season.includes(season));
  if(!pool.length) return;
  const n=randi(1,3);
  for(let i=0;i<n;i++){ const def=choice(pool); spawnAnimal(def, clamp(x+randi(-2,2),3,GW-3), clamp(z+randi(-2,2),3,GH-3)); }
}
function rebuildHabitats(){
  ensureHabitatGroup(); while(habitatGroup.children.length) habitatGroup.remove(habitatGroup.children[0]);
  for(const h of State.habitats){ const g=buildHabitatModel(h.id); g.position.set(h.x-GW/2,surfaceY(h.x,h.z),h.z-GH/2); g.userData={habitat:true,id:h.id,x:h.x,z:h.z}; habitatGroup.add(g); }
}

 *  49. 環境音（雨・川・夜の虫の音・焚き火）— Web Audioで生成
 * ==================================================================== */
let noiseBuffer=null, rainSrc=null, rainGain=null, rainFilter=null;
function makeNoiseBuffer(){
  if(!AC||noiseBuffer) return noiseBuffer;
  const len=AC.sampleRate*2; noiseBuffer=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuffer.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return noiseBuffer;
}
function startRainSound(){
  if(!AC||rainSrc) return; makeNoiseBuffer();
  rainSrc=AC.createBufferSource(); rainSrc.buffer=noiseBuffer; rainSrc.loop=true;
  rainFilter=AC.createBiquadFilter(); rainFilter.type="lowpass"; rainFilter.frequency.value=1400;
  rainGain=AC.createGain(); rainGain.gain.value=0;
  rainSrc.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(masterGain); rainSrc.start();
}
let insectTimer=null;
function updateAmbientAudio(){
  if(!AC||!State.settings.sfx){ if(rainGain) rainGain.gain.value=0; return; }
  startRainSound();
  const w=State.weather; let target=0;
  if(w==="rain") target=0.08; else if(w==="heavyrain") target=0.16; else if(w==="snowstorm") target=0.05;
  if(rainGain) rainGain.gain.linearRampToValueAtTime(target, AC.currentTime+1.0);
  // night insects (summer/autumn)
  const season=SEASONS[State.seasonIdx].id, night=timeBand()==="night";
  const wantInsects = night && (season==="su"||season==="au") && w!=="rain" && w!=="heavyrain";
  if(wantInsects && !insectTimer){
    insectTimer=setInterval(()=>{ if(!AC||!State.settings.sfx)return; const f=season==="au"?[1800,2000,2200]:[2600,2800]; tone(choice(f),0.08,"sine",0.02); if(Math.random()<0.5) tone(choice(f),0.06,"sine",0.015,0.1); }, 700);
  } else if(!wantInsects && insectTimer){ clearInterval(insectTimer); insectTimer=null; }
}
setInterval(()=>{ if(gameStarted) updateAmbientAudio(); }, 4000);
