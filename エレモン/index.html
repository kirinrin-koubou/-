<meta charset="UTF-8">

<title>ELEMON ― モンスター育成RPG</title>
<style>
  :root{ --c-grass:#4caf50; --c-fire:#ff5a3c; --c-water:#3aa0ff; --c-elec:#ffd43b; --c-earth:#b07a3a; --c-none:#9aa0a8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#0c0e14;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;background:#000;box-shadow:0 0 40px rgba(0,0,0,.8);image-rendering:pixelated}

       padding:10px;pointer-events:none;opacity:.85}

      font-size:15px;height:46px;display:flex;align-items:center;justify-content:center;
      user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .vb:active{background:#3a64ff}
  .vb.k{height:46px}
  #u{grid-area:2/2}#d{grid-area:3/2}#l{grid-area:2/1}#r{grid-area:2/3}.sp{visibility:hidden}
  #ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:#0c0e14;color:#9fb1ff;font-size:18px;z-index:50}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;

/* ---------- 2. オーディオ (§11) WebAudio 合成 ---------- */
var Audio=(function(){
  var ctx=null, bgmTimer=null, bgmGain=null, settings={bgm:.3,se:.6,shake:true};
  var melodies={
    field:[ [330,0.18],[392,0.18],[440,0.18],[392,0.18],[330,0.18],[294,0.18],[330,0.36] ],
    battle:[ [262,0.14],[330,0.14],[392,0.14],[523,0.14],[392,0.14],[330,0.14] ],
    boss:[ [220,0.14],[262,0.14],[208,0.14],[247,0.14],[196,0.2] ],
    win:[ [523,0.16],[659,0.16],[784,0.16],[1047,0.4] ]
  };
  function ensure(){
    if(ctx) return true;
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); return true; }
    catch(e){ return false; }
  }
  function resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); }
  function tone(freq,dur,type,vol){
    if(!ensure()||vol<=0) return;
    try{
      var o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
      o.type=type||'square'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function se(name){
    var v=settings.se*0.5;
    if(name==='ok') tone(660,0.08,'square',v);
    else if(name==='cancel') tone(280,0.09,'square',v);
    else if(name==='hit') tone(150,0.12,'sawtooth',v);
    else if(name==='crit'){ tone(180,0.1,'sawtooth',v); tone(360,0.12,'square',v);}
    else if(name==='catch'){ tone(523,0.1,'square',v); setTimeout(function(){tone(784,0.18,'square',v)},120);}
    else if(name==='heal') tone(880,0.16,'sine',v);
    else if(name==='lvup'){ tone(523,0.09,'square',v); setTimeout(function(){tone(784,0.16,'square',v)},90);}
    else if(name==='faint') tone(120,0.4,'sawtooth',v);
  }
  function stopBgm(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
  function playBgm(name){
    stopBgm();
    if(settings.bgm<=0||!ensure()) return;
    var mel=melodies[name]||melodies.field, i=0;
    function step(){
      if(settings.bgm<=0){ return; }
      var n=mel[i%mel.length];
      tone(n[0], n[1]*0.95, 'square', settings.bgm*0.22);
      tone(n[0]/2, n[1]*0.95, 'triangle', settings.bgm*0.16);
      i++;
    }
    step(); bgmTimer=setInterval(step, 220);
  }
  function setVol(b,s){ settings.bgm=b; settings.se=s; }
  return {se,playBgm,stopBgm,resume,ensure,setVol,settings};
})();

/* ---------- 3. セーブ (§15) ---------- */
var Save=(function(){
  var KEY='elemon.save.v3', BAK='elemon.save.bak', SKEY='elemon.settings', VER=3;
  function defSettings(){ return {bgm:.3,se:.6,textSpeed:2,shake:true,colorAssist:true,tutorial:true,hudPanel:true}; }
  function loadSettings(){
    try{ var s=JSON.parse(localStorage.getItem(SKEY)); if(s&&typeof s==='object'){ var d=defSettings(); for(var k in d) if(s[k]==null)s[k]=d[k]; return s; } }
    catch(e){}
    return defSettings();
  }
  function saveSettings(s){ try{ localStorage.setItem(SKEY,JSON.stringify(s)); }catch(e){} }
  function exists(){ try{ return !!localStorage.getItem(KEY); }catch(e){ return false; } }
  function save(state){
    try{
      var data={ver:VER,player:state.player,party:state.party,box:state.box,
        bag:state.bag,dex:state.dex,flags:state.flags,stats:state.stats};
      var str=JSON.stringify(data);
      var prev=localStorage.getItem(KEY);
      if(prev) localStorage.setItem(BAK,prev);
      localStorage.setItem(KEY,str);
      return true;
    }catch(e){ return false; }
  }
  function migrate(d){
    // 欠損補完 §15
    d.player=d.player||{}; var p=d.player;
    if(p.x==null)p.x=5; if(p.y==null)p.y=10; if(!p.area)p.area='A1';
    if(p.gem==null)p.gem=0; if(p.badges==null)p.badges=0;
    d.party=Array.isArray(d.party)?d.party:[];
    d.box=Array.isArray(d.box)?d.box:[];
    d.bag=d.bag||{potion:3,ball:5};
    d.dex=d.dex||{}; d.flags=d.flags||{};
    d.stats=d.stats||{playTime:0,caught:0,start:Date.now()};
    return d;
  }
  function tryParse(str){ try{ var d=JSON.parse(str); if(d&&typeof d==='object') return migrate(d); }catch(e){} return null; }
  function load(){
    var d=null;
    try{ d=tryParse(localStorage.getItem(KEY)); }catch(e){}
    if(!d){ try{ d=tryParse(localStorage.getItem(BAK)); }catch(e){} }
    return d; // null なら新規
  }
  function wipe(){ try{ localStorage.removeItem(KEY); localStorage.removeItem(BAK); }catch(e){} }
  return {save,load,exists,loadSettings,saveSettings,wipe,VER};
})();

/* ---------- 4. モンスター生成・成長計算 (§4/§6/§7) ---------- */
var Mon=(function(){
  function need(lv){ return Math.floor(Math.pow(lv,3)*0.8); }
  function statHP(base,lv){ return Math.floor(base*lv/50)+lv*2+10; }
  function stat(base,lv){ return Math.floor(base*lv/50)+lv+5; }
  function moveSetFor(sid,lv){
    var sp=DB.SPECIES[sid], ms=[];
    for(var i=0;i<sp.learn.length;i++){ if(sp.learn[i][0]<=lv) ms.push(sp.learn[i][1]); }
    if(ms.length===0) ms.push(sp.learn[0][1]);
    return ms.slice(-4);
  }
  function create(sid,lv){
    sid=DB.SPECIES[sid]?sid:'sprig';
    lv=Math.max(1,Math.min(50,lv|0));
    var sp=DB.SPECIES[sid];
    var m={sid:sid,lv:lv,exp:need(lv),moves:moveSetFor(sid,lv),nick:null};
    m.maxhp=statHP(sp.base.hp,lv); m.hp=m.maxhp;
    recalc(m); m.hp=m.maxhp;
    return m;
  }
  function recalc(m){
    var sp=DB.SPECIES[m.sid];
    var oldMax=m.maxhp||0;
    m.maxhp=statHP(sp.base.hp,m.lv);
    m.atk=stat(sp.base.atk,m.lv);
    m.def=stat(sp.base.def,m.lv);
    m.spd=stat(sp.base.spd,m.lv);
    if(oldMax>0){ m.hp=Math.min(m.maxhp, m.hp + (m.maxhp-oldMax)); }
  }
  function name(m){ return m.nick || DB.SPECIES[m.sid].name; }
  function type(m){ return DB.SPECIES[m.sid].type; }
  // 経験値付与 → レベルアップ/技習得/進化 (戻り: イベント配列)
  function gainExp(m,amount){
    var ev=[];
    if(m.lv>=50){ return ev; }
    m.exp+=amount;
    while(m.lv<50 && m.exp>=need(m.lv+1)){
      m.lv++;
      recalc(m);
      ev.push({t:'lvup',lv:m.lv});
      var sp=DB.SPECIES[m.sid];
      for(var i=0;i<sp.learn.length;i++){
        if(sp.learn[i][0]===m.lv){
          var mv=sp.learn[i][1];
          if(m.moves.indexOf(mv)<0){
            if(m.moves.length<4){ m.moves.push(mv); ev.push({t:'learn',mv:mv}); }
            else { var old=m.moves.shift(); m.moves.push(mv); ev.push({t:'learn',mv:mv,replaced:old}); }
          }
        }
      }
      if(sp.evolveLv && m.lv>=sp.evolveLv && DB.SPECIES[sp.evolveTo]){
        var from=sp.name; m.sid=sp.evolveTo; recalc(m);
        var ns=DB.SPECIES[m.sid];
        for(var j=0;j<ns.learn.length;j++){ if(ns.learn[j][0]<=m.lv && m.moves.indexOf(ns.learn[j][1])<0 && m.moves.length<4) m.moves.push(ns.learn[j][1]); }
        ev.push({t:'evolve',from:from,to:ns.name});
        sp=ns;
      }
    }
    if(m.lv>=50) m.exp=need(50);
    return ev;
  }
  function expRatio(m){
    if(m.lv>=50) return 1;
    var lo=need(m.lv), hi=need(m.lv+1);
    return Math.max(0,Math.min(1,(m.exp-lo)/(hi-lo||1)));
  }
  return {create,recalc,name,type,gainExp,need,expRatio,moveSetFor};
})();

/* ---------- 5. ワールド/マップ生成 (§5) ---------- */
var World=(function(){
  var W=44,H=28,TS=32, MID=14;
  var cache={};
  // 各エリア手続き生成。0床1壁2草4前ゲート5回復6戻りゲート
  function gen(area){
    if(cache[area]) return cache[area];
    var def=DB.AREAS[area];
    var g=new Array(W*H);
    for(var y=0;y<H;y++)for(var x=0;x<W;x++){
      g[y*W+x]=(x===0||y===0||x===W-1||y===H-1)?1:0;
    }
    function set(x,y,v){ if(x>0&&y>0&&x<W-1&&y<H-1) g[y*W+x]=v; }
    // 草パッチ（広め・複数）
    var patches=[[6,4,16,10],[24,4,38,10],[5,18,18,24],[24,18,39,24],[19,12,28,16]];
    for(var p=0;p<patches.length;p++){ var a=patches[p];
      for(var yy=a[1];yy<=a[3];yy++)for(var xx=a[0];xx<=a[2];xx++) set(xx,yy,2); }
    // 障害の壁（短く・横移動回廊 y=13..15 とトレーナー帯は避ける）
    var walls=[[9,4,10,7],[16,18,18,21],[30,5,32,8],[34,18,36,21],[20,21,23,23],[37,4,39,6]];
    for(var w=0;w<walls.length;w++){ var b=walls[w];
      for(var wy=b[1];wy<=b[3];wy++)for(var wx=b[0];wx<=b[2];wx++)
        if(wy<13||wy>15) set(wx,wy,1); }
    // 横断回廊を確保
    for(var cx=1;cx<W-1;cx++){ set(cx,MID,0); }
    // 回復拠点・前後ゲート
    set(3,MID,5);
    set(W-2,MID,4);
    if(def.prev) set(1,MID,6);
    // 落ちているアイテム（周囲を歩行可能に整地）
    var items=[];
    (def.drops||[]).forEach(function(d,i){
      var ix=d[0],iy=d[1];
      set(ix,iy,0); set(ix-1,iy,0); set(ix+1,iy,0); set(ix,iy-1,0); set(ix,iy+1,0);
      items.push({x:ix,y:iy,key:d[2],id:area+'_'+i});
    });
    cache[area]={w:W,h:H,grid:g,start:{x:5,y:MID},pal:def.pal,
      healAt:{x:3,y:MID}, gate:{x:W-2,y:MID}, backGate:{x:1,y:MID}, items:items};
    return cache[area];
  }
  function tile(map,x,y){ if(x<0||y<0||x>=map.w||y>=map.h) return 1; return map.grid[y*map.w+x]; }
  return {gen,tile,W,H,TS};
})();

/* ---------- 6. ゲーム本体：状態・シーン・ループ (§14) ---------- */
var Game=(function(){

    for(var i=zones.length-1;i>=0;i--){ var z=zones[i];

  /* ---- 新規/継続 ---- */

  /* ===================== チュートリアル (§9) ===================== */
  var tut={on:false,page:0,cb:null};

  function updateTutorial(){

  function wrapText(t,cx,cy,maxw,lh){
    var words=t.split(''), line='', lines=[];
    for(var i=0;i<words.length;i++){ var test=line+words[i];
      if(g.measureText(test).width>maxw){ lines.push(line); line=words[i]; } else line=test; }
    lines.push(line);

  /* ===================== FIELD (§5) ===================== */
  var moveCool=0;
  function enterField(playBgm){
    transition(function(){
      scene=SC.FIELD;
      if(playBgm) Audio.playBgm('field');
    });
  }
  function curMap(){ return World.gen(state.player.area); }
  function canWalk(map,x,y){
    return World.tile(map,x,y)!==1; // 壁以外は通行可（ゲート通過は踏破後に判定）
  }
  function gateOpen(){
    var area=state.player.area, def=DB.AREAS[area];
    // 各エリアの関門トレーナーバッジを取得していれば開く
    var tr=DB.TRAINERS[area][0];
    return state.flags['beat_'+tr.id];
  }
  function updateField(dt){
    var p=state.player, map=curMap();
    if(edge.hud){ settings.hudPanel=!settings.hudPanel; Audio.se('ok');
      Save.saveSettings(settings); toast(settings.hudPanel?'パネル表示':'パネル非表示'); }
    if(edge.menu){ Audio.se('ok'); scene=SC.MENU; menuInit(); return; }
    if(p.moving){
      var tx=p.x*32, ty=p.y*32, sp=8;
      if(p.px<tx)p.px=Math.min(tx,p.px+sp); else if(p.px>tx)p.px=Math.max(tx,p.px-sp);
      if(p.py<ty)p.py=Math.min(ty,p.py+sp); else if(p.py>ty)p.py=Math.max(ty,p.py-sp);
      if(p.px===tx&&p.py===ty){ p.moving=false; onStep(); }
      return;
    }
    if(edge.ok && World.tile(map,p.x,p.y)===5){ Audio.se('ok'); scene=SC.SHOP; shopInit(); return; }
    var dx=0,dy=0,f=p.facing;
    if(input.up){dy=-1;f='up';} else if(input.down){dy=1;f='down';}
    else if(input.left){dx=-1;f='left';} else if(input.right){dx=1;f='right';}
    if(dx||dy){
      p.facing=f;
      var nx=p.x+dx, ny=p.y+dy;
      // トレーナー接触判定
      var tr=trainerAt(nx,ny);
      if(tr){ startTrainerBattle(tr); return; }
      if(canWalk(map,nx,ny)){
        var t=World.tile(map,nx,ny);
        if(t===4 && !gateOpen()){
          toast('このゲートは関門を突破すると開く');
        } else {
          p.x=nx; p.y=ny; p.moving=true;
        }
      }
    }
  }
  function trainerAt(x,y){
    var list=DB.TRAINERS[state.player.area]||[];
    for(var i=0;i<list.length;i++){ var tr=list[i];
      if(tr.x===x&&tr.y===y && !state.flags['beat_'+tr.id]) return tr; }
    return null;
  }
  function onStep(){
    var p=state.player, map=curMap(), t=World.tile(map,p.x,p.y);
    state.stats.playTime=(Date.now()-(state.stats.start||Date.now()))/1000;
    if(t===5){ // 拠点：全回復＆オートセーブ
      var healed=false;
      state.party.forEach(function(m){ if(m.hp<m.maxhp){m.hp=m.maxhp;healed=true;} });
      if(healed){ Audio.se('heal'); toast('パーティを回復した'); }
      if(Save.save(state)) toast('オートセーブ完了');
      state.steps=0;
      return;
    }
    // 落ちているアイテム回収
    if(map.items){
      for(var ii=0;ii<map.items.length;ii++){ var it=map.items[ii];
        if(it.x===p.x && it.y===p.y && !state.flags['itm_'+it.id]){
          state.flags['itm_'+it.id]=true;
          state.bag[it.key]=(state.bag[it.key]||0)+1;
          Audio.se('lvup'); toast(DB.ITEMS[it.key].name+' を ひろった！');
          Save.save(state);
        }
      }
    }
    if(t===4){ // 前ゲート → 次エリア（関門突破が必要）
      var def=DB.AREAS[p.area];
      if(def.next && gateOpen()){
        transition(function(){
          p.area=def.next; var nm=World.gen(p.area);
          p.x=2; p.y=nm.backGate.y; p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
          toast(DB.AREAS[p.area].name+' に到着');
          Save.save(state);
        });
      } else { toast('このゲートは関門を突破すると開く'); }
      return;
    }
    if(t===6){ // 戻りゲート → 前エリア（いつでも可）
      var def2=DB.AREAS[p.area];
      if(def2.prev){
        transition(function(){
          p.area=def2.prev; var pm=World.gen(p.area);
          p.x=pm.w-3; p.y=pm.gate.y; p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
          toast(DB.AREAS[p.area].name+' に もどった');
          Save.save(state);
        });
      }
      return;
    }
    if(t===2){ // 草：エンカウント抽選 §4
      state.steps++;
      var prob=Math.min(0.28, 0.10 + 0.01*state.steps);
      if(Math.random()<prob){ state.steps=0; startWildBattle(); }
    } else state.steps=0;
  }
  function drawField(){
    var p=state.player, map=curMap(), def=DB.AREAS[p.area];
    // カメラ
    var camx=Math.floor(p.px - 480 + 16), camy=Math.floor(p.py - 320 + 16);
    camx=Math.max(0,Math.min(camx, map.w*32-960));
    camy=Math.max(0,Math.min(camy, map.h*32-640));
    g.fillStyle=def.pal; g.fillRect(0,0,960,640);
    var c0=Math.floor(camx/32), r0=Math.floor(camy/32);
    for(var ry=r0; ry<r0+21 && ry<map.h; ry++){
      for(var rx=c0; rx<c0+31 && rx<map.w; rx++){
        var t=World.tile(map,rx,ry), sx=rx*32-camx, sy=ry*32-camy;
        if(t===1){ g.fillStyle='#2a2f3e'; g.fillRect(sx,sy,32,32);
          g.fillStyle='#363c4e'; g.fillRect(sx+2,sy+2,28,6); }
        else if(t===2){ g.fillStyle='#2f5d33'; g.fillRect(sx,sy,32,32);
          g.fillStyle='#3f7a44'; for(var b=0;b<4;b++) g.fillRect(sx+4+b*7,sy+18-(b%2)*4,4,12); }

  /* ===================== BATTLE (§4) ===================== */
  var B=null;
  function freshBattler(m){ return m; }
  function startWildBattle(){
    var def=DB.AREAS[state.player.area];
    var lv=def.wildLv[0]+Math.floor(Math.random()*(def.wildLv[1]-def.wildLv[0]+1));
    var sid=def.pool[Math.floor(Math.random()*def.pool.length)];
    setupBattle({wild:true, foe:[Mon.create(sid,lv)]});
  }
  function startTrainerBattle(tr){
    var party=tr.party.map(function(p){ return Mon.create(p[0],p[1]); });
    setupBattle({wild:false, foe:party, trainer:tr});
  }
  function firstAlive(party){ for(var i=0;i<party.length;i++) if(party[i].hp>0) return i; return -1; }
  function setupBattle(opt){
    var pi=firstAlive(state.party);
    if(pi<0){ blackout(); return; }
    B={ wild:opt.wild, trainer:opt.trainer||null, foeParty:opt.foe, foeIdx:0,
        pIdx:pi, msgQ:[], phase:'intro', sel:0, sub:0, anim:0,
        pHpShown:state.party[pi].hp, fHpShown:opt.foe[0].hp,
        catchShake:0, busy:0, popups:[], runTries:0, ended:false, expGiven:false };
    Audio.playBgm(opt.trainer&&opt.trainer.boss?'boss':'battle');
    pushMsg(opt.wild? ('野生の '+Mon.name(opt.foe[0])+' があらわれた！')
      : (B.trainer.name+' が しょうぶを しかけてきた！'));
    transition(function(){ scene=SC.BATTLE; });
  }
  function pMon(){ return state.party[B.pIdx]; }
  function fMon(){ return B.foeParty[B.foeIdx]; }
  function pushMsg(t,cb){ B.msgQ.push({t:t,cb:cb||null}); }
  function popPopup(x,y,txt,col){ B.popups.push({x:x,y:y,t:txt,col:col||'#fff',life:60}); }

  // ダメージ計算 §4
  function calcDamage(att,dfn,move){
    var mv=DB.MOVES[move];
    if(mv.kind==='heal'||mv.kind==='buff') return {dmg:0,eff:1,crit:false,miss:false,mv:mv};
    if(Math.random()*100 > mv.acc) return {dmg:0,eff:1,crit:false,miss:true,mv:mv};
    var stab = (mv.type===Mon.type(att))?1.5:1;
    var te = DB.eff(mv.type, Mon.type(dfn));
    var crit = Math.random()<0.0625;
    var base = Math.floor(((2*att.lv/5+2)*mv.power*att.atk/Math.max(1,dfn.def))/50)+2;
    var dmg = Math.floor(base*stab*te*(0.90+Math.random()*0.10)*(crit?1.5:1));
    dmg=Math.max(1,dmg);
    return {dmg:dmg,eff:te,crit:crit,miss:false,mv:mv};
  }
  function aiChoose(){
    var f=fMon(), p=pMon();
    // HP低下＆回復技 §6
    if(f.hp < f.maxhp*0.25){
      for(var h=0;h<f.moves.length;h++) if(DB.MOVES[f.moves[h]].kind==='heal' && Math.random()<0.5) return f.moves[h];
    }
    if(Math.random()<0.8){
      var best=f.moves[0], bv=-1;
      for(var i=0;i<f.moves.length;i++){ var mv=DB.MOVES[f.moves[i]];
        if(mv.kind!=='atk'&&mv.kind!=='drain') continue;
        var v=mv.power * (mv.type===Mon.type(f)?1.5:1) * DB.eff(mv.type,Mon.type(p));
        if(v>bv){ bv=v; best=f.moves[i]; } }
      return best;
    }
    return f.moves[Math.floor(Math.random()*f.moves.length)];
  }
  function tryCatch(ballMul){
    var f=fMon(), sp=DB.SPECIES[f.sid];
    var a=Math.floor((3*f.maxhp-2*f.hp)*sp.cap*ballMul/(3*f.maxhp));
    a=Math.max(1,Math.min(255,a));
    if(ballMul>=255) return 4; // master
    var shakes=0;
    for(var s=0;s<4;s++){ if(Math.random() < a/255) shakes++; else break; }
    return shakes;
  }
  function expFor(foe){ return Math.floor(DB.SPECIES[foe.sid].exp * foe.lv / 7); }

  function battleVictory(){
    if(B.ended) return; B.ended=true;
    // EXP付与（生存メンバー全員に均等寄与：簡略=戦闘参加者）
    var foe=B.lastFoe||fMon();
    var gain=expFor(foe);
    var alive=state.party.filter(function(m){return m.hp>0;});
    var per=Math.max(1,Math.floor(gain/Math.max(1,alive.length)));
    var msgs=[];
    alive.forEach(function(m){
      var ev=Mon.gainExp(m,per);
      ev.forEach(function(e){
        if(e.t==='lvup') msgs.push(Mon.name(m)+' は レベル '+e.lv+' に あがった！');
        else if(e.t==='learn') msgs.push(Mon.name(m)+' は '+DB.MOVES[e.mv].name+' を おぼえた！'+(e.replaced?'('+DB.MOVES[e.replaced].name+'を忘れた)':''));
        else if(e.t==='evolve'){ msgs.push(e.from+' は '+e.to+' に しんかした！'); state.dex[m.sid]=true; }
      });
    });
    var gem = foe.lv*6 + Math.floor(Math.random()*11);
    if(B.trainer){ gem = B.trainer.reward; }
    state.player.gem += gem;
    pushMsg((B.trainer?B.trainer.name+' に かった！':'戦闘に かった！'));
    pushMsg(Mon.name(alive[0]||state.party[0])+' たちは '+per+' の けいけんちを えた！');
    for(var i=0;i<msgs.length;i++) pushMsg(msgs[i]);
    pushMsg(gem+' ジェムを てにいれた！',function(){ Audio.se('lvup'); });
    if(B.trainer){
      state.flags['beat_'+B.trainer.id]=true;
      if(B.trainer.badge && B.trainer.badge<=4){
        state.player.badges=Math.max(state.player.badges,B.trainer.badge);
        pushMsg('バッジ '+B.trainer.badge+' を かくとく！ あたらしいエリアへの ゲートが ひらいた！');
      }
      if(B.trainer.boss){
        pushMsg('監督者ヴァロンを とめた！ せかいに へいわが もどった…',function(){ endingTrigger(); });
      }
      Save.save(state);
    }
    B.phase='msg'; B.afterMsg='end';
  }
  function battleDefeatNext(){
    // 自分の手持ち交代 or 全滅
    var ni=firstAlive(state.party);
    if(ni<0){ pushMsg('めの まえが まっくらに なった…',function(){ blackout(); }); B.phase='msg'; B.afterMsg='lose'; }
    else { B.pIdx=ni; B.pHpShown=pMon().hp; pushMsg('がんばれ！ '+Mon.name(pMon())+'！'); B.phase='msg'; B.afterMsg='menu'; }
  }
  function foeDefeated(){
    B.lastFoe=fMon();
    Audio.se('faint');
    pushMsg(Mon.name(fMon())+' は たおれた！');
    if(B.wild){ B.phase='msg'; B.afterMsg='victory'; return; }
    // トレーナー：次のエレモン
    var next=-1;
    for(var i=B.foeIdx+1;i<B.foeParty.length;i++){ if(B.foeParty[i].hp>0){ next=i; break; } }
    if(next<0){ B.phase='msg'; B.afterMsg='victory'; }
    else { B.foeIdx=next; B.fHpShown=fMon().hp;
      pushMsg(B.trainer.name+' は '+Mon.name(fMon())+' を くりだした！'); B.phase='msg'; B.afterMsg='menu'; }
  }
  function blackout(){
    Audio.stopBgm();
    // 全滅救済 §5/§8
    state.party.forEach(function(m){ m.hp=m.maxhp; });
    var lost=Math.floor(state.player.gem*0.10);
    state.player.gem-=lost;
    state.player.area = state.player.area; // 現エリアの開始地点へ
    var mp=World.gen(state.player.area);
    state.player.x=mp.start.x; state.player.y=mp.start.y;
    state.player.px=state.player.x*32; state.player.py=state.player.y*32; state.player.moving=false;
    // 救済薬 §8
    var totalHeal=(state.bag.potion||0)+(state.bag.spotion||0)+(state.bag.hpotion||0);
    if(state.player.gem<30 && totalHeal===0){ state.bag.potion=(state.bag.potion||0)+1; toast('支援薬を うけとった'); }
    Save.save(state);
    B=null;
    transition(function(){ scene=SC.FIELD; Audio.playBgm('field');
      toast('拠点で めをさました（'+lost+'ジェム ロスト）'); });
  }

  // 戦闘アクション解決
  function resolveTurn(playerMove){
    var p=pMon(), f=fMon();
    var foeMove=aiChoose();
    var pFirst = p.spd>=f.spd;
    var order = pFirst ? [['p',playerMove],['f',foeMove]] : [['f',foeMove],['p',playerMove]];
    B.turnQ=[];
    order.forEach(function(o){
      B.turnQ.push(o);
    });
    B.execI=0;
    execStep(); // ターン解決を開始（exec→msg→exec ループ）
  }
  function doAction(side,move){
    var att = side==='p'?pMon():fMon();
    var dfn = side==='p'?fMon():pMon();
    if(att.hp<=0) return; // 既に倒れている
    var mv=DB.MOVES[move];
    if(mv.kind==='heal'){
      var h=Math.floor(att.maxhp*0.5); att.hp=Math.min(att.maxhp,att.hp+h);
      Audio.se('heal'); pushMsg(Mon.name(att)+' は たいりょくを かいふくした！');
      return;
    }
    if(mv.kind==='buff'){ pushMsg(Mon.name(att)+' は みを かためた！'); return; }
    var r=calcDamage(att,dfn,move);
    if(r.miss){ pushMsg(Mon.name(att)+' の '+mv.name+'！ しかし はずれた！'); return; }
    dfn.hp=Math.max(0,dfn.hp-r.dmg);
    Audio.se(r.crit?'crit':'hit');
    if(settings.shake) shake=10;
    var px = side==='p'? 720:240, py = side==='p'? 170:380;
    popPopup(px,py,'-'+r.dmg, r.eff>1?'#ffd86b':(r.eff<1?'#9aa4c4':'#fff'));
    var line=Mon.name(att)+' の '+mv.name+'！';
    if(r.crit) line+=' きゅうしょに あたった！';
    if(r.eff>1) line+=' こうかは ばつぐんだ！';
    else if(r.eff<1) line+=' こうかは いまひとつ…';
    pushMsg(line);
    if(mv.kind==='drain'){ var heal=Math.floor(r.dmg*0.5); att.hp=Math.min(att.maxhp,att.hp+heal);
      pushMsg(Mon.name(att)+' は たいりょくを すいとった！'); }
  }
  function execStep(){
    if(B.execI>=B.turnQ.length){
      // ターン終了：倒れ判定
      if(fMon().hp<=0){ foeDefeated(); return; }
      if(pMon().hp<=0){ Audio.se('faint'); pushMsg(Mon.name(pMon())+' は たおれた！'); B.phase='msg'; B.afterMsg='defeat'; return; }
      B.phase='menu'; B.sel=0; return;
    }
    var o=B.turnQ[B.execI++];
    var moverMon = o[0]==='p'?pMon():fMon();
    if(moverMon.hp<=0){ execStep(); return; }
    doAction(o[0],o[1]);
    // メッセージ送り後に次stepへ
    B.phase='msg'; B.afterMsg='exec';
  }

  // 2Dグリッド移動：←→で列、↑↓で行（レイアウトに一致）
  function gridMove(idx,count,cols){
    if(count<=0) return 0;
    idx=Math.max(0,Math.min(count-1,idx));
    var rows=Math.ceil(count/cols), r=Math.floor(idx/cols), c=idx%cols, moved=false;
    if(edge.left){ c=(c-1+cols)%cols; moved=true; }
    else if(edge.right){ c=(c+1)%cols; moved=true; }
    if(edge.up){ r=(r-1+rows)%rows; moved=true; }
    else if(edge.down){ r=(r+1)%rows; moved=true; }
    var ni=r*cols+c;
    if(ni>=count) ni=count-1;
    if(moved && ni!==idx) Audio.se('ok');
    return ni;
  }
  function updateBattle(){
    if(!B){ scene=SC.FIELD; return; }
    // HPバー補間
    B.pHpShown += (pMon().hp - B.pHpShown)*0.25;
    B.fHpShown += (fMon().hp - B.fHpShown)*0.25;
    if(Math.abs(B.pHpShown-pMon().hp)<0.5) B.pHpShown=pMon().hp;
    if(Math.abs(B.fHpShown-fMon().hp)<0.5) B.fHpShown=fMon().hp;
    for(var i=B.popups.length-1;i>=0;i--){ B.popups[i].y-=0.7; if(--B.popups[i].life<=0) B.popups.splice(i,1); }

    if(B.phase==='intro'){
      if(B.msgQ.length){ if(edge.ok||edge.cancel){ Audio.se('ok'); B.msgQ.shift(); } }
      else { B.phase='menu'; B.sel=0; }
      return;
    }
    if(B.phase==='msg'){
      if(B.msgQ.length){
        if(edge.ok||edge.cancel){ var m=B.msgQ.shift(); Audio.se('ok'); if(m.cb)m.cb(); }
        return;
      }
      // メッセージ枯渇 → afterMsg遷移
      var a=B.afterMsg; B.afterMsg=null;
      if(a==='exec') execStep();
      else if(a==='menu'){ B.phase='menu'; B.sel=0; }
      else if(a==='victory') battleVictory();
      else if(a==='defeat') battleDefeatNext();
      else if(a==='end'){ endBattle(); }
      else if(a==='lose'){ /* blackout cb 済 */ }
      else if(a==='catchok'){ finishCatch(); }
      else { B.phase='menu'; B.sel=0; }
      return;
    }
    if(B.phase==='menu'){
      B.sel=gridMove(B.sel,5,3);
      if(edge.ok){
        Audio.se('ok');
        if(B.sel===0){ B.phase='move'; B.sub=0; }
        else if(B.sel===1){ B.phase='switch'; B.sub=0; }
        else if(B.sel===2){ B.phase='item'; B.sub=0; }
        else if(B.sel===3){ attemptCatch(); }
        else if(B.sel===4){ attemptRun(); }
      }
      return;
    }
    if(B.phase==='move'){
      var mv=pMon().moves;
      B.sub=gridMove(B.sub,mv.length,2);
      if(edge.cancel){ Audio.se('cancel'); B.phase='menu'; }
      if(edge.ok){ Audio.se('ok'); var chosen=mv[B.sub]; resolveTurn(chosen); }
      return;
    }
    if(B.phase==='switch'){
      var pr=state.party;
      B.sub=gridMove(B.sub,pr.length,3);
      if(edge.cancel){ Audio.se('cancel'); B.phase='menu'; }
      if(edge.ok){
        if(B.sub===B.pIdx){ toast('すでに せんとうちゅう'); }
        else if(pr[B.sub].hp<=0){ toast('そのエレモンは たたかえない'); }
        else { Audio.se('ok'); B.pIdx=B.sub; B.pHpShown=pMon().hp;
          pushMsg('いけ！ '+Mon.name(pMon())+'！');
          // 交代は1ターン消費 → 敵行動
          var fm=aiChoose(); B.turnQ=[['f',fm]]; B.phase='msg'; B.afterMsg='execAfterSwitch';
          B.execI=0; B.afterMsg='exec';
        }
      }
      return;
    }
    if(B.phase==='item'){
      var keys=Object.keys(state.bag).filter(function(k){ return state.bag[k]>0; });
      if(keys.length===0){ if(edge.ok||edge.cancel){ Audio.se('cancel'); B.phase='menu'; } B._itemKeys=[]; return; }
      B._itemKeys=keys;
      B.sub=gridMove(B.sub,keys.length,2);
      if(edge.cancel){ Audio.se('cancel'); B.phase='menu'; }
      if(edge.ok){
        var key=keys[B.sub], it=DB.ITEMS[key];
        Audio.se('ok');
        if(it.kind==='heal'){
          var t=pMon();
          if(t.hp>=t.maxhp){ toast('HPは まんたん'); return; }
          t.hp=Math.min(t.maxhp,t.hp+it.value); state.bag[key]--;
          Audio.se('heal'); pushMsg(it.name+' で '+Mon.name(t)+' を かいふくした！');
          var fm2=aiChoose(); B.turnQ=[['f',fm2]]; B.execI=0; B.phase='msg'; B.afterMsg='exec';
        } else if(it.kind==='ball'){
          if(!B.wild){ toast('トレーナーの エレモンは つかまえられない'); return; }
          state.bag[key]--; doCatch(it.mul);
        }
      }
      return;
    }
    if(B.phase==='exec'){ execStep(); return; }
    if(B.phase==='catch'){
      // シェイク演出
      B.catchShake++;
      if(B.catchShake>50){
        if(B.catchResult>=4){ Audio.se('catch'); finishCatch(); }
        else { pushMsg(Mon.name(fMon())+' は ボールから でてしまった！（'+B.catchResult+'回 ゆれた）');
          var fm3=aiChoose(); B.turnQ=[['f',fm3]]; B.execI=0; B.phase='msg'; B.afterMsg='exec'; }
      }
      return;
    }
  }
  function attemptCatch(){
    if(!B.wild){ toast('トレーナーの エレモンは つかまえられない'); B.phase='menu'; return; }
    var balls=['ball','sball','mball'].filter(function(k){return state.bag[k]>0;});
    if(balls.length===0){ pushMsg('ボールを もっていない！'); B.phase='msg'; B.afterMsg='menu'; return; }
    // どうぐ画面のボールへ誘導
    B.phase='item'; B.sub=0;
    toast('「どうぐ」から ボールを えらぼう');
  }
  function doCatch(mul){
    B.msgQ=[];
    B.catchResult=tryCatch(mul);
    B.catchShake=0; B.phase='catch';
    Audio.se('ok');
  }
  function finishCatch(){
    var f=fMon();
    var caught=Mon.create(f.sid,f.lv); caught.hp=f.hp; caught.exp=f.exp; caught.moves=f.moves.slice();
    var firstTime=!state.dex[f.sid];
    state.dex[f.sid]=true; state.stats.caught=(state.stats.caught||0)+1;
    if(state.party.length<6) state.party.push(caught); else state.box.push(caught);
    pushMsg(Mon.name(f)+' を つかまえた！'+(firstTime?' 図鑑に とうろくした！':''));
    if(state.party.length>=7 || state.box.length>0) pushMsg('（控えボックスに あずけた）');
    B.phase='msg'; B.afterMsg='end';
    Save.save(state);
  }
  function attemptRun(){
    if(!B.wild){ toast('トレーナー戦からは にげられない'); B.phase='menu'; return; }
    B.runTries++;
    var p=pMon(), f=fMon();
    var chance = p.spd>=f.spd ? 1 : 0.5 + 0.15*B.runTries;
    if(Math.random()<chance){ pushMsg('うまく にげきれた！',function(){ endBattle(); }); B.phase='msg'; B.afterMsg='wait'; }
    else { pushMsg('にげられなかった！');
      var fm=aiChoose(); B.turnQ=[['f',fm]]; B.execI=0; B.phase='msg'; B.afterMsg='exec'; }
  }

  function wrapL(t,x,y,maxw,lh){

  var menu={page:'root',sel:0,sub:0};
  function menuInit(){ menu.page='root'; menu.sel=0; menu.sub=0; }
  function updateMenu(){
    if(menu.page==='root'){
      var items=['パーティ','どうぐ','ずかん','せってい','セーブ','とじる'];
      if(edge.down){menu.sel=(menu.sel+1)%items.length;Audio.se('ok');}
      if(edge.up){menu.sel=(menu.sel+items.length-1)%items.length;Audio.se('ok');}
      if(edge.cancel||edge.menu){ Audio.se('cancel'); scene=SC.FIELD; return; }
      if(edge.ok){ Audio.se('ok');
        if(menu.sel===0){menu.page='party';menu.sub=0;}
        else if(menu.sel===1){menu.page='bag';menu.sub=0;}
        else if(menu.sel===2){menu.page='dex';menu.sub=0;}
        else if(menu.sel===3){menu.page='set';menu.sub=0;}
        else if(menu.sel===4){ if(Save.save(state)) toast('セーブしました'); else toast('セーブ失敗'); }
        else { scene=SC.FIELD; }
      }
      return;
    }
    if(edge.cancel){ Audio.se('cancel'); menu.page='root'; return; }
    if(menu.page==='party'){
      var n=state.party.length;
      if(edge.down){menu.sub=(menu.sub+1)%n;Audio.se('ok');}
      if(edge.up){menu.sub=(menu.sub+n-1)%n;Audio.se('ok');}
      if(edge.ok && n>1){ // 先頭と入替
        Audio.se('ok'); var t=state.party[0]; state.party[0]=state.party[menu.sub]; state.party[menu.sub]=t; menu.sub=0;
        toast('せんとうを いれかえた');
      }
    } else if(menu.page==='set'){
      var opts=['BGM','SE','テキスト速度','画面振動','色覚補助','フィールドパネル','チュートリアル再表示'];
      if(edge.down){menu.sub=(menu.sub+1)%opts.length;Audio.se('ok');}
      if(edge.up){menu.sub=(menu.sub+opts.length-1)%opts.length;Audio.se('ok');}
      if(edge.left||edge.right){
        var d=edge.right?1:-1;
        if(menu.sub===0){ settings.bgm=clamp01(settings.bgm+d*0.1); }
        else if(menu.sub===1){ settings.se=clamp01(settings.se+d*0.1); }
        else if(menu.sub===2){ settings.textSpeed=Math.max(1,Math.min(3,settings.textSpeed+d)); }
        else if(menu.sub===3){ settings.shake=!settings.shake; }
        else if(menu.sub===4){ settings.colorAssist=!settings.colorAssist; }
        else if(menu.sub===5){ settings.hudPanel=!settings.hudPanel; }
        Audio.setVol(settings.bgm,settings.se); Audio.shake=settings.shake;
        Audio.settings.shake=settings.shake; Save.saveSettings(settings);
      }
      if(edge.ok && menu.sub===5){ settings.hudPanel=!settings.hudPanel; Audio.se('ok'); Save.saveSettings(settings); }
      if(edge.ok && menu.sub===6){ Audio.se('ok'); scene=SC.FIELD; openTutorial(null); }
    } else if(menu.page==='dex'){
      // スクロール
      var ids=Object.keys(DB.SPECIES);
      if(edge.down){menu.sub=Math.min(ids.length-1,menu.sub+1);Audio.se('ok');}
      if(edge.up){menu.sub=Math.max(0,menu.sub-1);Audio.se('ok');}
    }
  }
  function clamp01(v){ return Math.max(0,Math.min(1,Math.round(v*10)/10)); }

        g.fillRect(150,130+i*64,300,52); g.strokeStyle='#5a6488'; g.strokeRect(150,130+i*64,300,52);
        g.fillStyle='#fff'; g.font='19px Segoe UI'; g.fillText(items[i],170,162+i*64);
        (function(idx){ zone(150,130+idx*64,300,52,function(){ menu.sel=idx; edge.ok=true; }); })(i);
      }
      g.fillStyle='#aab4d4'; g.font='14px Segoe UI';
      g.fillText('所持金: '+state.player.gem+' ジェム',500,150);
      g.fillText('バッジ: '+state.player.badges+'/4',500,176);
      g.fillText('図鑑: '+Object.keys(state.dex).length+'/18',500,202);
      g.fillText('捕獲数: '+(state.stats.caught||0),500,228);
      g.fillText('プレイ時間: '+fmtTime(state.stats.playTime||0),500,254);
    } else if(menu.page==='party'){
      g.fillStyle='#7fc8ff'; g.font='bold 22px Segoe UI'; g.fillText('パーティ（Zで先頭と入替 / X戻る）',150,100);
      for(var p=0;p<state.party.length;p++){ var m=state.party[p];
        var y=130+p*70;
        g.fillStyle=p===menu.sub?'#26304a':'rgba(24,30,46,.9)';
        g.fillRect(150,y,640,60); g.strokeStyle=p===menu.sub?'#7fc8ff':'#444c66'; g.strokeRect(150,y,640,60);
        drawCreature(185,y+30,Mon.type(m),20,0,false);
        g.fillStyle='#fff'; g.font='17px Segoe UI'; g.fillText(Mon.name(m),225,y+24);
        g.fillStyle=DB.TYPECOL[Mon.type(m)]; g.font='13px Segoe UI';
        g.fillText(DB.TYPEJP[Mon.type(m)]+(settings.colorAssist?DB.TYPESYM[Mon.type(m)]:''),225,y+44);
        (function(idx){ zone(150,y,640,60,function(){ menu.sub=idx; edge.ok=true; }); })(p);
        g.fillStyle='#cdd6ee'; g.font='14px Segoe UI';
        g.fillText('Lv'+m.lv,420,y+24);
        drawHpBar(420,y+34,200,m.hp,m.maxhp);
        g.fillStyle='#9aa4c4'; g.font='12px Segoe UI'; g.fillText('HP '+m.hp+'/'+m.maxhp,640,y+44);
        if(p===0){ g.fillStyle='#ffd86b'; g.font='12px Segoe UI'; g.fillText('先頭',760,y+24); }
      }
    } else if(menu.page==='bag'){
      g.fillStyle='#7fc8ff'; g.font='bold 22px Segoe UI'; g.fillText('どうぐ（X戻る）',150,100);
      var ks=Object.keys(state.bag), yy=140;
      var any=false;
      for(var k=0;k<ks.length;k++){ if(state.bag[ks[k]]<=0) continue; any=true;
        g.fillStyle='rgba(24,30,46,.9)'; g.fillRect(150,yy,640,40); g.strokeStyle='#444c66'; g.strokeRect(150,yy,640,40);
        g.fillStyle='#fff'; g.font='16px Segoe UI'; g.fillText(DB.ITEMS[ks[k]].name,170,yy+26);
        g.fillStyle='#ffd86b'; g.fillText('×'+state.bag[ks[k]],720,yy+26); yy+=48; }
      if(!any){ g.fillStyle='#9aa4c4'; g.font='15px Segoe UI'; g.fillText('なにも もっていない',170,150); }
    } else if(menu.page==='dex'){
      g.fillStyle='#7fc8ff'; g.font='bold 22px Segoe UI'; g.fillText('ずかん '+Object.keys(state.dex).length+'/18（↑↓ X戻る）',150,100);
      var ids=Object.keys(DB.SPECIES);
      var top=Math.max(0,Math.min(ids.length-9,menu.sub-4));
      for(var d=0;d<9 && top+d<ids.length;d++){ var sid=ids[top+d], sp=DB.SPECIES[sid], got=state.dex[sid];
        var yy2=128+d*48;
        g.fillStyle=(top+d===menu.sub)?'#26304a':'rgba(24,30,46,.9)';
        g.fillRect(150,yy2,640,42); g.strokeStyle='#444c66'; g.strokeRect(150,yy2,640,42);
        if(got){ drawCreature(178,yy2+21,sp.type,15,0,false);
          g.fillStyle='#fff'; g.font='16px Segoe UI'; g.fillText(sp.name,210,yy2+27);
          g.fillStyle=DB.TYPECOL[sp.type]; g.font='13px Segoe UI';
          g.fillText(DB.TYPEJP[sp.type]+(settings.colorAssist?DB.TYPESYM[sp.type]:''),650,yy2+27);
        } else { g.fillStyle='#555c70'; g.font='16px Segoe UI'; g.fillText('??? （未発見）',210,yy2+27); }
      }
    } else if(menu.page==='set'){
      g.fillStyle='#7fc8ff'; g.font='bold 22px Segoe UI'; g.fillText('せってい（←→で変更 / X戻る）',150,100);
      var opts=[['BGM',Math.round(settings.bgm*10)],['SE',Math.round(settings.se*10)],
        ['テキスト速度',settings.textSpeed],['画面振動',settings.shake?'ON':'OFF'],
        ['色覚補助',settings.colorAssist?'ON':'OFF'],['フィールドパネル',settings.hudPanel?'ON':'OFF'],
        ['チュートリアル再表示','▶ Z']];
      for(var o=0;o<opts.length;o++){ var y3=128+o*52;
        g.fillStyle=o===menu.sub?'#3a64ff':'rgba(30,36,52,.9)';
        g.fillRect(150,y3,640,42); g.strokeStyle='#5a6488'; g.strokeRect(150,y3,640,42);
        g.fillStyle='#fff'; g.font='17px Segoe UI'; g.fillText(opts[o][0],170,y3+27);
        g.fillStyle='#ffd86b'; g.fillText(''+opts[o][1],680,y3+27);
        (function(idx){ zone(150,y3,640,42,function(){ menu.sub=idx; if(idx===6)edge.ok=true; else edge.right=true; }); })(o);
      }
    }
  }
  function fmtTime(s){ s=Math.floor(s); var m=Math.floor(s/60); return m+'分'+(s%60)+'秒'; }

  /* ===================== END (§10) ===================== */
  var endT=0;
  function endingTrigger(){ /* battleVictory 内で呼ばれ、end へ */
    B.afterMsg='ending';
  }
  function drawEnd(){
    g.fillStyle='#080a12'; g.fillRect(0,0,960,640);
    for(var i=0;i<60;i++){ g.fillStyle='rgba(180,200,255,'+(0.1+(i%7)*0.05)+')';
      g.fillRect((i*131+endT)%960,(i*73)%640,2,2); }
    g.textAlign='center';
    g.fillStyle='#ffd86b'; g.font='bold 48px Segoe UI'; g.fillText('― ENDING ―',480,200);
    g.fillStyle='#fff'; g.font='20px Segoe UI';
    g.fillText('監督者ヴァロンを止め、世界に平和が戻った。',480,280);
    g.fillText('あなたとエレモンの旅は、まだ続く――',480,316);
    g.fillStyle='#9fe0ff'; g.font='17px Segoe UI';
    g.fillText('クリアタイム: '+fmtTime(state.stats.playTime||0),480,390);
    g.fillText('図鑑登録: '+Object.keys(state.dex).length+'/18   捕獲数: '+(state.stats.caught||0),480,420);
    g.fillStyle='#7f88a8'; g.font='14px Segoe UI';
    g.fillText('Z／クリック: タイトルへ（セーブから周回継続できます）',480,540);
    g.textAlign='left';
    zone(0,0,960,640,function(){ edge.ok=true; });
  }
  function updateEnd(){ endT+=0.5;
    if(edge.ok){ Audio.se('ok'); Save.save(state);
      transition(function(){ scene=SC.TITLE; titleStage='menu'; titleSel=0; Audio.stopBgm(); }); } }

  /* ===================== 共通：クリーチャー描画 (§12) ===================== */
  function drawCreature(cx,cy,type,r,t,back){
    var col=DB.TYPECOL[type]||'#9aa0a8';
    var bob=Math.sin(t)*r*0.06;
    cy+=bob;
    // 影
    g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(cx,cy+r*0.95,r*0.8,r*0.25,0,0,7); g.fill();
    // ボディ
    g.fillStyle=col; g.beginPath(); g.arc(cx,cy,r,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,.18)'; g.beginPath(); g.arc(cx-r*0.3,cy-r*0.3,r*0.45,0,7); g.fill();
    g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2; g.beginPath(); g.arc(cx,cy,r,0,7); g.stroke(); g.lineWidth=1;
    // 属性ごとの装飾
    g.fillStyle='rgba(0,0,0,.45)';
    if(type==='grass'){ g.beginPath(); g.moveTo(cx,cy-r); g.lineTo(cx-r*0.4,cy-r*1.5); g.lineTo(cx+r*0.2,cy-r*1.1); g.fill(); }
    else if(type==='fire'){ for(var f=0;f<3;f++){ g.beginPath(); g.moveTo(cx-r*0.4+f*r*0.4,cy-r*0.8);
      g.lineTo(cx-r*0.2+f*r*0.4,cy-r*1.5); g.lineTo(cx+f*r*0.4,cy-r*0.8); g.fill(); } }
    else if(type==='water'){ g.beginPath(); g.arc(cx,cy-r*1.1,r*0.25,0,7); g.fill(); }
    else if(type==='elec'){ g.beginPath(); g.moveTo(cx-r*0.2,cy-r); g.lineTo(cx+r*0.1,cy-r*0.3);
      g.lineTo(cx-r*0.1,cy-r*0.3); g.lineTo(cx+r*0.3,cy-r*1.6); g.fill(); }
    else if(type==='earth'){ g.fillRect(cx-r*0.5,cy-r*1.3,r,r*0.4); }
    if(!back){
      // 目
      g.fillStyle='#fff'; g.beginPath(); g.arc(cx-r*0.35,cy-r*0.1,r*0.22,0,7); g.arc(cx+r*0.35,cy-r*0.1,r*0.22,0,7); g.fill();
      g.fillStyle='#111'; g.beginPath(); g.arc(cx-r*0.32,cy-r*0.05,r*0.1,0,7); g.arc(cx+r*0.38,cy-r*0.05,r*0.1,0,7); g.fill();
      // 口
      g.strokeStyle='#111'; g.lineWidth=2; g.beginPath(); g.arc(cx,cy+r*0.25,r*0.3,0.15*Math.PI,0.85*Math.PI); g.stroke(); g.lineWidth=1;
    } else {
      g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.arc(cx,cy+r*0.2,r*0.5,0,7); g.fill();
    }
  }

  /* ===================== トースト描画 ===================== */
  function drawToasts(dt){
    for(var i=toasts.length-1;i>=0;i--){
      var ts=toasts[i]; ts.t-=dt;
      var idx=toasts.length-1-i;
      var a=Math.min(1,ts.t/400);
      g.globalAlpha=Math.max(0,a);
      g.fillStyle='rgba(20,26,40,.95)';
      var w=g.measureText(ts.msg).width+40;
      g.fillRect(940-w-16,16+idx*44,w,34);
      g.strokeStyle='#5a8cff'; g.strokeRect(940-w-16,16+idx*44,w,34);
      g.fillStyle='#cfe0ff'; g.font='14px Segoe UI'; g.textAlign='left';
      g.fillText(ts.msg,940-w,38+idx*44);
      g.globalAlpha=1;
      if(ts.t<=0) toasts.splice(i,1);
    }
  }

  /* ===================== メインループ (§16) ===================== */
  var last=0, acc=0, STEP=1000/60;
  function frame(now){
    try{
      if(!last) last=now;
      var dt=now-last; last=now;
      if(dt>200) dt=200; // タブ復帰時の暴走防止
      acc+=dt;
      var steps=0;
      while(acc>=STEP && steps<5){ tick(STEP); acc-=STEP; steps++; }
      render(dt);
      // エッジ入力リセット
      for(var k in edge) edge[k]=false;
    }catch(e){
      console.error(e);
      // 致命でなければ FIELD へ復帰を試みる
      try{ if(state){ scene=SC.FIELD; B=null; } }catch(_){}
    }
    requestAnimationFrame(frame);
  }
  function tick(dt){
    if(tut.on){ updateTutorial(); return; }
    if(fadeDir!==0){
      fade += fadeDir* (dt/250);
      if(fadeDir>0 && fade>=1){ fade=1; if(fadeCb){ var c=fadeCb; fadeCb=null; c(); } fadeDir=-1; }
      else if(fadeDir<0 && fade<=0){ fade=0; fadeDir=0; }
      return; // 遷移中は入力ロック（連打多重防止 §17）
    }
    if(scene===SC.TITLE) updateTitle();
    else if(scene===SC.FIELD) updateField(dt);
    else if(scene===SC.BATTLE) updateBattle();
    else if(scene===SC.MENU) updateMenu();
    else if(scene===SC.SHOP) updateShop();
    else if(scene===SC.END) updateEnd();
    if(shake>0) shake-=1;
    if(state&&state.stats) state.stats.playTime=(Date.now()-(state.stats.start||Date.now()))/1000;
  }
  function render(dt){
    zones.length=0; // クリックゾーンを毎フレーム再構築
    g.save();
    if(shake>0 && (Audio.settings.shake)){
      g.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
    }
    if(scene===SC.TITLE) drawTitle();
    else if(scene===SC.FIELD) drawField();
    else if(scene===SC.BATTLE){ if(B) drawBattle(); else drawField(); }
    else if(scene===SC.MENU) drawMenu();
    else if(scene===SC.SHOP) drawShop();
    else if(scene===SC.END) drawEnd();
    g.restore();
    if(tut.on) drawTutorial();
    drawToasts(dt);
    if(fade>0){ g.fillStyle='rgba(0,0,0,'+fade+')'; g.fillRect(0,0,960,640); }
  }

  // afterMsg='ending' のフック
  var _origUpdateBattle=updateBattle;

  /* ---------- 起動 ---------- */
  function boot(){
    try{
      settings=Save.loadSettings();
      Audio.setVol(settings.bgm,settings.se);
      Audio.settings.shake=settings.shake;
      resize();
      document.getElementById('ld').style.display='none';
      scene=SC.TITLE;
      requestAnimationFrame(frame);
    }catch(e){ fatal(e&&e.message||String(e)); }
  }

  // battleVictory の ending 連結（afterMsg 'ending' 対応）
  var realBattleVictory=battleVictory;
  // updateBattle 内 afterMsg ハンドラに 'ending' を足す
  (function patchEnding(){
    var orig=updateBattle;
    updateBattle=function(){
      if(B && B.phase==='msg' && B.msgQ.length===0 && B.afterMsg==='ending'){
        B.afterMsg=null; B=null;
        Save.save(state);
        transition(function(){ scene=SC.END; Audio.playBgm('win'); });
        return;
      }
      orig();
    };
  })();

  return {boot};
})();

/* ---------- 起動トリガ ---------- */
try{
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',Game.boot);
  else Game.boot();
}catch(e){ fatal(e&&e.message||String(e)); }

})();
</script>
