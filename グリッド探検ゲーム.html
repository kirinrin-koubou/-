<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200×200 グリッド探検ゲーム</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #1a1d29; color: #eee;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 10px 16px;
    background: linear-gradient(135deg, #5b6ee1, #7a4fd4);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    font-size: 14px; font-weight: bold;
  }
  header .pill {
    background: rgba(255,255,255,.18);
    padding: 5px 11px; border-radius: 999px;
  }
  header .hint { margin-left: auto; font-weight: normal; opacity: .9; font-size: 13px; }
  #stage {
    flex: 1; position: relative; overflow: hidden;
    background: #0f1118;
  }
  #grid {
    position: absolute; top: 0; left: 0;
    background:
      repeating-linear-gradient(0deg,  #232838 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, #232838 0 1px, transparent 1px 24px),
      #161a26;
  }
  .cell { position: absolute; width: 24px; height: 24px; }
  #player {
    position: absolute; width: 24px; height: 24px;
    background: #ffce4f; border-radius: 6px;
    box-shadow: 0 0 14px #ffce4f, inset 0 0 0 2px #b88a14;
    transition: left .08s linear, top .08s linear;
    z-index: 5;
  }
  .gem {
    background: radial-gradient(circle at 35% 30%, #8ff, #2bb 70%);
    border-radius: 50%;
    box-shadow: 0 0 8px #4dd;
  }
  .wall { background: #3a4060; box-shadow: inset 0 0 0 1px #525a82; }
  #mini {
    position: absolute; right: 12px; bottom: 12px;
    border: 2px solid #5b6ee1; border-radius: 6px;
    background: #0c0e15; image-rendering: pixelated;
  }
  #msg {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(0,0,0,.65); padding: 6px 16px; border-radius: 999px;
    font-size: 13px; pointer-events: none; opacity: 0;
    transition: opacity .3s;
  }
  #msg.show { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="pill">📍 位置: <span id="pos">0, 0</span></span>
    <span class="pill">💎 ジェム: <span id="score">0</span> / <span id="total">0</span></span>
    <span class="hint">矢印キー / WASD で移動・スクロール（200×200マス）</span>
  </header>
  <div id="stage">
    <div id="grid"></div>
    <div id="player"></div>
    <canvas id="mini" width="160" height="160"></canvas>
    <div id="msg"></div>
  </div>
</div>
<script>
const SIZE = 200;          // 200 x 200 マス
const CELL = 24;           // 1マスの描画ピクセル
const stage  = document.getElementById('stage');
const grid   = document.getElementById('grid');
const player = document.getElementById('player');
const mini   = document.getElementById('mini');
const mctx   = mini.getContext('2d');

grid.style.width  = SIZE * CELL + 'px';
grid.style.height = SIZE * CELL + 'px';

// プレイヤー座標（マス単位）
let px = 100, py = 100;

// 壁とジェムを乱数生成（プレイヤー初期位置は安全に）
const walls = new Set();
const gems  = new Set();
function key(x, y){ return x + ',' + y; }

let seed = 1234567;
function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

for (let i = 0; i < SIZE * SIZE * 0.10; i++) {
  const x = (rnd() * SIZE) | 0, y = (rnd() * SIZE) | 0;
  if (x === px && y === py) continue;
  walls.add(key(x, y));
}
let gemCount = 0;
for (let i = 0; i < 120; i++) {
  const x = (rnd() * SIZE) | 0, y = (rnd() * SIZE) | 0;
  const k = key(x, y);
  if (walls.has(k) || gems.has(k) || (x === px && y === py)) continue;
  gems.add(k); gemCount++;
}
document.getElementById('total').textContent = gemCount;

// 表示中のセル要素をプール管理
const pool = [];
function makeCell(){
  const d = document.createElement('div');
  d.className = 'cell';
  grid.appendChild(d);
  return d;
}

let score = 0;
const posEl = document.getElementById('pos');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');
let msgTimer;
function flash(t){
  msgEl.textContent = t; msgEl.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => msgEl.classList.remove('show'), 1200);
}

function render(){
  const vw = stage.clientWidth, vh = stage.clientHeight;
  // プレイヤーを中央に置くようグリッドをスクロール
  let ox = vw / 2 - (px + .5) * CELL;
  let oy = vh / 2 - (py + .5) * CELL;
  ox = Math.min(0, Math.max(vw - SIZE * CELL, ox));
  oy = Math.min(0, Math.max(vh - SIZE * CELL, oy));
  grid.style.transform = `translate(${ox}px, ${oy}px)`;
  player.style.left = (px * CELL + ox) + 'px';
  player.style.top  = (py * CELL + oy) + 'px';

  // 見える範囲のセルだけ描画
  const x0 = Math.max(0, Math.floor(-ox / CELL) - 1);
  const y0 = Math.max(0, Math.floor(-oy / CELL) - 1);
  const x1 = Math.min(SIZE - 1, x0 + Math.ceil(vw / CELL) + 2);
  const y1 = Math.min(SIZE - 1, y0 + Math.ceil(vh / CELL) + 2);
  let n = 0;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const k = key(x, y);
      let cls = null;
      if (walls.has(k)) cls = 'cell wall';
      else if (gems.has(k)) cls = 'cell gem';
      if (!cls) continue;
      const el = pool[n] || (pool[n] = makeCell());
      el.className = cls;
      el.style.left = x * CELL + 'px';
      el.style.top  = y * CELL + 'px';
      el.style.display = 'block';
      n++;
    }
  }
  for (let i = n; i < pool.length; i++) pool[i].style.display = 'none';

  posEl.textContent = px + ', ' + py;
  drawMini();
}

function drawMini(){
  mctx.fillStyle = '#0c0e15';
  mctx.fillRect(0, 0, 160, 160);
  const s = 160 / SIZE;
  mctx.fillStyle = '#4dd';
  gems.forEach(k => {
    const [x, y] = k.split(',').map(Number);
    mctx.fillRect(x * s, y * s, Math.max(1, s), Math.max(1, s));
  });
  mctx.fillStyle = '#ffce4f';
  mctx.fillRect(px * s - 1, py * s - 1, 3, 3);
}

function move(dx, dy){
  const nx = px + dx, ny = py + dy;
  if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE) return;
  if (walls.has(key(nx, ny))) { flash('🚧 壁がある！'); return; }
  px = nx; py = ny;
  const k = key(px, py);
  if (gems.has(k)) {
    gems.delete(k); score++; scoreEl.textContent = score;
    flash('💎 ジェム獲得！ (' + score + ')');
    if (score === gemCount) flash('🎉 全ジェム制覇！おめでとう！');
  }
  render();
}

window.addEventListener('keydown', e => {
  const m = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
  }[e.key];
  if (m) { e.preventDefault(); move(m[0], m[1]); }
});

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
