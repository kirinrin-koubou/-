<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200×200 古代村跡 探検マップ</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #1a1d29; color: #eee;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 10px 16px;
    background: linear-gradient(135deg, #5b6ee1, #7a4fd4);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    font-size: 14px; font-weight: bold;
  }
  header .pill { background: rgba(255,255,255,.18); padding: 5px 11px; border-radius: 999px; }
  header .hint { margin-left: auto; font-weight: normal; opacity: .9; font-size: 13px; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #0f1118; }
  #grid { position: absolute; top: 0; left: 0; will-change: transform; }
  .cell {
    position: absolute; width: 24px; height: 24px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .t0 { background: #79a85c; }                                   /* 草（薄め） */
  .t1 { background: #8a6a45; }                                   /* 土 */
  .t2 { background: repeating-linear-gradient(0deg,#6b4a26 0 4px,#553a1d 4px 8px); } /* 畑（濃い茶） */
  .t3 {                                                          /* 水：砂利の上に半透明の青 */
    background:
      linear-gradient(rgba(38,58,148,.4), rgba(38,58,148,.4)),
      radial-gradient(circle 5px   at 18% 28%, #636363 98%, transparent),
      radial-gradient(circle 5.5px at 80% 66%, #636363 98%, transparent),
      radial-gradient(circle 4px   at 33% 74%, #636363 98%, transparent),
      #969696;
  }
  .t4 { background: #d9c879; }                                   /* 砂浜 */
  .t5 {                                                           /* タイル：赤茶の市松模様 */
    background-color: #7a3b2e;
    background-image:
      linear-gradient(45deg,#9c4a36 25%,transparent 25%,transparent 75%,#9c4a36 75%),
      linear-gradient(45deg,#9c4a36 25%,transparent 25%,transparent 75%,#9c4a36 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
  }
  .t7 { background: #1d2c52; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); } /* 海（島の外） */
  .t6 {                                                           /* 砂利：薄灰色＋不規則な灰色の丸 */
    background-color: #969696;
    background-image:
      radial-gradient(circle 5px   at 18% 28%, #636363 98%, transparent),
      radial-gradient(circle 4px   at 62% 20%, #636363 98%, transparent),
      radial-gradient(circle 5.5px at 80% 66%, #636363 98%, transparent),
      radial-gradient(circle 4px   at 33% 74%, #636363 98%, transparent),
      radial-gradient(circle 3.5px at 52% 48%, #636363 98%, transparent);
    background-repeat: no-repeat;
  }
  #mini { position: absolute; right: 12px; bottom: 12px; border: 2px solid #5b6ee1; border-radius: 6px; background: #0c0e15; image-rendering: pixelated; }
  #legend {
    position: absolute; left: 12px; bottom: 12px;
    background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px;
    font-size: 12px; display: grid; grid-template-columns: auto auto; gap: 3px 12px;
  }
  #legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="pill">📍 中心マス: <span id="pos">100, 100</span></span>
    <span class="hint">矢印キー / WASD で画面を滑らかにスクロール（200×200マス）</span>
  </header>
  <div id="stage">
    <div id="grid"></div>
    <div id="legend">
      <span><i style="background:#79a85c"></i>草</span><span><i style="background:#8a6a45"></i>土</span>
      <span><i style="background:#5d3f20"></i>畑</span><span><i style="background:#8c94b8"></i>水</span>
      <span><i style="background:#d9c879"></i>砂浜</span><span><i style="background:#8c4a36"></i>タイル(村跡)</span>
      <span><i style="background:#8c8c8c"></i>砂利</span>
      <span><i style="background:#1d2c52"></i>海</span>
    </div>
    <canvas id="mini" width="160" height="160"></canvas>
  </div>
</div>
<script>
const SIZE = 200, CELL = 24, MAP_PX = SIZE * CELL;
const stage = document.getElementById('stage');
const grid  = document.getElementById('grid');
const mini  = document.getElementById('mini');
const mctx  = mini.getContext('2d');
const posEl = document.getElementById('pos');
grid.style.width = MAP_PX + 'px';
grid.style.height = MAP_PX + 'px';

// ---- 地形生成 -----------------------------------------------------------
const T_GRASS=0, T_DIRT=1, T_FIELD=2, T_WATER=3, T_SAND=4, T_TILE=5, T_GRAVEL=6, T_OCEAN=7;
const map = new Uint8Array(SIZE * SIZE);          // 既定=草(0)
const idx = (x,y) => y * SIZE + x;
const inb = (x,y) => x>=0 && y>=0 && x<SIZE && y<SIZE;

let seed = 20260516;
function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ランダムウォークで丸い塊を塗る（湖・土の侵食地に使用）
function blob(cx, cy, count, type, overOK){
  const frontier = [[cx,cy]];
  let placed = 0;
  while (frontier.length && placed < count) {
    const i = (rnd()*frontier.length)|0;
    const [x,y] = frontier.splice(i,1)[0];
    if (!inb(x,y)) continue;
    const cur = map[idx(x,y)];
    if (overOK && !overOK(cur)) continue;
    if (cur === type) continue;
    map[idx(x,y)] = type; placed++;
    frontier.push([x+1,y],[x-1,y],[x,y+1],[x,y-1],
                   [x+1,y+1],[x-1,y-1],[x+1,y-1],[x-1,y+1]);
  }
  return placed;
}

// 1) 自然な土の侵食地をあちこちに
for (let i=0;i<28;i++) blob((rnd()*SIZE)|0,(rnd()*SIZE)|0, 18+(rnd()*40|0), T_DIRT, c=>c===T_GRASS);

// 2) 太古の村（中央付近）：石タイルの区画と道、周囲に畑
const vx0=78, vy0=78, vw=46, vh=44;
for (let y=0;y<vh;y++){
  for (let x=0;x<vw;x++){
    const gx=vx0+x, gy=vy0+y;
    if (!inb(gx,gy)) continue;
    const onRoad = (x%9===0) || (y%9===0);
    if (onRoad){ map[idx(gx,gy)] = T_DIRT; }                 // 風化した道
    else {
      const bx=x%9, by=y%9;
      // 各区画の内側に石床（建物跡）
      if (bx>=2 && bx<=7 && by>=2 && by<=7) map[idx(gx,gy)] = T_TILE;
      else map[idx(gx,gy)] = T_GRASS;
    }
  }
}
// 村の南東に畑（一部は雑草に戻っている）
for (let y=0;y<22;y++){
  for (let x=0;x<30;x++){
    const gx=vx0+vw-2+x, gy=vy0+10+y;
    if (!inb(gx,gy)) continue;
    if (rnd()<0.78) map[idx(gx,gy)] = T_FIELD;
  }
}

// 3) 自然侵食パス：村跡をまだら状に草・土へ戻す
for (let y=-6;y<vh+10;y++){
  for (let x=-6;x<vw+34;x++){
    const gx=vx0+x, gy=vy0+y;
    if (!inb(gx,gy)) continue;
    const t = map[idx(gx,gy)];
    if (t===T_TILE || t===T_FIELD){
      const r = rnd();
      if (r<0.42) map[idx(gx,gy)] = T_GRASS;
      else if (r<0.52) map[idx(gx,gy)] = T_DIRT;
    }
  }
}

// 4) 湖を3つ（それぞれ水およそ20マス）
const lakeCenters = [[40,150],[160,55],[55,45]];
for (const [lx,ly] of lakeCenters) blob(lx,ly, 20+(rnd()*4|0), T_WATER, ()=>true);

// 5) 川：中心の右上の合流点から3本に分かれ、指定の3河口へ
function carveDisk(cx,cy,r){
  for (let y=-r;y<=r;y++) for (let x=-r;x<=r;x++)
    if (x*x+y*y<=r*r && inb(cx+x,cy+y)) map[idx(cx+x,cy+y)] = T_WATER;
}
const CONFLUENCE = [120, 82];                 // 中心(100,100)の右上側
const MOUTHS = [
  [SIZE-1, 100],   // 右真ん中（東の縁）
  [0, 152],        // 左下（西の縁の下寄り）
  [88, 0]          // 上・真ん中より左寄り（北の縁）
];
function river(C, M, phase){
  const dist = Math.hypot(M[0]-C[0], M[1]-C[1]);
  const steps = Math.ceil(dist*1.5);
  const nx = -(M[1]-C[1])/dist, ny = (M[0]-C[0])/dist;   // 進行方向の垂直単位ベクトル
  for (let i=0;i<=steps;i++){
    const t = i/steps;
    const bx = C[0] + (M[0]-C[0])*t;
    const by = C[1] + (M[1]-C[1])*t;
    const mead = Math.sin(t*Math.PI*3 + phase) * 4 * Math.sin(t*Math.PI); // 蛇行
    const x = Math.round(bx + nx*mead);
    const y = Math.round(by + ny*mead);
    const r = 2 + Math.round(t*t*2);          // 平均6マス前後（河口に向かい拡幅）
    carveDisk(x,y,r);
  }
}
MOUTHS.forEach((m,i)=> river(CONFLUENCE, m, i*2.1));
carveDisk(CONFLUENCE[0], CONFLUENCE[1], 2);   // 合流点

// 6) 川や水辺の周りは決まりなし。ただし砂利がやや多めに出るようにする
const snap = map.slice();
for (let y=0;y<SIZE;y++){
  for (let x=0;x<SIZE;x++){
    if (snap[idx(x,y)]===T_WATER) continue;
    let near=0;
    for (let j=-1;j<=1;j++) for (let i=-1;i<=1;i++){
      if (inb(x+i,y+j) && snap[idx(x+i,y+j)]===T_WATER) near++;
    }
    if (near>0 && rnd() < (near>=3 ? 0.55 : 0.35)) map[idx(x,y)] = T_GRAVEL;
  }
}
// 7) 乾いた砂利の堆積をあちこちに（新ブロック）
for (let i=0;i<14;i++) blob((rnd()*SIZE)|0,(rnd()*SIZE)|0, 8+(rnd()*16|0), T_GRAVEL, c=>c===T_GRASS||c===T_DIRT);

// 8) マップ外形を「ギザギザした丸い島」にする（外側は海）。200×200内に収める
const cx=100, cy=100, ANG=720;
const edgeR=new Float32Array(ANG);
for (let a=0;a<ANG;a++){
  const th=a/ANG*Math.PI*2;
  let r = 90
        + 4*Math.sin(th*3+1.1)
        + 2.5*Math.sin(th*5+2.3)
        + 1.5*Math.sin(th*8+0.7)
        + (rnd()-0.5)*4;           // 控えめなギザギザ
  edgeR[a] = Math.max(60, Math.min(97, r));
}
for (let y=0;y<SIZE;y++){
  for (let x=0;x<SIZE;x++){
    const dx=x-cx, dy=y-cy;
    const dist=Math.hypot(dx,dy);
    let ai=((Math.atan2(dy,dx)/(Math.PI*2))*ANG)|0; ai=((ai%ANG)+ANG)%ANG;
    if (dist > edgeR[ai]) map[idx(x,y)] = T_OCEAN;
  }
}
// 海岸：内側7マスは砂浜確定。さらに外側へフェザーして砂利との境目を自然に。
// 川(水)は砂浜で塞がず残す＝砂浜にも河口ができる。
const om = map.slice();
for (let y=0;y<SIZE;y++){
  for (let x=0;x<SIZE;x++){
    const here = om[idx(x,y)];
    if (here===T_OCEAN || here===T_WATER) continue;   // 河口の川は残す
    let best = 99;
    for (let j=-12;j<=12;j++) for (let i=-12;i<=12;i++){
      const d2=i*i+j*j;
      if (d2>144) continue;
      if (inb(x+i,y+j) && om[idx(x+i,y+j)]===T_OCEAN){
        const d=Math.sqrt(d2); if (d<best) best=d;
      }
    }
    if (best<=7) map[idx(x,y)] = T_SAND;                       // 確定の砂浜
    else if (best<=12 && rnd() < (12-best)/5 + 0.1)            // 自然な遷移帯
      map[idx(x,y)] = T_SAND;
    else if (here===T_GRAVEL && best<=14 && rnd()<0.5)         // 境目の砂利を間引き
      map[idx(x,y)] = T_SAND;
  }
}

// ---- ミニマップを一度だけプリレンダ -------------------------------------
const PAL = {0:[121,168,92],1:[138,106,69],2:[93,63,32],3:[140,148,184],4:[217,200,121],5:[140,74,54],6:[140,140,140],7:[29,44,82]};
const mapImg = document.createElement('canvas');
mapImg.width = SIZE; mapImg.height = SIZE;
const ic = mapImg.getContext('2d');
const imgd = ic.createImageData(SIZE, SIZE);
for (let i=0;i<SIZE*SIZE;i++){
  const c = PAL[map[i]]; const o=i*4;
  imgd.data[o]=c[0]; imgd.data[o+1]=c[1]; imgd.data[o+2]=c[2]; imgd.data[o+3]=255;
}
ic.putImageData(imgd,0,0);
mctx.imageSmoothingEnabled = false;

// ---- 描画 ---------------------------------------------------------------
let camX = 100.5*CELL, camY = 100.5*CELL;
const SPEED = 520;
const pool = [];
function makeCell(){ const d=document.createElement('div'); d.className='cell'; grid.appendChild(d); return d; }

let lastOX=null, lastOY=null;
function render(){
  const vw=stage.clientWidth, vh=stage.clientHeight;
  let ox = vw/2 - camX, oy = vh/2 - camY;
  ox = Math.min(0, Math.max(vw-MAP_PX, ox));
  oy = Math.min(0, Math.max(vh-MAP_PX, oy));
  grid.style.transform = `translate3d(${ox}px, ${oy}px, 0)`;

  if (lastOX===null || Math.abs(ox-lastOX)>=CELL || Math.abs(oy-lastOY)>=CELL){
    lastOX=ox; lastOY=oy;
    const x0=Math.max(0, Math.floor(-ox/CELL)-1);
    const y0=Math.max(0, Math.floor(-oy/CELL)-1);
    const x1=Math.min(SIZE-1, x0+Math.ceil(vw/CELL)+2);
    const y1=Math.min(SIZE-1, y0+Math.ceil(vh/CELL)+2);
    let n=0;
    for (let y=y0;y<=y1;y++){
      for (let x=x0;x<=x1;x++){
        const el = pool[n] || (pool[n]=makeCell());
        el.className = 'cell t'+map[idx(x,y)];
        el.style.left = x*CELL+'px';
        el.style.top  = y*CELL+'px';
        el.style.display='block';
        n++;
      }
    }
    for (let i=n;i<pool.length;i++) pool[i].style.display='none';
  }
  posEl.textContent = (camX/CELL|0)+', '+(camY/CELL|0);
  drawMini();
}
function drawMini(){
  mctx.clearRect(0,0,160,160);
  mctx.drawImage(mapImg,0,0,SIZE,SIZE,0,0,160,160);
  const s=160/SIZE;
  mctx.strokeStyle='#ffce4f';
  mctx.strokeRect((camX/CELL)*s-4,(camY/CELL)*s-4,8,8);
}

const held=new Set();
const DIR={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',
  w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
window.addEventListener('keydown',e=>{ const k=DIR[e.key]; if(k){e.preventDefault();held.add(k);} });
window.addEventListener('keyup',e=>{ const k=DIR[e.key]; if(k) held.delete(k); });
window.addEventListener('blur',()=>held.clear());

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  let dx=0,dy=0;
  if(held.has('l'))dx-=1; if(held.has('r'))dx+=1;
  if(held.has('u'))dy-=1; if(held.has('d'))dy+=1;
  if(dx||dy){
    if(dx&&dy){const inv=Math.SQRT1_2;dx*=inv;dy*=inv;}
    camX+=dx*SPEED*dt; camY+=dy*SPEED*dt;
    const vw=stage.clientWidth, vh=stage.clientHeight;
    const clamp=(v,view)=> MAP_PX<=view ? MAP_PX/2 : Math.max(view/2,Math.min(MAP_PX-view/2,v));
    camX=clamp(camX,vw); camY=clamp(camY,vh);
  }
  render();
  requestAnimationFrame(loop);
}
window.addEventListener('resize',render);
requestAnimationFrame(loop);
</script>
</body>
</html>
