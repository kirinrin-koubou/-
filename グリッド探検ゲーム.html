<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200×200 グリッド探検ゲーム</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #1a1d29; color: #eee;
    overflow: hidden;
  }
  #wrap { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 10px 16px;
    background: linear-gradient(135deg, #5b6ee1, #7a4fd4);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    font-size: 14px; font-weight: bold;
  }
  header .pill {
    background: rgba(255,255,255,.18);
    padding: 5px 11px; border-radius: 999px;
  }
  header .hint { margin-left: auto; font-weight: normal; opacity: .9; font-size: 13px; }
  #stage {
    flex: 1; position: relative; overflow: hidden;
    background: #0f1118;
  }
  #grid {
    position: absolute; top: 0; left: 0;
    will-change: transform;
    background:
      repeating-linear-gradient(0deg,  #232838 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, #232838 0 1px, transparent 1px 24px),
      #161a26;
  }
  .cell { position: absolute; width: 24px; height: 24px; }
  .gem {
    background: radial-gradient(circle at 35% 30%, #8ff, #2bb 70%);
    border-radius: 50%;
    box-shadow: 0 0 8px #4dd;
  }
  .wall { background: #3a4060; box-shadow: inset 0 0 0 1px #525a82; }
  #mini {
    position: absolute; right: 12px; bottom: 12px;
    border: 2px solid #5b6ee1; border-radius: 6px;
    background: #0c0e15; image-rendering: pixelated;
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="pill">📍 中心マス: <span id="pos">100, 100</span></span>
    <span class="hint">矢印キー / WASD で画面をスクロール（200×200マス）</span>
  </header>
  <div id="stage">
    <div id="grid"></div>
    <canvas id="mini" width="160" height="160"></canvas>
  </div>
</div>
<script>
const SIZE = 200;          // 200 x 200 マス
const CELL = 24;           // 1マスの描画ピクセル
const MAP_PX = SIZE * CELL;
const stage  = document.getElementById('stage');
const grid   = document.getElementById('grid');
const mini   = document.getElementById('mini');
const mctx   = mini.getContext('2d');
const posEl  = document.getElementById('pos');

grid.style.width  = MAP_PX + 'px';
grid.style.height = MAP_PX + 'px';

// カメラ中心（マップ上のピクセル座標、float）。初期は中央。
let camX = 100.5 * CELL;
let camY = 100.5 * CELL;
const SPEED = 520;         // スクロール速度 px/秒

// 壁・ジェムを乱数生成（風景として表示）
const walls = new Set();
const gems  = new Set();
function key(x, y){ return x + ',' + y; }
let seed = 1234567;
function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
for (let i = 0; i < SIZE * SIZE * 0.10; i++) {
  walls.add(key((rnd() * SIZE) | 0, (rnd() * SIZE) | 0));
}
for (let i = 0; i < 120; i++) {
  const x = (rnd() * SIZE) | 0, y = (rnd() * SIZE) | 0, k = key(x, y);
  if (!walls.has(k)) gems.add(k);
}

// 表示セルのプール
const pool = [];
function makeCell(){
  const d = document.createElement('div');
  d.className = 'cell';
  grid.appendChild(d);
  return d;
}

let lastOX = null, lastOY = null;
function render(){
  const vw = stage.clientWidth, vh = stage.clientHeight;
  let ox = vw / 2 - camX;
  let oy = vh / 2 - camY;
  // マップ外が見えないようにクランプ
  ox = Math.min(0, Math.max(vw - MAP_PX, ox));
  oy = Math.min(0, Math.max(vh - MAP_PX, oy));
  grid.style.transform = `translate3d(${ox}px, ${oy}px, 0)`;

  // オフセットが大きく変わった時だけセル再配置（毎フレームは不要）
  if (lastOX === null || Math.abs(ox - lastOX) >= CELL || Math.abs(oy - lastOY) >= CELL) {
    lastOX = ox; lastOY = oy;
    const x0 = Math.max(0, Math.floor(-ox / CELL) - 1);
    const y0 = Math.max(0, Math.floor(-oy / CELL) - 1);
    const x1 = Math.min(SIZE - 1, x0 + Math.ceil(vw / CELL) + 2);
    const y1 = Math.min(SIZE - 1, y0 + Math.ceil(vh / CELL) + 2);
    let n = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const k = key(x, y);
        let cls = null;
        if (walls.has(k)) cls = 'cell wall';
        else if (gems.has(k)) cls = 'cell gem';
        if (!cls) continue;
        const el = pool[n] || (pool[n] = makeCell());
        el.className = cls;
        el.style.left = x * CELL + 'px';
        el.style.top  = y * CELL + 'px';
        el.style.display = 'block';
        n++;
      }
    }
    for (let i = n; i < pool.length; i++) pool[i].style.display = 'none';
  }

  posEl.textContent = (camX / CELL | 0) + ', ' + (camY / CELL | 0);
  drawMini();
}

function drawMini(){
  mctx.fillStyle = '#0c0e15';
  mctx.fillRect(0, 0, 160, 160);
  const s = 160 / SIZE;
  mctx.fillStyle = '#4dd';
  gems.forEach(k => {
    const [x, y] = k.split(',').map(Number);
    mctx.fillRect(x * s, y * s, Math.max(1, s), Math.max(1, s));
  });
  mctx.strokeStyle = '#ffce4f';
  mctx.strokeRect((camX / CELL) * s - 4, (camY / CELL) * s - 4, 8, 8);
}

// 押下中のキーを追跡し、毎フレーム滑らかにスクロール
const held = new Set();
const DIR = {
  ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r',
  w:'u', s:'d', a:'l', d:'r', W:'u', S:'d', A:'l', D:'r'
};
window.addEventListener('keydown', e => {
  const dir = DIR[e.key];
  if (dir) { e.preventDefault(); held.add(dir); }
});
window.addEventListener('keyup', e => {
  const dir = DIR[e.key];
  if (dir) held.delete(dir);
});
window.addEventListener('blur', () => held.clear());

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  let dx = 0, dy = 0;
  if (held.has('l')) dx -= 1;
  if (held.has('r')) dx += 1;
  if (held.has('u')) dy -= 1;
  if (held.has('d')) dy += 1;
  if (dx || dy) {
    if (dx && dy) { const inv = Math.SQRT1_2; dx *= inv; dy *= inv; }
    camX += dx * SPEED * dt;
    camY += dy * SPEED * dt;
    // 画面端でオフセットがクランプされる範囲までしかカメラを動かさない
    // （そうしないと画面は止まったまま座標数字だけ動いてしまう）
    const vw = stage.clientWidth, vh = stage.clientHeight;
    const clamp = (v, view) => MAP_PX <= view
      ? MAP_PX / 2
      : Math.max(view / 2, Math.min(MAP_PX - view / 2, v));
    camX = clamp(camX, vw);
    camY = clamp(camY, vh);
  }
  render();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', render);
requestAnimationFrame(loop);
</script>
</body>
</html>
