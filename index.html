<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .score-board {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .score-item {
            font-size: 1.2em;
            color: #666;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .time-value {
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
        }

        .game-area {
            position: relative;
            width: 400px;
            height: 300px;
            background: #f5f5f5;
            border: 3px solid #667eea;
            border-radius: 10px;
            margin: 30px auto;
            cursor: crosshair;
            overflow: hidden;
        }

        .target {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ff6b6b, #ee5a52);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.5em;
        }

        .target:hover {
            transform: scale(1.1);
        }

        .target:active {
            transform: scale(0.95);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #e74c3c;
            color: white;
        }

        .reset-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 10px;
            z-index: 10;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .game-over p {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .combo {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.5em;
            color: #ffd700;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            to {
                opacity: 0;
                transform: translateY(-50px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 クリックゲーム</h1>

        <div class="score-board">
            <div class="score-item">
                スコア: <span class="score-value" id="score">0</span>
            </div>
            <div class="score-item">
                時間: <span class="time-value" id="timer">30</span>秒
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="game-over" id="gameOver">
                <h2>ゲーム終了！</h2>
                <p id="finalScore">最終スコア: 0</p>
                <p id="finalMessage"></p>
            </div>
        </div>

        <div class="buttons">
            <button class="start-btn" id="startBtn">ゲーム開始</button>
            <button class="reset-btn" id="resetBtn">リセット</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScore = document.getElementById('finalScore');
        const finalMessage = document.getElementById('finalMessage');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let timeInterval = null;
        let targetElement = null;

        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetGame);

        function startGame() {
            score = 0;
            timeLeft = 30;
            gameActive = true;
            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '30';
            gameOverScreen.classList.remove('show');
            startBtn.disabled = true;

            createTarget();
            startTimer();
        }

        function startTimer() {
            timeInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function createTarget() {
            if (!gameActive) return;

            if (targetElement) {
                targetElement.remove();
            }

            const target = document.createElement('div');
            target.className = 'target';
            target.textContent = '💥';

            const maxX = gameArea.clientWidth - 50;
            const maxY = gameArea.clientHeight - 50;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            target.style.left = x + 'px';
            target.style.top = y + 'px';

            target.addEventListener('click', (e) => {
                e.stopPropagation();
                if (gameActive) {
                    score++;
                    scoreDisplay.textContent = score;

                    showCombo(x, y);
                    createTarget();
                }
            });

            gameArea.appendChild(target);
            targetElement = target;
        }

        function showCombo(x, y) {
            const combo = document.createElement('div');
            combo.className = 'combo';
            combo.textContent = '+1';
            combo.style.left = (x + 25) + 'px';
            combo.style.top = (y + 25) + 'px';
            gameArea.appendChild(combo);

            setTimeout(() => combo.remove(), 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timeInterval);

            if (targetElement) {
                targetElement.remove();
            }

            startBtn.disabled = false;
            finalScore.textContent = `最終スコア: ${score}`;

            if (score >= 50) {
                finalMessage.textContent = 'すごい！🌟';
            } else if (score >= 30) {
                finalMessage.textContent = 'よくできました！👍';
            } else if (score >= 15) {
                finalMessage.textContent = 'もう一度挑戦してみてください！💪';
            } else {
                finalMessage.textContent = '頑張ってください！😊';
            }

            gameOverScreen.classList.add('show');
        }

        function resetGame() {
            gameActive = false;
            clearInterval(timeInterval);
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '30';
            gameOverScreen.classList.remove('show');
            startBtn.disabled = false;

            if (targetElement) {
                targetElement.remove();
            }
        }
    </script>
</body>
</html>
