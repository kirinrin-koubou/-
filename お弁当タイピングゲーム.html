<script>
/* ============================================================
   ローマ字入力エンジン（濁音・半濁音・小書き・複数打鍵対応）
   ============================================================ */
const KANA = {
  "あ":["a"],"い":["i","yi"],"う":["u","wu","whu"],"え":["e"],"お":["o"],
  "か":["ka","ca"],"き":["ki"],"く":["ku","cu","qu"],"け":["ke"],"こ":["ko","co"],

  "た":["ta"],"ち":["ti","chi"],"つ":["tu","tsu"],"て":["te"],"と":["to"],
  "な":["na"],"に":["ni"],"ぬ":["nu"],"ね":["ne"],"の":["no"],
  "は":["ha"],"ひ":["hi"],"ふ":["fu","hu"],"へ":["he"],"ほ":["ho"],
  "ま":["ma"],"み":["mi"],"む":["mu"],"め":["me"],"も":["mo"],
  "や":["ya"],"ゆ":["yu"],"よ":["yo"],
  "ら":["ra"],"り":["ri"],"る":["ru"],"れ":["re"],"ろ":["ro"],
  "わ":["wa"],"ゐ":["wyi"],"ゑ":["wye"],"を":["wo"],"ん":["nn","n","xn"],
  "が":["ga"],"ぎ":["gi"],"ぐ":["gu"],"げ":["ge"],"ご":["go"],
  "ざ":["za"],"じ":["zi","ji"],"ず":["zu"],"ぜ":["ze"],"ぞ":["zo"],
  "だ":["da"],"ぢ":["di"],"づ":["du"],"で":["de"],"ど":["do"],
  "ば":["ba"],"び":["bi"],"ぶ":["bu"],"べ":["be"],"ぼ":["bo"],
  "ぱ":["pa"],"ぴ":["pi"],"ぷ":["pu"],"ぺ":["pe"],"ぽ":["po"],
  "ぁ":["xa","la"],"ぃ":["xi","li","xyi","lyi"],"ぅ":["xu","lu"],"ぇ":["xe","le","xye","lye"],"ぉ":["xo","lo"],
  "ゃ":["xya","lya"],"ゅ":["xyu","lyu"],"ょ":["xyo","lyo"],"ゎ":["xwa","lwa"],"っ":["xtu","ltu","xtsu","ltsu"],
  "ー":["-"],"、":[","],"。":["."],"・":["/"],"！":["!"],"？":["?"]," ":[" "],
  // 拗音
  "きゃ":["kya"],"きゅ":["kyu"],"きょ":["kyo"],"きぇ":["kye"],"きぃ":["kyi"],
  "ぎゃ":["gya"],"ぎゅ":["gyu"],"ぎょ":["gyo"],"ぎぇ":["gye"],
  "しゃ":["sya","sha"],"しゅ":["syu","shu"],"しょ":["syo","sho"],"しぇ":["sye","she"],"しぃ":["syi"],
  "じゃ":["zya","ja","jya"],"じゅ":["zyu","ju","jyu"],"じょ":["zyo","jo","jyo"],"じぇ":["zye","je","jye"],"じぃ":["jyi","zyi"],
  "ちゃ":["tya","cha","cya"],"ちゅ":["tyu","chu","cyu"],"ちょ":["tyo","cho","cyo"],"ちぇ":["tye","che","cye"],"ちぃ":["tyi","cyi"],
  "ぢゃ":["dya"],"ぢゅ":["dyu"],"ぢょ":["dyo"],"ぢぇ":["dye"],
  "にゃ":["nya"],"にゅ":["nyu"],"にょ":["nyo"],"にぇ":["nye"],"にぃ":["nyi"],
  "ひゃ":["hya"],"ひゅ":["hyu"],"ひょ":["hyo"],"ひぇ":["hye"],"ひぃ":["hyi"],
  "びゃ":["bya"],"びゅ":["byu"],"びょ":["byo"],"びぇ":["bye"],
  "ぴゃ":["pya"],"ぴゅ":["pyu"],"ぴょ":["pyo"],"ぴぇ":["pye"],
  "みゃ":["mya"],"みゅ":["myu"],"みょ":["myo"],"みぇ":["mye"],
  "りゃ":["rya"],"りゅ":["ryu"],"りょ":["ryo"],"りぇ":["rye"],
  "ふぁ":["fa","fwa","hwa"],"ふぃ":["fi","fwi"],"ふぇ":["fe","fwe"],"ふぉ":["fo","fwo"],"ふゅ":["fyu"],
  "うぁ":["wha"],"うぃ":["wi","whi"],"うぇ":["we","whe"],"うぉ":["who"],
  "ヴぁ":["va"],"ゔぁ":["va"],"ゔ":["vu"],"ゔぃ":["vi"],"ゔぇ":["ve"],"ゔぉ":["vo"],
  "てぃ":["thi"],"てゃ":["tha"],"てゅ":["thu"],"てょ":["tho"],"てぇ":["the"],
  "でぃ":["dhi"],"でゅ":["dhu"],"とぅ":["twu"],"どぅ":["dwu"],
  "つぁ":["tsa"],"つぃ":["tsi"],"つぇ":["tse"],"つぉ":["tso"],
  "いぇ":["ye"],"くぁ":["qa","kwa"],"くぃ":["qi","kwi"],"くぇ":["qe","kwe"],"くぉ":["qo","kwo"],
  "ぐぁ":["gwa"],"すぃ":["swi"],"ずぃ":["zwi"]
};
const COMBO2 = new Set(Object.keys(KANA).filter(k=>k.length===2));
const SMALL_Y = new Set(["ゃ","ゅ","ょ"]);
const SMALL_V = new Set(["ぁ","ぃ","ぅ","ぇ","ぉ"]);

// 文字列(かな)→ トークン列。各トークン: {disp, alts:[...] }
function tokenize(str){
  const t=[];
  for(let i=0;i<str.length;i++){
    const c=str[i], c2=str.slice(i,i+2);
    if(c==="っ"){
      // 促音：次のかなの子音を重ねる or xtu系
      let j=i+1, nstr="";
      while(j<str.length && str[j]==="っ"){ j++; }
      // 次のモーラを先読み（拗音含む）
      const nx2=str.slice(j,j+2);
      let nextAlts, nextDisp, consumed;
      if(COMBO2.has(nx2)){ nextAlts=KANA[nx2].slice(); nextDisp=nx2; consumed=2; }
      else if(str[j] && KANA[str[j]]){ nextAlts=KANA[str[j]].slice(); nextDisp=str[j]; consumed=1; }
      else { nextAlts=null; }
      const alts=[];
      const sokuonSelf=["xtu","ltu","xtsu","ltsu"];
      if(nextAlts){
        nextAlts.forEach(a=>{
          const f=a[0];
          if(/[a-z]/.test(f) && !"aiueo".includes(f)){ alts.push(f+a); }
          sokuonSelf.forEach(s=>alts.push(s+a));
        });
        // 連続っ対応：j-i-1 個の追加促音は簡略化（1つ分のみ厳密、残りは xtu）
        t.push({disp:"っ".repeat(j-i)+nextDisp, alts:[...new Set(alts)]});
        i = j + consumed - 1;
      } else {
        t.push({disp:"っ", alts:sokuonSelf});
        i = j - 1;
      }
      continue;
    }
    if(c==="ん"){
      const nxt=str[i+1];
      const nxtChar = nxt || "";
      // 次が母音/な行/や行/ん or 文末 → n単独不可（nn/xn/n'）
      let needDouble=false;
      if(!nxt) needDouble=true;
      else if("あいうえおなにぬねのやゆよん".includes(nxt)) needDouble=true;
      const alts = needDouble ? ["nn","xn","n'"] : ["n","nn","xn"];
      t.push({disp:"ん", alts});
      continue;
    }
    if(COMBO2.has(c2)){ t.push({disp:c2, alts:KANA[c2].slice()}); i++; continue; }
    if(KANA[c]){ t.push({disp:c, alts:KANA[c].slice()}); continue; }
    // 未知文字はそのまま
    t.push({disp:c, alts:[c]});
  }
  return t;
}

/* ============================================================
   タイピングセッション
   ============================================================ */
function makeSession(kanaStr){
  return { kana:kanaStr, tokens:tokenize(kanaStr), idx:0, buf:"", done:false,
           hits:0, miss:0 };
}
// 1キー処理。戻り: {ok, complete, tokenDone, weakDisp}
function feed(s, ch){
  if(s.done) return {ok:false};
  const tk=s.tokens[s.idx];
  const nb=s.buf+ch;
  const matchExact = tk.alts.includes(nb);
  const matchPrefix = tk.alts.some(a=>a.startsWith(nb));
  if(matchPrefix){
    s.buf=nb; s.hits++;
    if(matchExact && !tk.alts.some(a=>a.length>nb.length && a.startsWith(nb))){
      // 完全一致かつ延長候補なし → 確定
      return commitToken(s);
    }
    if(matchExact){
      // 例: ん "n"。延長候補ありだが暫定確定状態にする
      s._pendingCommit=true;
    } else s._pendingCommit=false;
    return {ok:true, complete:false, tokenDone:false};
  }
  // 現バッファが確定済みで、次トークンの開始なら確定して持ち越し
  if(s._pendingCommit || tk.alts.includes(s.buf)){
    const r=commitToken(s);
    if(s.done){ // 文末なのに余分入力
      s.miss++; return {ok:false, weakDisp:tk.disp};
    }
    s._pendingCommit=false;
    return feed(s, ch); // 次トークンへ再投入
  }
  s.miss++;
  return {ok:false, weakDisp:tk.disp};
}
function commitToken(s){
  s.buf=""; s.idx++; s._pendingCommit=false;
  if(s.idx>=s.tokens.length){ s.done=true; return {ok:true, complete:true, tokenDone:true}; }
  return {ok:true, complete:false, tokenDone:true};
}
function renderRoma(s){
  let html="";
  s.tokens.forEach((tk,i)=>{
    const a=tk.alts[0];
    if(i<s.idx) html+=`<span class="typed-ok">${a}</span>`;
    else if(i===s.idx){
      const cur=tk.alts.find(x=>x.startsWith(s.buf))||a;
      html+=`<span class="typed-cur">${cur.slice(0,s.buf.length)}</span><span class="typed-rest">${cur.slice(s.buf.length)}</span>`;
    } else html+=`<span class="typed-rest">${a}</span>`;
  });
  return html;
}

/* ---- 画面キーボード（最短=黄, ミスでない=赤, それ以外=灰） ---- */
function keyColors(s){
  const toks=s.tokens, len=toks.length, memo={};
  function cost(idx,buf){
    if(idx>=len) return 0;
    const key=idx+"|"+buf;
    if(memo[key]!=null) return memo[key];
    let best=Infinity;
    for(const a of toks[idx].alts){
      if(a.startsWith(buf)){
        const c=(a.length-buf.length)+cost(idx+1,"");
        if(c<best) best=c;
      }
    }
    return memo[key]=best;
  }
  const idx=s.idx, buf=s.buf, tk=toks[idx], valid=new Set();
  for(const a of tk.alts){
    if(a.startsWith(buf) && a.length>buf.length) valid.add(a[buf.length]);
  }
  const canCommit=tk.alts.includes(buf);
  if(canCommit && idx+1<len){
    for(const a of toks[idx+1].alts) valid.add(a[0]);
  }
  let best=Infinity; const tot={};
  for(const c of valid){
    let rc=Infinity;
    if(tk.alts.some(a=>a.startsWith(buf+c))) rc=Math.min(rc,cost(idx,buf+c));
    if(canCommit && idx+1<len && toks[idx+1].alts.some(a=>a.startsWith(c)))
      rc=Math.min(rc,cost(idx+1,c));
    tot[c]=1+rc; if(tot[c]<best) best=tot[c];
  }
  const yellow=new Set(), red=new Set();
  for(const c of valid){ (tot[c]===best?yellow:red).add(c); }
  return {yellow,red};
}
function renderKeyboard(){
  const kb=document.getElementById("keyboard");
  if(!kb) return;
  const active = M && M.s && !M.s.done;
  if(!active){ kb.style.display="none"; kb.innerHTML=""; return; }
  kb.style.display="block";
  const {yellow}=keyColors(M.s);
  const rows=["qwertyuiop","asdfghjkl","zxcvbnm"];
  let html="";
  const cell=c=>`<div class="kb-key${yellow.has(c)?" kb-yellow":""}">${c}</div>`;
  rows.forEach(r=>{ html+='<div class="kb-row">'+[...r].map(cell).join("")+'</div>'; });
  html+='<div class="kb-row">'+cell("-")+
        `<div class="kb-key kb-wide${yellow.has(" ")?" kb-yellow":""}">space</div>`+'</div>';
  kb.innerHTML=html;
}

/* ---- 漢字ふりがな ---- */
const KMAP={
 "弁":"べん","当":"とう","作":"つく","具":"ぐ","材":"ざい","購":"こう","入":"にゅう",
 "詰":"つ","期":"き","間":"かん","限":"げん","定":"てい","飾":"かざ","一":"いち","覧":"らん",
 "設":"せっ","所":"しょ","持":"じ","最":"さい","高":"こう","級":"きゅう","苦":"にが","手":"て",
 "文":"も","字":"じ","個":"こ","落":"お","終":"しゅう","了":"りょう","完":"かん","成":"せい",
 "豪":"ごう","華":"か","品":"しな","数":"かず","特":"とく","別":"べつ","難":"なん","度":"ど",
 "待":"ま","時":"じ","正":"せい","答":"とう","率":"りつ","現":"げん","在":"ざい","倍":"ばい",
 "単":"たん","語":"ご","秒":"びょう","低":"てい","回":"かい","残":"のこ","傑":"けっ","直":"ちょっ",
 "近":"きん","報":"ほう","酬":"しゅう","分":"ぶん","析":"せき","克":"こく","服":"ふく","中":"ちゅう",
 "何":"なん","変":"へん","更":"こう","可":"か","押":"お","選":"えら","空":"から","使":"つか",
 "切":"き","化":"か","集":"あつ","収":"しゅう","精":"せい","得":"とく","意":"い","不":"ふ",
 "金":"きん","箔":"はく","和":"わ","牛":"ぎゅう","保":"ほ","存":"ぞん","制":"せい","御":"ぎょ",
 "今":"いま","名":"な","物":"もの","次":"つぎ","語目":"ごめ"
};
function esc(c){ return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c; }
function rubify(str){
  let out="";
  for(const ch of str){
    out += KMAP[ch] ? `<ruby>${ch}<rt>${KMAP[ch]}</rt></ruby>` : esc(ch);
  }
  return out;
}
let _mo=null, _scheduled=false;
function rubifyAll(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
    const t=p.nodeName;
    if(t==="RUBY"||t==="RT"||t==="SCRIPT"||t==="STYLE") return NodeFilter.FILTER_REJECT;
    return /[一-鿿]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const list=[]; let n; while(n=w.nextNode()) list.push(n);
  list.forEach(node=>{
    const span=document.createElement("span");
    span.innerHTML=rubify(node.nodeValue);
    node.parentNode.replaceChild(span,node);
  });
}
function doRefresh(){
  if(_mo) _mo.disconnect();
  rubifyAll();
  renderKeyboard();
  if(_mo) _mo.observe(document.body,{childList:true,subtree:true,characterData:true});
}
function scheduleRefresh(){
  if(_scheduled) return; _scheduled=true;
  requestAnimationFrame(()=>{ _scheduled=false; doRefresh(); });
}

   ============================================================ */

  {n:"ごはん",e:"🍚",v:10,rank:"普通"},
  {n:"うめぼし",e:"🔴",v:15,rank:"普通"},

const ALL_ING = {};
[...ING,...SPECIAL_ING].forEach(x=>ALL_ING[x.n]=x);

// 購入用の単語・文章（濁音半濁音小書き入り）
const BUY_WORDS = [
 "ごはん","うめぼし","たまごやき","からあげ","えびふらい","しゃけ","ぎょうざ",
 "ぶろっこりー","みにとまと","ういんなー","ちくわ","ぽてとさらだ","きんぴら",
 "しゅうまい","ひじき","がっこうのきゅうしょく","ぱんだのおべんとう",
 "じてんしゃでぴくにっく","しょうゆとそーす","ちょっぴりからい",
 "びゅっふぇでばいきんぐ","でぃずにーへいこう","ふぁいといっぱつ"
];

/* ============================================================
   セーブデータ
   ============================================================ */
const SAVE_KEY="bentoTypingSave_v1";
let DB = load();
function load(){
  try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)); if(d) return d; }catch(e){}
  return { inv:{}, bentos:[], stats:{}, bestEver:null, settings:{diff:"normal"} };
}
if(!DB.settings) DB.settings={diff:"normal"};
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(DB)); }
function diffCfg(){
  const d=(DB.settings&&DB.settings.diff)||"normal";
  if(d==="easy") return {key:"easy", label:"やさしい", buyMult:1.7, dropLimit:5};
  if(d==="hard") return {key:"hard", label:"むずかしい", buyMult:0.8, dropLimit:2};
  return {key:"normal", label:"ふつう", buyMult:1.2, dropLimit:3};
}
function buyTime(word){ return Math.max(3, Math.ceil(word.length*diffCfg().buyMult)); }
function addStat(disp,hits,miss){
  if(!DB.stats[disp]) DB.stats[disp]={a:0,m:0};
  DB.stats[disp].a += hits+miss;
  DB.stats[disp].m += miss;
}
function weakChars(){
  // ミス率70%以上（試行3回以上）
  return Object.entries(DB.stats)
    .filter(([k,v])=>v.a>=3 && v.m/v.a>=0.7)
    .map(([k,v])=>({c:k,rate:Math.round(v.m/v.a*100)}))
    .sort((a,b)=>b.rate-a.rate);
}

/* ============================================================
   画面制御
   ============================================================ */
const $=id=>document.getElementById(id);
function show(view){
  ["homeView","gameView","listView","settingsView"].forEach(v=>$(v).classList.add("hidden"));
  $(view).classList.remove("hidden");
}
function goHome(){ stopTimer(); renderHome(); show("homeView"); }
function renderHome(){
  const inv=$("homeInv"); inv.innerHTML="";
  const keys=Object.keys(DB.inv).filter(k=>DB.inv[k]>0);
  if(!keys.length) inv.innerHTML="<li>まだありません</li>";
  keys.forEach(k=>{
    const ing=ALL_ING[k]||{e:"❓",rank:""};
    inv.innerHTML+=`<li><span>${ing.e} ${k} <span class="small">(${ing.rank})</span></span><b>×${DB.inv[k]}</b></li>`;
  });
  const b=DB.bestEver;
  $("homeBest").innerHTML = b
    ? `豪華さ <b>${b.score}</b> 点<br>${b.items.map(x=>(ALL_ING[x]||{e:"❓"}).e).join(" ")}<br><span class="small">${b.items.join("・")}</span>`
    : "まだありません";
  const w=weakChars();
  $("homeWeak").innerHTML = w.length
    ? "苦手な文字（ミス率70%以上）：<br>"+w.slice(0,12).map(x=>`<span class="weak-tag">${x.c} ${x.rate}%</span>`).join("")
    : "<span class='small'>苦手分析：データ収集中（タイピングするほど精度UP）</span>";
}

/* ---- タイマー ---- */
let timerH=null;
function startTimer(sec,onEnd){
  stopTimer();
  $("timerBar").classList.remove("hidden");
  const total=sec*1000; let start=Date.now();
  timerH=setInterval(()=>{
    const left=total-(Date.now()-start);
    const p=Math.max(0,left/total*100);
    $("timerFill").style.width=p+"%";
    if(left<=0){ stopTimer(); onEnd(); }
  },50);
}
function stopTimer(){ if(timerH){ clearInterval(timerH); timerH=null; } $("timerBar").classList.add("hidden"); }

/* ============================================================
   モード起動
   ============================================================ */
let M=null; // 現在モード状態
function startMode(mode){
  if(mode==="list"){ renderList(); show("listView"); return; }
  show("gameView");
  $("bentoBox").classList.add("hidden");
  $("gameControls").innerHTML="";
  $("gameMsg").textContent="";
  if(mode==="buy") initBuy();
  if(mode==="pack") initPack();
  if(mode==="deco") initDeco();
}

/* ---- 具材購入（制限時間あり） ---- */
function initBuy(){
  $("gameTitle").textContent="🛒 具材購入";
  $("gameSub").textContent="やめるまで続きます";
  M={mode:"buy", got:0, round:0};
  nextBuyWord();
}
function nextBuyWord(){
  if(!M || M.mode!=="buy") return;
  M.round++;
  const w=BUY_WORDS[Math.floor(Math.random()*BUY_WORDS.length)];
  M.word=w; M.s=makeSession(w);
  const sec=buyTime(w);
  $("gameSub").textContent=`${M.round}語目　獲得:${M.got}　待ち時間:${sec}秒`;
  $("wordDisplay").textContent=w;
  $("romaDisplay").innerHTML=renderRoma(M.s);
  $("statRow").innerHTML="";
  $("gameMsg").textContent="";
  $("gameControls").innerHTML=`<button class="danger-btn" onclick="endBuy()">🛑 やめる</button>`;
  startTimer(sec, ()=>{ $("gameMsg").textContent="⏰ 時間切れ！次の単語へ"; setTimeout(nextBuyWord,800); });
}
function endBuy(){
  stopTimer();
  M.mode="buyEnd";
  $("wordDisplay").textContent="🎉 購入終了";
  $("romaDisplay").innerHTML="";
  $("statRow").innerHTML="";
  $("gameMsg").innerHTML=`具材を <b>${M.got}</b> 個ゲットしました！`;
  $("gameControls").innerHTML=`<button class="primary-btn" onclick="goHome()">ホームへ</button>`;
  save();
}

/* ---- お弁当詰め（ミスで具材が落ちる） ---- */
function initPack(){
  $("gameTitle").textContent="🍱 お弁当詰め";
  const avail=Object.keys(DB.inv).filter(k=>DB.inv[k]>0);
  if(!avail.length){
    $("gameSub").textContent="";
    $("wordDisplay").textContent="具材がありません";
    $("romaDisplay").innerHTML="";
    $("gameMsg").textContent="先に「具材購入」で具材を集めよう！";
    $("gameControls").innerHTML=`<button class="primary-btn" onclick="goHome()">ホームへ</button>`;
    return;
  }
  M={mode:"pack", placed:[], dropped:0, pool:{...DB.inv}};
  $("bentoBox").classList.remove("hidden");
  packPick();
}
function packPick(){
  const avail=Object.keys(M.pool).filter(k=>M.pool[k]>0);
  $("gameSub").textContent=`詰めた具材:${M.placed.length}　落とした:${M.dropped}`;
  renderBentoBox();
  if(!avail.length){ finishBento("全具材を使い切った！"); return; }
  $("wordDisplay").textContent="詰める具材を選ぼう";
  $("romaDisplay").innerHTML="";
  $("statRow").innerHTML="";
  let html='<div class="pick-list">';
  avail.forEach(k=>{
    const ing=ALL_ING[k]||{e:"❓"};
    html+=`<button onclick="packStart('${k}')">${ing.e} ${k} ×${M.pool[k]}</button>`;
  });
  html+='</div><button class="primary-btn" onclick="finishBento(\'決定！\')">✅ 決定（お弁当を保存）</button>';
  $("gameControls").innerHTML=html;
}
function packStart(k){
  M.cur=k; M.s=makeSession(k); M.curMiss=0; M.dropLimit=diffCfg().dropLimit;
  const ing=ALL_ING[k]||{e:"❓"};
  $("wordDisplay").textContent=`${ing.e} ${k}`;
  $("romaDisplay").innerHTML=renderRoma(M.s);
  $("gameMsg").textContent=`正確に打って詰めよう（ミス${M.dropLimit}回で落下）`;
  $("statRow").innerHTML=`<span>落下まで残り <b id='dropLeft'>${M.dropLimit}</b> ミス</span>`;
  $("gameControls").innerHTML="";
}
function renderBentoBox(){
  const box=$("bentoBox");
  if(!M.placed.length){ box.innerHTML="<span class='small' style='color:#fff'>まだ空っぽ</span>"; return; }
  box.innerHTML=M.placed.map(k=>{
    const ing=ALL_ING[k]||{e:"❓"};
    return `<span class="ing-chip">${ing.e} ${k}</span>`;
  }).join("");
}
function finishBento(reason){
  if(!M.placed.length){ $("gameMsg").textContent="空のお弁当は保存できません。具材を詰めよう"; return; }
  let score=M.placed.reduce((s,k)=>s+((ALL_ING[k]||{v:5}).v),0);
  if(M.placed.length>=8) score=Math.round(score*1.2); // 品数ボーナス
  const bento={items:[...M.placed], score, date:new Date().toLocaleString("ja-JP")};
  DB.bentos.push(bento);
  if(DB.bentos.length>15) DB.bentos=DB.bentos.slice(DB.bentos.length-15);
  if(!DB.bestEver || score>DB.bestEver.score) DB.bestEver={...bento};
  save();
  stopTimer();
  $("wordDisplay").textContent="🍱 お弁当完成！";
  $("romaDisplay").innerHTML="";
  $("statRow").innerHTML="";
  $("gameMsg").innerHTML=`${reason}　豪華さ <b>${score}</b> 点 / 品数 ${M.placed.length}　（落とした具材:${M.dropped}）`;
  $("gameControls").innerHTML=`<button class="primary-btn" onclick="goHome()">ホームへ</button>`;
}

/* ---- 期間限定の飾り（苦手文字入り→特別具材） ---- */
function initDeco(){
  $("gameTitle").textContent="✨ 期間限定の飾り";
  $("gameSub").textContent="苦手克服で特別具材！";
  const w=weakChars();
  const target = w.length? w[Math.floor(Math.random()*Math.min(3,w.length))].c : null;
  const sentence=buildDecoSentence(target);
  M={mode:"deco"};
  M.word=sentence; M.s=makeSession(sentence);
  M.reward=SPECIAL_ING[Math.floor(Math.random()*SPECIAL_ING.length)];
  $("wordDisplay").textContent=sentence;
  $("romaDisplay").innerHTML=renderRoma(M.s);
  $("statRow").innerHTML=`<span>報酬: <b>${M.reward.e} ${M.reward.n}</b></span><span class="small">${target?("苦手「"+target+"」入り"):"分析中につき通常文"}</span>`;
  $("gameMsg").textContent="ミスしてもOK。最後まで打ち切れば特別具材ゲット";
  $("gameControls").innerHTML="";
}
function buildDecoSentence(weak){
  const base=["でこれーしょんべんとう","きらきらかざりつけ","ぴかぴかのほうせき",
              "じゃがいもとぎゅうにく","ちょうごうかなおべんとう","ぱぱっとしゃしんさつえい"];
  let s=base[Math.floor(Math.random()*base.length)];
  if(weak){
    // 苦手文字を含む語を必ず1つ混ぜる
    const found = BUY_WORDS.find(w=>tokenize(w).some(t=>t.disp===weak));
    s = (found||weak.repeat(3)) + "の" + s;
  }
  return s;
}

/* ============================================================
   キー入力ハンドラ
   ============================================================ */
document.addEventListener("keydown",e=>{
  if($("gameView").classList.contains("hidden")) return;
  if(!M || !M.s || M.s.done) return;
  if(e.key.length!==1) return;
  const ch=e.key.toLowerCase();
  if(!/[a-z0-9\-,.\/!? ']/.test(ch)) return;
  e.preventDefault();
  const r=feed(M.s,ch);
  $("romaDisplay").innerHTML=renderRoma(M.s);

  if(M.mode==="pack"){
    if(!r.ok && r.weakDisp){
      M.curMiss++;
      const left=Math.max(0,M.dropLimit-M.curMiss);
      if($("dropLeft")) $("dropLeft").textContent=left;
      $("gameMsg").textContent="⚠️ ミス！具材がぐらついた…";
      if(M.curMiss>=M.dropLimit){
        // 具材落下
        addStat(M.s.tokens[M.s.idx]?.disp||r.weakDisp, M.s.hits, M.s.miss);
        M.pool[M.cur]--; M.dropped++;
        DB.inv[M.cur]=(DB.inv[M.cur]||1)-1; save();
        $("gameMsg").textContent=`💥 ${M.cur} を落としてしまった…`;
        M.s.done=true;
        setTimeout(packPick,900);
        return;
      }
    }
    if(r.complete){
      M.s.tokens.forEach(t=>{}); // 統計はトークン単位で下で集計
      recordSessionStats(M.s);
      M.pool[M.cur]--; M.placed.push(M.cur);
      DB.inv[M.cur]=(DB.inv[M.cur]||1)-1; save();
      $("gameMsg").textContent="✅ うまく詰めた！";
      setTimeout(packPick,700);
    }
    return;
  }

  if(M.mode==="buy"){
    if(r.complete){
      recordSessionStats(M.s);
      stopTimer();
      // 単語に対応する具材があれば付与、なければランダム通常具材
      let gain = ALL_ING[M.word] ? M.word : ING[Math.floor(Math.random()*ING.length)].n;
      DB.inv[gain]=(DB.inv[gain]||0)+1; M.got++; save();
      const ing=ALL_ING[gain];
      $("gameMsg").innerHTML=`🎁 ${ing.e} <b>${gain}</b> をゲット！`;
      setTimeout(nextBuyWord,800);
    }
    return;
  }

  if(M.mode==="deco"){
    if(r.complete){
      recordSessionStats(M.s);
      DB.inv[M.reward.n]=(DB.inv[M.reward.n]||0)+1; save();
      stopTimer();
      $("wordDisplay").textContent="✨ 飾りつけ成功！";
      $("gameMsg").innerHTML=`特別具材 ${M.reward.e} <b>${M.reward.n}</b> をゲット！`;
      $("gameControls").innerHTML=`<button class="primary-btn" onclick="goHome()">ホームへ</button>`;
    }
    return;
  }
});
// セッション終了時にトークン毎の統計を記録（簡易：かな全体のhit/miss比で按分）
function recordSessionStats(s){
  const perToken = s.tokens.length||1;
  s.tokens.forEach(t=>{
    if(!DB.stats[t.disp]) DB.stats[t.disp]={a:0,m:0};
    DB.stats[t.disp].a += Math.max(1,Math.round(s.hits/perToken));
    DB.stats[t.disp].m += Math.round(s.miss/perToken);
  });
  save();
}

/* ---- 弁当一覧（直近14＋最高傑作1） ---- */
function renderList(){
  const grid=$("bentoGrid");
  const recent=DB.bentos.slice(-14).reverse();
  let best=DB.bestEver;
  let html="";
  if(best){
    html+=`<div class="bento-card best"><b>👑 最高傑作</b><br>豪華さ ${best.score}点<br>
      <div style="font-size:20px;margin:6px 0;">${best.items.map(x=>(ALL_ING[x]||{e:"❓"}).e).join(" ")}</div>
      <span class="small">${best.items.join("・")}<br>${best.date||""}</span></div>`;
  }
  if(!recent.length && !best){ grid.innerHTML="<p>まだお弁当がありません。「お弁当詰め」で作ろう！</p>"; return; }
  recent.forEach(b=>{
    html+=`<div class="bento-card"><b>豪華さ ${b.score}点</b><br>
      <div style="font-size:20px;margin:6px 0;">${b.items.map(x=>(ALL_ING[x]||{e:"❓"}).e).join(" ")}</div>
      <span class="small">${b.items.join("・")}<br>${b.date||""}</span></div>`;
  });
  grid.innerHTML=html;
}

/* ---- 設定画面 ---- */
function openSettings(){ stopTimer(); renderSettings(); show("settingsView"); }
function setDiff(d){ if(!DB.settings) DB.settings={}; DB.settings.diff=d; save(); renderSettings(); }
function renderSettings(){
  const cur=diffCfg().key;
  const defs=[["easy","やさしい"],["normal","ふつう"],["hard","むずかしい"]];
  $("diffPick").innerHTML=defs.map(([k,l])=>
    `<button onclick="setDiff('${k}')" ${k===cur?'style="background:#3aa84a;color:#fff;border-color:#2c7d38"':''}>${l}</button>`
  ).join("");
  const c=diffCfg();
  $("diffInfo").innerHTML=`現在の難度：<b>${c.label}</b><br>
    <span class="small">具材購入の待ち時間倍率 ×${c.buyMult}　／　お弁当詰めの落下ミス数 ${c.dropLimit}回</span>`;
  // 待ち時間の目安（単語長別）
  const lens=[3,5,8,12];
  $("waitInfo").innerHTML="単語の文字数 × "+c.buyMult+" 秒（最低3秒）<br>"+
    lens.map(n=>`<span class="weak-tag">${n}文字 → ${Math.max(3,Math.ceil(n*c.buyMult))}秒</span>`).join("");
  // キーごとの正答率
  const rows=Object.entries(DB.stats)
    .filter(([k,v])=>v.a>0)
    .map(([k,v])=>({c:k,a:v.a,acc:Math.round((v.a-v.m)/v.a*100)}))
    .sort((x,y)=>x.acc-y.acc);
  $("keyAcc").innerHTML = rows.length
    ? rows.map(r=>`<span class="weak-tag" style="background:${r.acc>=70?'#cdeccd':'#ffc7b0'}">${r.c} ${r.acc}% <span class="small">(${r.a}回)</span></span>`).join("")
    : "<span class='small'>まだデータがありません。タイピングすると正答率が記録されます。</span>";
}

/* 初期化 */
renderHome();
_mo=new MutationObserver(()=>scheduleRefresh());
doRefresh();
</script>
