/* ---------- 2. オーディオ (§11) WebAudio 合成 ---------- */
var Audio=(function(){
  var ctx=null, bgmTimer=null, bgmGain=null, settings={bgm:.3,se:.6,shake:true};
  var melodies={
    field:[ [330,0.18],[392,0.18],[440,0.18],[392,0.18],[330,0.18],[294,0.18],[330,0.36] ],
    battle:[ [262,0.14],[330,0.14],[392,0.14],[523,0.14],[392,0.14],[330,0.14] ],
    boss:[ [220,0.14],[262,0.14],[208,0.14],[247,0.14],[196,0.2] ],
    win:[ [523,0.16],[659,0.16],[784,0.16],[1047,0.4] ]
  };
  function ensure(){
    if(ctx) return true;
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); return true; }
    catch(e){ return false; }
  }
  function resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); }
  function tone(freq,dur,type,vol){
    if(!ensure()||vol<=0) return;
    try{
      var o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
      o.type=type||'square'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function se(name){
    var v=settings.se*0.5;
    if(name==='ok') tone(660,0.08,'square',v);
    else if(name==='cancel') tone(280,0.09,'square',v);
    else if(name==='hit') tone(150,0.12,'sawtooth',v);
    else if(name==='crit'){ tone(180,0.1,'sawtooth',v); tone(360,0.12,'square',v);}
    else if(name==='catch'){ tone(523,0.1,'square',v); setTimeout(function(){tone(784,0.18,'square',v)},120);}
    else if(name==='heal') tone(880,0.16,'sine',v);
    else if(name==='lvup'){ tone(523,0.09,'square',v); setTimeout(function(){tone(784,0.16,'square',v)},90);}
    else if(name==='faint') tone(120,0.4,'sawtooth',v);
  }
  function stopBgm(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
  function playBgm(name){
    stopBgm();
    if(settings.bgm<=0||!ensure()) return;
    var mel=melodies[name]||melodies.field, i=0;
    function step(){
      if(settings.bgm<=0){ return; }
      var n=mel[i%mel.length];
      tone(n[0], n[1]*0.95, 'square', settings.bgm*0.22);
      tone(n[0]/2, n[1]*0.95, 'triangle', settings.bgm*0.16);
      i++;
    }
    step(); bgmTimer=setInterval(step, 220);
  }
  function setVol(b,s){ settings.bgm=b; settings.se=s; }
  return {se,playBgm,stopBgm,resume,ensure,setVol,settings};
})();

/* ---------- 3. セーブ (§15) ---------- */
var Save=(function(){
  var KEY='elemon.save.v3', BAK='elemon.save.bak', SKEY='elemon.settings', VER=3;
  function defSettings(){ return {bgm:.3,se:.6,textSpeed:2,shake:true,colorAssist:true,tutorial:true}; }
  function loadSettings(){
    try{ var s=JSON.parse(localStorage.getItem(SKEY)); if(s&&typeof s==='object'){ var d=defSettings(); for(var k in d) if(s[k]==null)s[k]=d[k]; return s; } }
    catch(e){}
    return defSettings();
  }
  function saveSettings(s){ try{ localStorage.setItem(SKEY,JSON.stringify(s)); }catch(e){} }
  function exists(){ try{ return !!localStorage.getItem(KEY); }catch(e){ return false; } }
  function save(state){
    try{
      var data={ver:VER,player:state.player,party:state.party,box:state.box,
        bag:state.bag,dex:state.dex,flags:state.flags,stats:state.stats};
      var str=JSON.stringify(data);
      var prev=localStorage.getItem(KEY);
      if(prev) localStorage.setItem(BAK,prev);
      localStorage.setItem(KEY,str);
      return true;
    }catch(e){ return false; }
  }
  function migrate(d){
    // 欠損補完 §15
    d.player=d.player||{}; var p=d.player;
    if(p.x==null)p.x=5; if(p.y==null)p.y=10; if(!p.area)p.area='A1';
    if(p.gem==null)p.gem=0; if(p.badges==null)p.badges=0;
    d.party=Array.isArray(d.party)?d.party:[];
    d.box=Array.isArray(d.box)?d.box:[];
    d.bag=d.bag||{potion:3,ball:5};
    d.dex=d.dex||{}; d.flags=d.flags||{};
    d.stats=d.stats||{playTime:0,caught:0,start:Date.now()};
    return d;
  }
  function tryParse(str){ try{ var d=JSON.parse(str); if(d&&typeof d==='object') return migrate(d); }catch(e){} return null; }
  function load(){
    var d=null;
    try{ d=tryParse(localStorage.getItem(KEY)); }catch(e){}
    if(!d){ try{ d=tryParse(localStorage.getItem(BAK)); }catch(e){} }
    return d; // null なら新規
  }
  function wipe(){ try{ localStorage.removeItem(KEY); localStorage.removeItem(BAK); }catch(e){} }
  return {save,load,exists,loadSettings,saveSettings,wipe,VER};
})();

/* ---------- 4. モンスター生成・成長計算 (§4/§6/§7) ---------- */
var Mon=(function(){
  function need(lv){ return Math.floor(Math.pow(lv,3)*0.8); }
  function statHP(base,lv){ return Math.floor(base*lv/50)+lv*2+10; }
  function stat(base,lv){ return Math.floor(base*lv/50)+lv+5; }
  function moveSetFor(sid,lv){
    var sp=DB.SPECIES[sid], ms=[];
    for(var i=0;i<sp.learn.length;i++){ if(sp.learn[i][0]<=lv) ms.push(sp.learn[i][1]); }
    if(ms.length===0) ms.push(sp.learn[0][1]);
    return ms; // 4個に制限せず、覚えている全ての技を返す
  }
  function ensureActive(m){
    if(!Array.isArray(m.active)) m.active=[];
    // 既知でない技は除外
    m.active=m.active.filter(function(id){ return m.moves.indexOf(id)>=0; });
    // 空きを末尾(新しい)から自動で埋める
    for(var i=m.moves.length-1;i>=0 && m.active.length<4;i--){
      if(m.active.indexOf(m.moves[i])<0) m.active.push(m.moves[i]);
    }
  }
  function setActive(m,arr){ // 任意の選択を設定（最大4）
    var pick=[]; for(var i=0;i<arr.length&&pick.length<4;i++){
      if(m.moves.indexOf(arr[i])>=0 && pick.indexOf(arr[i])<0) pick.push(arr[i]); }
    m.active=pick; if(m.active.length===0) ensureActive(m);
  }
  function toggleActive(m,id){
    if(m.moves.indexOf(id)<0) return false;
    var k=m.active.indexOf(id);
    if(k>=0){ if(m.active.length<=1) return false; m.active.splice(k,1); return true; }
    if(m.active.length>=4) return false;
    m.active.push(id); return true;
  }
  function create(sid,lv){
    sid=DB.SPECIES[sid]?sid:'sprig';
    lv=Math.max(1,Math.min(50,lv|0));
    var sp=DB.SPECIES[sid];
    var ms=moveSetFor(sid,lv);
    var m={sid:sid,lv:lv,exp:need(lv),moves:ms.slice(),active:ms.slice(-4),nick:null};
    m.maxhp=statHP(sp.base.hp,lv); m.hp=m.maxhp;
    recalc(m); m.hp=m.maxhp;
    return m;
  }
  function recalc(m){
    var sp=DB.SPECIES[m.sid];
    var oldMax=m.maxhp||0;
    m.maxhp=statHP(sp.base.hp,m.lv);
    m.atk=stat(sp.base.atk,m.lv);
    m.def=stat(sp.base.def,m.lv);
    m.spd=stat(sp.base.spd,m.lv);
    if(oldMax>0){ m.hp=Math.min(m.maxhp, m.hp + (m.maxhp-oldMax)); }
  }
  function name(m){ return m.nick || DB.SPECIES[m.sid].name; }
  function type(m){ return DB.SPECIES[m.sid].type; }
  // 経験値付与 → レベルアップ/技習得/進化 (戻り: イベント配列)
  function gainExp(m,amount){
    var ev=[];
    if(m.lv>=50){ return ev; }
    m.exp+=amount;
    while(m.lv<50 && m.exp>=need(m.lv+1)){
      m.lv++;
      recalc(m);
      ev.push({t:'lvup',lv:m.lv});
      var sp=DB.SPECIES[m.sid];
      for(var i=0;i<sp.learn.length;i++){
        if(sp.learn[i][0]===m.lv){
          var mv=sp.learn[i][1];
          if(m.moves.indexOf(mv)<0){
            m.moves.push(mv);
            if(!Array.isArray(m.active)) m.active=[];
            if(m.active.length<4 && m.active.indexOf(mv)<0) m.active.push(mv);
            ev.push({t:'learn',mv:mv});
          }
        }
      }
      if(sp.evolveLv && m.lv>=sp.evolveLv && DB.SPECIES[sp.evolveTo]){
        var from=sp.name; m.sid=sp.evolveTo; recalc(m);
        var ns=DB.SPECIES[m.sid];
        for(var j=0;j<ns.learn.length;j++){ if(ns.learn[j][0]<=m.lv && m.moves.indexOf(ns.learn[j][1])<0){
          m.moves.push(ns.learn[j][1]);
          if(m.active.length<4 && m.active.indexOf(ns.learn[j][1])<0) m.active.push(ns.learn[j][1]); } }
        ev.push({t:'evolve',from:from,to:ns.name});
        sp=ns;
      }
    }
    if(m.lv>=50) m.exp=need(50);
    return ev;
  }
  function expRatio(m){
    if(m.lv>=50) return 1;
    var lo=need(m.lv), hi=need(m.lv+1);
    return Math.max(0,Math.min(1,(m.exp-lo)/(hi-lo||1)));
  }
  return {create,recalc,name,type,gainExp,need,expRatio,moveSetFor,ensureActive,toggleActive,setActive};
})();

/* ---------- 5. ワールド/マップ生成 (§5) ---------- */
var World=(function(){
  var W=40,H=26,TS=32, MID=13;
  var TW=44,TH=30;
  var cache={};
  function isTown(a){ return (''+a).indexOf('TOWN_')===0; }
  function isHouse(a){ return (''+a).indexOf('HOUSE_')===0; }
  // 0地面 1壁 2草 3道/床 4前ゲート 5宿/泉(回復) 6出口 7木 8水 9街入口
  // 10建物 11店ドア 12宿ドア 13民家ドア 14店カウンター 15住人
  function gen(area){
    if(cache[area]) return cache[area];
    return (cache[area] = isHouse(area) ? genHouse(area)
                        : isTown(area)  ? genTown(area) : genField(area));
  }
  function genField(area){
    var def=DB.AREAS[area]||{pal:'#244a2c',name:area};
    var g=new Array(W*H);
    for(var y=0;y<H;y++)for(var x=0;x<W;x++)
      g[y*W+x]=(x===0||y===0||x===W-1||y===H-1)?1:0;
    function S(x,y,v){ if(x>0&&y>0&&x<W-1&&y<H-1) g[y*W+x]=v; }
    function G(x,y){ return (x<0||y<0||x>=W||y>=H)?1:g[y*W+x]; }
    function box(x0,y0,x1,y1,v,only){ for(var yy=y0;yy<=y1;yy++)for(var xx=x0;xx<=x1;xx++){
      if(only==null||G(xx,yy)===only) S(xx,yy,v); } }
    function blob(cx,cy,rx,ry,v){ for(var yy=cy-ry;yy<=cy+ry;yy++)for(var xx=cx-rx;xx<=cx+rx;xx++){
      var dx=(xx-cx)/(rx||1), dy=(yy-cy)/(ry||1); if(dx*dx+dy*dy<=1 && G(xx,yy)===0) S(xx,yy,v); } }

    var TX=19, TY=4, RX=27;
    // 1) 森（意図的なクラスタ）で全体を緑に
    var groves=[[6,4,4,3],[12,3,3,2],[33,5,4,3],[7,20,4,3],[31,19,5,4],
                [20,21,4,3],[3,12,2,4],[36,12,2,5],[24,11,3,3]];
    for(var i=0;i<groves.length;i++){ var gr=groves[i]; blob(gr[0],gr[1],gr[2],gr[3],7); }
    // 内側に並木の縁取り
    for(var x=1;x<W-1;x++){ S(x,1,7); S(x,H-2,7); }
    for(var y=1;y<H-1;y++){ S(1,y,7); S(W-2,y,7); }

    // 2) 川（縦・2マス幅）と湖
    for(var ry=1;ry<H-1;ry++){ S(RX,ry,8); S(RX+1,ry,8); }
    blob(11,19,4,3,8);          // 湖
    blob(11,19,2,1,0);          // 湖の小島

    // 3) 草むら（遭遇エリア）※水は侵さない（地面/木のみ草地化）
    function meadow(x0,y0,x1,y1){ for(var yy=y0;yy<=y1;yy++)for(var xx=x0;xx<=x1;xx++){
      var c=G(xx,yy); if(c===0||c===7) S(xx,yy,2); } }
    meadow(4,3,16,8); meadow(22,3,35,8);
    meadow(22,16,35,22); meadow(4,15,7,23); meadow(16,16,21,22);

    // 4) 道（土）— 最後に敷いて確実に繋ぐ
    box(2,MID,W-2,MID+1,3);            // 横断メイン
    box(TX,TY+1,TX+1,MID,3);           // 街への分岐
    box(12,15,12,MID,3); box(12,15,17,15,3); box(17,15,17,MID,3); // 湖をまわる散策路
    box(RX,MID,RX+1,MID+1,3);          // 橋
    box(2,MID-1,6,MID+1,3);            // 出発広場
    box(TX-1,TY-1,TX+2,TY+2,3);        // 街前広場
    box(W-5,MID-1,W-2,MID+1,3);        // ゲート前広場

    // 5) 施設
    S(4,MID,5);
    S(W-2,MID,4); S(W-2,MID+1,4);
    if(def.prev){ S(1,MID,6); S(1,MID+1,6); }
    S(TX,TY,9);

    // 6) 落ちアイテム（道沿い）
    var items=[], drops=def.drops||[];
    for(var di=0;di<drops.length;di++){
      var ix=7+Math.floor((W-12)*(di+1)/(drops.length+1)), iy=MID + (di%2?3:-3);
      box(ix-1,iy-1,ix+1,iy+1,3); items.push({x:ix,y:iy,key:drops[di][2],id:area+'_'+di});
    }
    var fth=FIELD_THEME[area]||FIELD_THEME.A1;
    return {w:W,h:H,grid:g,isTown:false,pal:fth.bg,name:def.name+'（'+fth.name+'）',
      theme:fth, start:{x:4,y:MID}, healAt:{x:4,y:MID}, gate:{x:W-2,y:MID},
      backGate:{x:1,y:MID}, town:{x:TX,y:TY}, items:items};
  }
  var FIELD_THEME={
    A1:{name:'草原',g1:'#4f9243',g2:'#468a3c',grass1:'#3f7a44',grass2:'#37703c',gblade:'#5fb255',
        water:'#3f86d6',tree:'#3f8c43',dirt1:'#8a6a42',dirt2:'#7e6038',cliff:'#5a6a4a',bg:'#3a6633'},
    A2:{name:'森',g1:'#3c7a38',g2:'#356f32',grass1:'#356b34',grass2:'#2e6030',gblade:'#4f9a47',
        water:'#3f7fb0',tree:'#2f6b34',dirt1:'#6f5a36',dirt2:'#62502f',cliff:'#4a5a3c',bg:'#274a2c'},
    A3:{name:'渓谷',g1:'#b5894a',g2:'#a87c40',grass1:'#9a8f3a',grass2:'#8c8233',gblade:'#b5a24a',
        water:'#c2532f',tree:'#7a6a34',dirt1:'#9a6a3a',dirt2:'#8a5e32',cliff:'#7a5230',bg:'#6a4a2a'},
    A4:{name:'雪原',g1:'#d8e6ef',g2:'#cddfe9',grass1:'#bcd0dc',grass2:'#b0c6d4',gblade:'#9ec0d2',
        water:'#7fb6e0',tree:'#8fb6c8',dirt1:'#b8c4cc',dirt2:'#aab8c2',cliff:'#9aabb6',bg:'#cfe0ea'},
    T :{name:'天空',g1:'#b9add8',g2:'#b0a3d0',grass1:'#9a86d0',grass2:'#8f7bc6',gblade:'#c0b2ee',
        water:'#7fb0e6',tree:'#9a86d0',dirt1:'#a99fc4',dirt2:'#9d93ba',cliff:'#8a7fb0',bg:'#b6a9d6'}
  };
  var TOWN_THEME={
    A1:{name:'草原',  g1:'#86c87c',g2:'#7cbf72',bg:'#a9dcb0',tree:'#3f8c43',prop:'flower',
        hcol:'#f3c66a',hroof:'#d4694a'},
    A2:{name:'森',    g1:'#5f9e57',g2:'#55963e',bg:'#7fae74',tree:'#2f6b34',prop:'pine',
        hcol:'#c7a06a',hroof:'#3f7a44'},
    A3:{name:'渓谷',  g1:'#cda05a',g2:'#c0934f',bg:'#d8b878',tree:'#8a6a3a',prop:'rock',
        hcol:'#d98a5a',hroof:'#a8442f'},
    A4:{name:'雪',    g1:'#dbe9f2',g2:'#cfe0ee',bg:'#e8f1f7',tree:'#8fb6c8',prop:'snow',
        hcol:'#bcd6e6',hroof:'#5f86a8'},
    T :{name:'天空',  g1:'#cdbfe6',g2:'#c2b4df',bg:'#ddd2ee',tree:'#9a86d0',prop:'crystal',
        hcol:'#e3ecf7',hroof:'#6f9fd0'}
  };
  function genTown(area){
    var base=area.slice(5), bd=DB.AREAS[base]||{name:base};
    var th=TOWN_THEME[base]||TOWN_THEME.A1;
    var g=new Array(TW*TH);
    for(var y=0;y<TH;y++)for(var x=0;x<TW;x++)
      g[y*TW+x]=(x===0||y===0||x===TW-1||y===TH-1)?1:0;
    function S(x,y,v){ if(x>0&&y>0&&x<TW-1&&y<TH-1) g[y*TW+x]=v; }
    function box(x0,y0,x1,y1,v){ for(var yy=y0;yy<=y1;yy++)for(var xx=x0;xx<=x1;xx++) S(xx,yy,v); }
    box(1,1,TW-2,TH-2,3);                       // 明るい広場
    function tint(hex,d){ var n=parseInt(hex.slice(1),16),
      r=Math.max(0,Math.min(255,(n>>16)+d)),gg=Math.max(0,Math.min(255,((n>>8)&255)+d)),
      b=Math.max(0,Math.min(255,(n&255)+d));
      return '#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1); }
    // 機能する家（入れる）
    var houses=[
      {x:4, y:3, w:9, h:6, kind:'shop', door:11, col:th.hcol, roof:th.hroof, name:'ショップ'},
      {x:16,y:3, w:9, h:6, kind:'inn',  door:12, col:tint(th.hcol,18), roof:tint(th.hroof,16), name:'やどや'},
      {x:29,y:3, w:8, h:6, kind:'home', door:13, col:tint(th.hcol,-22), roof:tint(th.hroof,-14), name:'みんかの家'}
    ];
    // 関係のない民家（装飾・入れない）
    var deco=[ {x:4,y:14,w:7,h:5},{x:33,y:14,w:7,h:5},
               {x:4,y:22,w:6,h:5},{x:34,y:22,w:6,h:5},{x:13,y:23,w:6,h:4} ];
    for(var dh=0;dh<deco.length;dh++){ var dd=deco[dh];
      houses.push({x:dd.x,y:dd.y,w:dd.w,h:dd.h,kind:'deco',deco:true,
        col:tint(th.hcol,(dh%2?-30:24)), roof:tint(th.hroof,(dh%2?20:-18)), name:'民家'}); }
    for(var i=0;i<houses.length;i++){ var hs=houses[i];
      box(hs.x,hs.y,hs.x+hs.w-1,hs.y+hs.h-1,10);
      hs.dx=hs.x+(hs.w>>1); hs.dy=hs.y+hs.h-1;
      if(!hs.deco){ S(hs.dx,hs.dy,hs.door); S(hs.dx,hs.dy+1,3); }
    }
    // テーマ装飾プロップ（非ブロック・描画のみ）
    var props=[];
    var pp=[[14,13],[30,13],[8,20],[36,20],[18,26],[27,26],[22,12]];
    for(var pi=0;pi<pp.length;pi++) props.push({x:pp[pi][0],y:pp[pi][1],kind:th.prop});
    S(Math.floor(TW/2),20,5);                     // 回復ステーション（近未来）
    var rivalX=Math.floor(TW/2), rivalY=15;
    var exitX=Math.floor(TW/2), exitY=TH-2;
    S(exitX,exitY,6); S(exitX,exitY-1,3); S(exitX,exitY-2,3);
    return {w:TW,h:TH,grid:g,isTown:true,base:base,pal:th.bg, theme:th,
      name:bd.name+'の街（'+th.name+')', start:{x:exitX,y:exitY-2},
      healAt:{x:Math.floor(TW/2),y:20}, rival:{x:rivalX,y:rivalY},
      exitAt:{x:exitX,y:exitY}, houses:houses, props:props};
  }
  function genHouse(area){
    // HOUSE_<base>_<kind>
    var us=area.indexOf('_',6), base=area.slice(6,us), kind=area.slice(us+1);
    var HW=17,HH=12;
    var g=new Array(HW*HH);
    for(var y=0;y<HH;y++)for(var x=0;x<HW;x++)
      g[y*HW+x]=(x===0||y===0||x===HW-1||y===HH-1)?1:3;  // 壁＋木の床
    function S(x,y,v){ if(x>=0&&y>=0&&x<HW&&y<HH) g[y*HW+x]=v; }
    var ex=HW>>1, ey=HH-1;
    S(ex,ey,6); S(ex,ey-1,3);                     // 出口（玄関マット）
    var fx=HW>>1, fy=3;
    if(kind==='shop'){ for(var cxx=4;cxx<=12;cxx++) S(cxx,4,10); S(fx,5,14); }      // カウンター＋応対位置
    else if(kind==='inn'){ S(4,3,5); S(12,3,5); }                                   // ベッド2台＝回復
    else { S(fx,3,15); }                                                            // 住人
    return {w:HW,h:HH,grid:g,isHouse:true,kind:kind,base:base,pal:'#caa472',
      name:(kind==='shop'?'ショップ':kind==='inn'?'やどや':'みんかの家'),
      start:{x:ex,y:ey-1}, exitAt:{x:ex,y:ey}};
  }
  function tile(map,x,y){ if(x<0||y<0||x>=map.w||y>=map.h) return 1; return map.grid[y*map.w+x]; }
  return {gen,tile,isTown,isHouse,W,H,TS};
})();

/* ---------- 6. ゲーム本体：状態・シーン・ループ (§14) ---------- */
var Game=(function(){
  var cv=document.getElementById('cv'), g=cv.getContext('2d');
  var SC={TITLE:'TITLE',FIELD:'FIELD',BATTLE:'BATTLE',MENU:'MENU',DIALOG:'DIALOG',END:'END',SHOP:'SHOP'};
  var state, settings, scene='TITLE', shake=0, fade=0, fadeDir=0, fadeCb=null;
  var toasts=[];
  var input={up:0,down:0,left:0,right:0,ok:0,cancel:0,menu:0,hud:0};
  var edge={ok:false,cancel:false,menu:false,up:false,down:false,left:false,right:false,hud:false};
  var keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
    KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
    KeyZ:'ok',Enter:'ok',Space:'ok',KeyX:'cancel',Escape:'cancel',KeyM:'menu'};

  /* ---- 入力 ---- */
  window.addEventListener('keydown',function(e){
    var k=keyMap[e.code];
    if(k){ if(!input[k]) edge[k]=true; input[k]=1; e.preventDefault(); Audio.resume(); }
  });
  window.addEventListener('keyup',function(e){ var k=keyMap[e.code]; if(k) input[k]=0; });
  function bindPad(id,key){
    var el=document.getElementById(id);
    function dn(ev){ ev.preventDefault(); if(!input[key])edge[key]=true; input[key]=1; Audio.resume(); }
    function up(ev){ ev.preventDefault(); input[key]=0; }
    el.addEventListener('touchstart',dn,{passive:false}); el.addEventListener('touchend',up);
    el.addEventListener('mousedown',dn); el.addEventListener('mouseup',up); el.addEventListener('mouseleave',up);
  }
  bindPad('u','up');bindPad('d','down');bindPad('l','left');bindPad('r','right');
  bindPad('bZ','ok');bindPad('bX','cancel');bindPad('bM','menu');

  /* ---- クリック操作：ゾーン登録＆ヒットテスト ---- */
  var zones=[]; // 毎フレーム描画時に再構築
  function zone(x,y,w,h,fn){ zones.push({x:x,y:y,w:w,h:h,fn:fn}); }
  function canvasPoint(ev){
    var r=cv.getBoundingClientRect();
    var cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
    var cy=(ev.touches?ev.touches[0].clientY:ev.clientY);
    return { x:(cx-r.left)/r.width*960, y:(cy-r.top)/r.height*640 };
  }
  function handlePointer(ev){
    Audio.resume();
    var p=canvasPoint(ev);
    // 仮想パッド領域(画面下)はパッド側で処理するため無視
    for(var i=zones.length-1;i>=0;i--){ var z=zones[i];
      if(p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h){
        ev.preventDefault(); z.fn(); return;
      }
    }
  }
  cv.addEventListener('mousedown',function(e){ if(e.button===2){ e.preventDefault(); edge.cancel=true; Audio.resume(); return; } handlePointer(e); });
  cv.addEventListener('contextmenu',function(e){ e.preventDefault(); edge.cancel=true; });
  cv.addEventListener('touchstart',function(e){ handlePointer(e); },{passive:false});
  // クリック＝「その項目を選んで決定」: 選択変数を設定後 edge.ok を立てる
  function pick(setSel){ if(setSel)setSel(); edge.ok=true; }
  function pickCancel(){ edge.cancel=true; }

  // ---- ポインタ状態（長押しドラッグ用） ----
  var ptr={down:false,x:0,y:0,sx:0,sy:0,t0:0,moved:false,up:false};
  function ptrMove(e){ var p=canvasPoint(e); ptr.x=p.x; ptr.y=p.y;
    if(ptr.down && Math.hypot(p.x-ptr.sx,p.y-ptr.sy)>8) ptr.moved=true; }
  function ptrDown(e){ if(e.button===2) return; var p=canvasPoint(e);
    ptr.down=true; ptr.x=ptr.sx=p.x; ptr.y=ptr.sy=p.y; ptr.t0=performance.now(); ptr.moved=false; }
  function ptrUp(){ if(ptr.down){ ptr.down=false; ptr.up=true; } }
  cv.addEventListener('mousedown',ptrDown);
  cv.addEventListener('mousemove',ptrMove);
  window.addEventListener('mouseup',ptrUp);
  cv.addEventListener('touchstart',function(e){ ptrDown(e.touches?{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY,touches:e.touches}:e); },{passive:false});
  cv.addEventListener('touchmove',function(e){ if(e.touches&&e.touches[0]){ ptrMove(e); } },{passive:false});
  window.addEventListener('touchend',ptrUp);

  /* ---- 画面フィット ---- */
  function resize(){
    var stg=document.getElementById('stage');
    var aw=window.innerWidth, ah=window.innerHeight, ar=960/640;
    var w=aw, h=aw/ar; if(h>ah){ h=ah; w=ah*ar; }
    stg.style.width=Math.floor(w)+'px'; stg.style.height=Math.floor(h)+'px';
  }
  window.addEventListener('resize',resize);

  /* ---- トースト (§9/§11) ---- */
  function toast(msg){ toasts.push({msg:msg,t:2500}); if(toasts.length>4) toasts.shift(); }

  /* ---- フェード遷移 (§11) ---- */
  function transition(cb){ fadeDir=1; fadeCb=cb; }

  /* ---- 新規/継続 ---- */
  function newGame(starterSid){
    var s0=World.gen('A1').start;
    state={
      player:{x:s0.x,y:s0.y,area:'A1',gem:0,badges:0,facing:'down',px:s0.x*32,py:s0.y*32,moving:false},
      party:[Mon.create(starterSid,5)],
      box:[], bag:{potion:3,spotion:0,hpotion:0,ball:5,sball:0,mball:0},

    };

  function continueGame(){
    var d=Save.load();
    if(!d){ return false; }
    state={ player:d.player, party:d.party, box:d.box, bag:d.bag,
      dex:d.dex, flags:d.flags, stats:d.stats, steps:0 };
    // 防御的補完
    if(!state.party.length) state.party=[Mon.create('sprig',5)];
    state.party.forEach(function(m){ if(m.maxhp==null) Mon.recalc(m); if(m.hp==null)m.hp=m.maxhp; Mon.ensureActive(m); });
    if(Array.isArray(state.box)) state.box.forEach(function(m){ if(m.maxhp==null) Mon.recalc(m); Mon.ensureActive(m); });
    // マップ刷新に伴う安全化：必ず現エリアの開始地点へ
    if(!DB.AREAS[state.player.area] && !World.isTown(state.player.area)) state.player.area='A1';
    var sm=World.gen(state.player.area);
    state.player.x=sm.start.x; state.player.y=sm.start.y;
    state.player.px=state.player.x*32; state.player.py=state.player.y*32; state.player.moving=false;
    return true;
  }

  function wrapText(t,cx,cy,maxw,lh){
    var words=t.split(''), line='', lines=[];
    for(var i=0;i<words.length;i++){ var test=line+words[i];
      if(g.measureText(test).width>maxw){ lines.push(line); line=words[i]; } else line=test; }
    lines.push(line);
    for(var j=0;j<lines.length;j++) g.fillText(lines[j],cx,cy+j*lh);
  }

  /* ===================== FIELD (§5) ===================== */
  var moveCool=0;
  function enterField(playBgm){
    transition(function(){
      scene=SC.FIELD;
      if(playBgm) Audio.playBgm('field');
    });
  }
  function curMap(){ return World.gen(state.player.area); }
  function canWalk(map,x,y){
    var t=World.tile(map,x,y);
    return t!==1 && t!==7 && t!==8 && t!==10; // 壁/木/川/建物は通行不可
  }
  function baseArea(a){
    var m=World.gen(a); if(m && m.base) return m.base;
    return World.isTown(a)? a.slice(5) : a;
  }
  function areaTrainers(){
    var a=state.player.area, mp=World.gen(a);
    if(World.isTown(a)){
      var base=mp.base, rv=DB.TRAINERS[base] && DB.TRAINERS[base][0];
      if(!rv) return [];
      var o={}; for(var k in rv) o[k]=rv[k];
      o.x=mp.rival.x; o.y=mp.rival.y; o.rival=true;
      return [o];
    }
    return []; // 野外/家にライバルは居ない（ライバルは街の広場）
  }
  function gateOpen(){
    var rv=DB.TRAINERS[baseArea(state.player.area)];
    rv=rv && rv[0];
    return rv? !!state.flags['beat_'+rv.id] : true;
  }
  function updateField(dt){
    var p=state.player, map=curMap();
    if(edge.menu){ Audio.se('ok'); scene=SC.MENU; menuInit(); return; }
    if(p.moving){
      var tx=p.x*32, ty=p.y*32, sp=16;
      if(p.px<tx)p.px=Math.min(tx,p.px+sp); else if(p.px>tx)p.px=Math.max(tx,p.px-sp);
      if(p.py<ty)p.py=Math.min(ty,p.py+sp); else if(p.py>ty)p.py=Math.max(ty,p.py-sp);
      if(p.px===tx&&p.py===ty){ p.moving=false; onStep(); }
      return;
    }
    if(edge.ok && World.tile(map,p.x,p.y)===14){ Audio.se('ok'); scene=SC.SHOP; shopInit(); return; }
    var dx=0,dy=0,f=p.facing;
    if(input.up){dy=-1;f='up';} else if(input.down){dy=1;f='down';}
    else if(input.left){dx=-1;f='left';} else if(input.right){dx=1;f='right';}
    if(dx||dy){
      p.facing=f;
      var nx=p.x+dx, ny=p.y+dy;
      // トレーナー接触判定
      var tr=trainerAt(nx,ny);
      if(tr){ startTrainerBattle(tr); return; }
      if(canWalk(map,nx,ny)){
        var t=World.tile(map,nx,ny);
        if(t===4 && !gateOpen()){
          toast('このゲートは関門を突破すると開く');
        } else {
          p.x=nx; p.y=ny; p.moving=true;
        }
      }
    }
  }
  function trainerAt(x,y){
    var list=areaTrainers();
    for(var i=0;i<list.length;i++){ var tr=list[i];
      if(tr.x===x&&tr.y===y && !state.flags['beat_'+tr.id]) return tr; }
    return null;
  }
  function onStep(){
    var p=state.player, map=curMap(), t=World.tile(map,p.x,p.y);
    state.stats.playTime=(Date.now()-(state.stats.start||Date.now()))/1000;
    if(t===5){ // 拠点：全回復＆オートセーブ
      var healed=false;
      state.party.forEach(function(m){ if(m.hp<m.maxhp){m.hp=m.maxhp;healed=true;} });
      if(healed){ Audio.se('heal'); toast('パーティを回復した'); }
      if(Save.save(state)) toast('オートセーブ完了');
      state.steps=0;
      return;
    }
    // 落ちているアイテム回収
    if(map.items){
      for(var ii=0;ii<map.items.length;ii++){ var it=map.items[ii];
        if(it.x===p.x && it.y===p.y && !state.flags['itm_'+it.id]){
          state.flags['itm_'+it.id]=true;
          state.bag[it.key]=(state.bag[it.key]||0)+1;
          Audio.se('lvup'); toast(DB.ITEMS[it.key].name+' を ひろった！');
          Save.save(state);
        }
      }
    }
    if(map.isHouse && t===6){ // 家を出る → 街へ
      transition(function(){
        var r=state._hret||{}, ta=r.area||('TOWN_'+map.base);
        p.area=ta; var tm=World.gen(ta);
        p.x=(r.x!=null?r.x:tm.start.x); p.y=(r.y!=null?r.y+1:tm.start.y);
        if(World.tile(tm,p.x,p.y)!==3){ p.x=tm.start.x; p.y=tm.start.y; }
        p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
        toast('家を 出た'); Save.save(state);
      });
      return;
    }
    if(map.isHouse && t===14){ Audio.se('ok'); scene=SC.SHOP; shopInit(); return; } // 店のカウンター
    if(map.isHouse && t===15){ // 住人（一度きりの贈り物）
      var fk='npc_'+map.base;
      if(!state.flags[fk]){ state.flags[fk]=true; state.bag.potion=(state.bag.potion||0)+2;
        Audio.se('lvup'); toast('住人：旅の おまもりに キズぐすりを 2こ どうぞ'); Save.save(state); }
      else { toast('住人：いい たびを！'); }
      return;
    }
    if(map.isTown && (t===11||t===12||t===13)){ // 家に入る
      var hk=(t===11?'shop':t===12?'inn':'home');
      transition(function(){
        state._hret={area:p.area,x:p.x,y:p.y};
        p.area='HOUSE_'+map.base+'_'+hk; var hm=World.gen(p.area);
        p.x=hm.start.x; p.y=hm.start.y; p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
        toast(hm.name+' に はいった'); Save.save(state);
      });
      return;
    }
    if(t===9){ // 街の入口 → 街へ
      transition(function(){
        var base=p.area; state._ret={area:base,x:p.x,y:p.y};
        p.area='TOWN_'+base; var tm=World.gen(p.area);
        p.x=tm.start.x; p.y=tm.start.y; p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
        toast((DB.AREAS[base]?DB.AREAS[base].name:base)+' の街に入った');
        Save.save(state);
      });
      return;
    }
    if(map.isTown && t===6){ // 街の出口 → 野外へ
      transition(function(){
        var r=state._ret||{area:p.area.slice(5)};
        p.area=r.area; var om=World.gen(p.area);
        var ex=om.town||{x:om.start.x,y:om.start.y};
        p.x=(r.x!=null?r.x:ex.x); p.y=Math.min(om.h-2,(r.y!=null?r.y:ex.y)+1);
        if(World.tile(om,p.x,p.y)!==0) p.y=(r.y!=null?r.y:ex.y)+1;
        p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
        toast('街を 出た'); Save.save(state);
      });
      return;
    }
    if(t===4 && !map.isTown){ // 前ゲート → 次エリア（ライバル撃破が必要）
      var def=DB.AREAS[p.area];
      if(def && def.next && gateOpen()){
        transition(function(){
          p.area=def.next; var nm=World.gen(p.area);
          p.x=3; p.y=nm.backGate.y; p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
          toast(DB.AREAS[p.area].name+' に到着');
          Save.save(state);
        });
      } else { toast('街の ライバルを たおすと ゲートが ひらく'); }
      return;
    }
    if(t===6 && !map.isTown){ // 戻りゲート → 前エリア（いつでも可）
      var def2=DB.AREAS[p.area];
      if(def2 && def2.prev){
        transition(function(){
          p.area=def2.prev; var pm=World.gen(p.area);
          p.x=pm.w-3; p.y=pm.gate.y; p.px=p.x*32; p.py=p.y*32; p.moving=false; state.steps=0;
          toast(DB.AREAS[p.area].name+' に もどった');
          Save.save(state);
        });
      }
      return;
    }
    if(t===2){ // 草：エンカウント抽選 §4
      state.steps++;
      var prob=Math.min(0.28, 0.10 + 0.01*state.steps);
      if(Math.random()<prob){ state.steps=0; startWildBattle(); }
    } else state.steps=0;
  }
  function drawField(){
    var p=state.player, map=curMap(), def=DB.AREAS[p.area]||{name:map.name,pal:map.pal};
    // カメラ
    var camx=Math.floor(p.px - 480 + 16), camy=Math.floor(p.py - 320 + 16);
    camx=Math.max(0,Math.min(camx, map.w*32-960));
    camy=Math.max(0,Math.min(camy, map.h*32-640));
    g.fillStyle = map.isHouse?'#c79b66' : map.isTown?(map.pal||'#a9dcb0') : '#3a6633';
    g.fillRect(0,0,960,640);
    var c0=Math.floor(camx/32), r0=Math.floor(camy/32);
    for(var ry=r0; ry<r0+21 && ry<map.h; ry++){
      for(var rx=c0; rx<c0+31 && rx<map.w; rx++){
        var t=World.tile(map,rx,ry), sx=rx*32-camx, sy=ry*32-camy;
        var FT=map.theme||null;
        function grassTile(){ // 野外の地面（エリアテーマ色）
          var a=FT?FT.g1:'#5fae57', b2=FT?FT.g2:'#56a44e';
          g.fillStyle=((rx+ry)&1)?a:b2; g.fillRect(sx,sy,32,32);
          var q=((rx*7+ry*13)%6);
          if(q===0){ g.fillStyle=FT?FT.gblade:'#73c267'; g.fillRect(sx+6,sy+9,3,7); g.fillRect(sx+10,sy+7,3,9); }
          else if(q===1){ g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(sx+20,sy+18,6,4); }
          else if(q===2){ g.fillStyle='rgba(0,0,0,.05)'; g.fillRect(sx+13,sy+21,6,4); } }
        function townFloor(){ // 街の地面（街テーマ色）＝家はこの上に出す
          var th=map.theme||{g1:'#86c87c',g2:'#7cbf72'};
          g.fillStyle=((rx+ry)&1)?th.g1:th.g2; g.fillRect(sx,sy,32,32);
          g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(sx+3,sy+3,26,2);
          var qq=(rx*5+ry*3)%7;
          if(qq===0 && th.prop==='flower'){ g.fillStyle='#ff8fb4'; g.fillRect(sx+22,sy+20,4,4); }
          else if(qq===1 && th.prop==='snow'){ g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(sx+8,sy+22,7,4); }
          else if(qq===2 && th.prop==='crystal'){ g.fillStyle='rgba(180,160,255,.30)'; g.fillRect(sx+18,sy+10,5,5); }
          else if(qq===3 && th.prop==='rock'){ g.fillStyle='rgba(0,0,0,.07)'; g.fillRect(sx+10,sy+18,8,4); } }
        function woodFloor(){ g.fillStyle=((ry)&1)?'#caa069':'#bd9560'; g.fillRect(sx,sy,32,32);
          g.fillStyle='rgba(90,60,30,.25)'; g.fillRect(sx,sy+15,32,2);
          g.fillStyle='rgba(255,255,255,.06)'; g.fillRect(sx,sy+1,32,3); }
        function baseTile(){ if(map.isHouse) woodFloor(); else if(map.isTown) townFloor(); else grassTile(); }
        if(t===1){
          if(map.isHouse){ g.fillStyle='#8a5f37'; g.fillRect(sx,sy,32,32);
            g.fillStyle='#744d2b'; g.fillRect(sx+2,sy+2,28,6); g.fillRect(sx+2,sy+12,28,6); g.fillRect(sx+2,sy+22,28,6); }
          else if(map.isTown){ g.fillStyle='#7d7a86'; g.fillRect(sx,sy,32,32);
            g.fillStyle='#6a6772'; g.fillRect(sx+3,sy+3,26,8); }
          else { g.fillStyle=FT?FT.cliff:'#5a6a4a'; g.fillRect(sx,sy,32,32);
            g.fillStyle='rgba(255,255,255,.10)'; g.fillRect(sx+3,sy+3,26,7); } }
        else if(t===10){ // 建物の足元＝普通のタイル（家はオーバーレイで前に描く）
          baseTile(); }
        else if(t===2){ var ga=FT?FT.grass1:'#3f7a44', gb=FT?FT.grass2:'#37703c';
          g.fillStyle=((rx+ry)&1)?ga:gb; g.fillRect(sx,sy,32,32);
          g.fillStyle=FT?FT.gblade:'#54a14f'; for(var b=0;b<4;b++) g.fillRect(sx+4+b*7,sy+17-(b%2)*4,4,13); }

  /* ===================== BATTLE (§4) ===================== */
  var B=null;
  function freshBattler(m){ return m; }
  function startWildBattle(){
    var def=DB.AREAS[state.player.area];
    var lv=def.wildLv[0]+Math.floor(Math.random()*(def.wildLv[1]-def.wildLv[0]+1));
    var sid=def.pool[Math.floor(Math.random()*def.pool.length)];
    setupBattle({wild:true, foe:[Mon.create(sid,lv)]});
  }
  function startTrainerBattle(tr){
    var party=tr.party.map(function(p){ return Mon.create(p[0],p[1]); });
    setupBattle({wild:false, foe:party, trainer:tr});
  }
  function firstAlive(party){ for(var i=0;i<party.length;i++) if(party[i].hp>0) return i; return -1; }
  function setupBattle(opt){
    var pi=firstAlive(state.party);
    if(pi<0){ blackout(); return; }
    B={ wild:opt.wild, trainer:opt.trainer||null, foeParty:opt.foe, foeIdx:0,
        pIdx:pi, msgQ:[], phase:'intro', sel:0, sub:0, anim:0,
        pHpShown:state.party[pi].hp, fHpShown:opt.foe[0].hp,
        catchShake:0, busy:0, popups:[], runTries:0, ended:false, expGiven:false, forceSwitch:false };
    Audio.playBgm(opt.trainer&&opt.trainer.boss?'boss':'battle');
    pushMsg(opt.wild? ('野生の '+Mon.name(opt.foe[0])+' があらわれた！')
      : (B.trainer.name+' が しょうぶを しかけてきた！'));
    transition(function(){ scene=SC.BATTLE; });
  }
  function pMon(){ return state.party[B.pIdx]; }
  function fMon(){ return B.foeParty[B.foeIdx]; }
  function pushMsg(t,cb){ B.msgQ.push({t:t,cb:cb||null}); }
  function popPopup(x,y,txt,col){ B.popups.push({x:x,y:y,t:txt,col:col||'#fff',life:60}); }

  // ダメージ計算 §4
  function calcDamage(att,dfn,move){
    var mv=DB.MOVES[move];
    if(mv.kind==='heal'||mv.kind==='buff') return {dmg:0,eff:1,crit:false,miss:false,mv:mv};
    if(Math.random()*100 > mv.acc) return {dmg:0,eff:1,crit:false,miss:true,mv:mv};
    var stab = (mv.type===Mon.type(att))?1.5:1;
    var te = DB.eff(mv.type, Mon.type(dfn));
    var crit = Math.random()<0.0625;
    var base = Math.floor(((2*att.lv/5+2)*mv.power*att.atk/Math.max(1,dfn.def))/50)+2;
    var dmg = Math.floor(base*stab*te*(0.90+Math.random()*0.10)*(crit?1.5:1));
    dmg=Math.max(1,dmg);
    return {dmg:dmg,eff:te,crit:crit,miss:false,mv:mv};
  }
  function aiChoose(){
    var f=fMon(), p=pMon();
    Mon.ensureActive(f);
    var pool=f.active.length?f.active:f.moves;
    if(f.hp < f.maxhp*0.25){
      for(var h=0;h<pool.length;h++) if(DB.MOVES[pool[h]].kind==='heal' && Math.random()<0.5) return pool[h];
    }
    if(Math.random()<0.8){
      var best=pool[0], bv=-1;
      for(var i=0;i<pool.length;i++){ var mv=DB.MOVES[pool[i]];
        if(mv.kind!=='atk'&&mv.kind!=='drain') continue;
        var v=mv.power * (mv.type===Mon.type(f)?1.5:1) * DB.eff(mv.type,Mon.type(p));
        if(v>bv){ bv=v; best=pool[i]; } }
      return best;
    }
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function tryCatch(ballMul){
    var f=fMon(), sp=DB.SPECIES[f.sid];
    var a=Math.floor((3*f.maxhp-2*f.hp)*sp.cap*ballMul/(3*f.maxhp));
    a=Math.max(1,Math.min(255,a));
    if(ballMul>=255) return 4; // master
    var shakes=0;
    for(var s=0;s<4;s++){ if(Math.random() < a/255) shakes++; else break; }
    return shakes;
  }
  function expFor(foe){ return Math.floor(DB.SPECIES[foe.sid].exp * foe.lv / 7); }

  function battleVictory(){
    if(B.ended) return; B.ended=true;
    // EXP付与（生存メンバー全員に均等寄与：簡略=戦闘参加者）
    var foe=B.lastFoe||fMon();
    var gain=expFor(foe);
    var alive=state.party.filter(function(m){return m.hp>0;});
    var per=Math.max(1,Math.floor(gain/Math.max(1,alive.length)));
    var msgs=[];
    alive.forEach(function(m){
      var ev=Mon.gainExp(m,per);
      ev.forEach(function(e){
        if(e.t==='lvup') msgs.push(Mon.name(m)+' は レベル '+e.lv+' に あがった！');
        else if(e.t==='learn') msgs.push(Mon.name(m)+' は '+DB.MOVES[e.mv].name+' を おぼえた！'+(e.replaced?'('+DB.MOVES[e.replaced].name+'を忘れた)':''));
        else if(e.t==='evolve'){ msgs.push(e.from+' は '+e.to+' に しんかした！'); state.dex[m.sid]=true; }
      });
    });
    var gem = foe.lv*6 + Math.floor(Math.random()*11);
    if(B.trainer){ gem = B.trainer.reward; }
    state.player.gem += gem;
    pushMsg((B.trainer?B.trainer.name+' に かった！':'戦闘に かった！'));
    pushMsg(Mon.name(alive[0]||state.party[0])+' たちは '+per+' の けいけんちを えた！');
    for(var i=0;i<msgs.length;i++) pushMsg(msgs[i]);
    pushMsg(gem+' ジェムを てにいれた！',function(){ Audio.se('lvup'); });
    if(B.trainer){
      state.flags['beat_'+B.trainer.id]=true;
      if(B.trainer.badge && B.trainer.badge<=4){
        state.player.badges=Math.max(state.player.badges,B.trainer.badge);
        pushMsg('バッジ '+B.trainer.badge+' を かくとく！ あたらしいエリアへの ゲートが ひらいた！');
      }
      if(B.trainer.boss){
        pushMsg('監督者ヴァロンを とめた！ せかいに へいわが もどった…',function(){ endingTrigger(); });
      }
      Save.save(state);
    }
    B.phase='msg'; B.afterMsg='end';
  }
  function battleDefeatNext(){
    // 自分の手持ち交代 or 全滅
    var aliveN=0, ni=-1;
    for(var i=0;i<state.party.length;i++){ if(state.party[i].hp>0){ aliveN++; if(ni<0)ni=i; } }
    if(ni<0){ pushMsg('めの まえが まっくらに なった…',function(){ blackout(); }); B.phase='msg'; B.afterMsg='lose'; }
    else if(aliveN===1){ // 選択の余地なし→自動
      B.pIdx=ni; B.pHpShown=state.party[ni].hp;
      pushMsg('がんばれ！ '+Mon.name(state.party[ni])+'！'); B.phase='msg'; B.afterMsg='menu';
    } else { // 次に出すエレモンを選択させる
      pushMsg('つぎの エレモンを えらんで！'); B.phase='msg'; B.afterMsg='forceswitch';
    }
  }
  function foeDefeated(){
    B.lastFoe=fMon();
    Audio.se('faint');
    pushMsg(Mon.name(fMon())+' は たおれた！');
    if(B.wild){ B.phase='msg'; B.afterMsg='victory'; return; }
    // トレーナー：次のエレモン
    var next=-1;
    for(var i=B.foeIdx+1;i<B.foeParty.length;i++){ if(B.foeParty[i].hp>0){ next=i; break; } }
    if(next<0){ B.phase='msg'; B.afterMsg='victory'; }
    else { B.foeIdx=next; B.fHpShown=fMon().hp;
      pushMsg(B.trainer.name+' は '+Mon.name(fMon())+' を くりだした！'); B.phase='msg'; B.afterMsg='menu'; }
  }
  function blackout(){
    Audio.stopBgm();
    // 全滅救済 §5/§8
    state.party.forEach(function(m){ m.hp=m.maxhp; });
    var lost=Math.floor(state.player.gem*0.10);
    state.player.gem-=lost;
    state.player.area = state.player.area; // 現エリアの開始地点へ
    var mp=World.gen(state.player.area);
    state.player.x=mp.start.x; state.player.y=mp.start.y;
    state.player.px=state.player.x*32; state.player.py=state.player.y*32; state.player.moving=false;
    // 救済薬 §8
    var totalHeal=(state.bag.potion||0)+(state.bag.spotion||0)+(state.bag.hpotion||0);
    if(state.player.gem<30 && totalHeal===0){ state.bag.potion=(state.bag.potion||0)+1; toast('支援薬を うけとった'); }
    Save.save(state);
    B=null;
    transition(function(){ scene=SC.FIELD; Audio.playBgm('field');
      toast('拠点で めをさました（'+lost+'ジェム ロスト）'); });
  }

  // 戦闘アクション解決
  function resolveTurn(playerMove){
    var p=pMon(), f=fMon();
    var foeMove=aiChoose();
    var pFirst = p.spd>=f.spd;
    var order = pFirst ? [['p',playerMove],['f',foeMove]] : [['f',foeMove],['p',playerMove]];
    B.turnQ=[];
    order.forEach(function(o){
      B.turnQ.push(o);
    });
    B.execI=0;
    execStep(); // ターン解決を開始（exec→msg→exec ループ）
  }
  function doAction(side,move){
    var att = side==='p'?pMon():fMon();
    var dfn = side==='p'?fMon():pMon();
    if(att.hp<=0) return; // 既に倒れている
    var mv=DB.MOVES[move];
    if(mv.kind==='heal'){
      var h=Math.floor(att.maxhp*0.5); att.hp=Math.min(att.maxhp,att.hp+h);
      Audio.se('heal'); pushMsg(Mon.name(att)+' は たいりょくを かいふくした！');
      return;
    }
    if(mv.kind==='buff'){ pushMsg(Mon.name(att)+' は みを かためた！'); return; }
    var r=calcDamage(att,dfn,move);
    if(r.miss){ pushMsg(Mon.name(att)+' の '+mv.name+'！ しかし はずれた！'); return; }
    dfn.hp=Math.max(0,dfn.hp-r.dmg);
    Audio.se(r.crit?'crit':'hit');
    if(settings.shake) shake=10;
    var px = side==='p'? 720:240, py = side==='p'? 170:380;
    popPopup(px,py,'-'+r.dmg, r.eff>1?'#ffd86b':(r.eff<1?'#9aa4c4':'#fff'));
    var line=Mon.name(att)+' の '+mv.name+'！';
    if(r.crit) line+=' きゅうしょに あたった！';
    if(r.eff>1) line+=' こうかは ばつぐんだ！';
    else if(r.eff<1) line+=' こうかは いまひとつ…';
    pushMsg(line);
    if(mv.kind==='drain'){ var heal=Math.floor(r.dmg*0.5); att.hp=Math.min(att.maxhp,att.hp+heal);
      pushMsg(Mon.name(att)+' は たいりょくを すいとった！'); }
  }
  function execStep(){
    if(B.execI>=B.turnQ.length){
      // ターン終了：倒れ判定
      if(fMon().hp<=0){ foeDefeated(); return; }
      if(pMon().hp<=0){ Audio.se('faint'); pushMsg(Mon.name(pMon())+' は たおれた！'); B.phase='msg'; B.afterMsg='defeat'; return; }
      B.phase='menu'; B.sel=0; return;
    }
    var o=B.turnQ[B.execI++];
    var moverMon = o[0]==='p'?pMon():fMon();
    if(moverMon.hp<=0){ execStep(); return; }
    doAction(o[0],o[1]);
    // メッセージ送り後に次stepへ
    B.phase='msg'; B.afterMsg='exec';
  }

  // 2Dグリッド移動：←→で列、↑↓で行（レイアウトに一致）
  function gridMove(idx,count,cols){
    if(count<=0) return 0;
    idx=Math.max(0,Math.min(count-1,idx));
    var rows=Math.ceil(count/cols), r=Math.floor(idx/cols), c=idx%cols, moved=false;
    if(edge.left){ c=(c-1+cols)%cols; moved=true; }
    else if(edge.right){ c=(c+1)%cols; moved=true; }
    if(edge.up){ r=(r-1+rows)%rows; moved=true; }
    else if(edge.down){ r=(r+1)%rows; moved=true; }
    var ni=r*cols+c;
    if(ni>=count) ni=count-1;
    if(moved && ni!==idx) Audio.se('ok');
    return ni;
  }
  function updateBattle(){
    if(!B){ scene=SC.FIELD; return; }
    // HPバー補間
    B.pHpShown += (pMon().hp - B.pHpShown)*0.25;
    B.fHpShown += (fMon().hp - B.fHpShown)*0.25;
    if(Math.abs(B.pHpShown-pMon().hp)<0.5) B.pHpShown=pMon().hp;
    if(Math.abs(B.fHpShown-fMon().hp)<0.5) B.fHpShown=fMon().hp;
    for(var i=B.popups.length-1;i>=0;i--){ B.popups[i].y-=0.7; if(--B.popups[i].life<=0) B.popups.splice(i,1); }

    if(B.phase==='intro'){
      if(B.msgQ.length){ if(edge.ok||edge.cancel){ Audio.se('ok'); B.msgQ.shift(); } }
      else { B.phase='menu'; B.sel=0; }
      return;
    }
    if(B.phase==='msg'){
      if(B.msgQ.length){
        if(edge.ok||edge.cancel){ var m=B.msgQ.shift(); Audio.se('ok'); if(m.cb)m.cb(); }
        return;
      }
      // メッセージ枯渇 → afterMsg遷移
      var a=B.afterMsg; B.afterMsg=null;
      if(a==='exec') execStep();
      else if(a==='menu'){ B.phase='menu'; B.sel=0; }
      else if(a==='victory') battleVictory();
      else if(a==='defeat') battleDefeatNext();
      else if(a==='end'){ endBattle(); }
      else if(a==='lose'){ /* blackout cb 済 */ }
      else if(a==='catchok'){ finishCatch(); }
      else if(a==='forceswitch'){ B.phase='switch'; B.forceSwitch=true; B.sub=firstAlive(state.party); B.sel=0; }
      else { B.phase='menu'; B.sel=0; }
      return;
    }
    if(B.phase==='menu'){
      B.sel=gridMove(B.sel,5,3);
      if(edge.ok){
        Audio.se('ok');
        if(B.sel===0){ B.phase='move'; B.sub=0; }
        else if(B.sel===1){ B.phase='switch'; B.sub=0; }
        else if(B.sel===2){ B.phase='item'; B.sub=0; }
        else if(B.sel===3){ attemptCatch(); }
        else if(B.sel===4){ attemptRun(); }
      }
      return;
    }
    if(B.phase==='move'){
      Mon.ensureActive(pMon());
      var mv=pMon().active;
      B.sub=gridMove(B.sub,mv.length,2);
      if(edge.cancel){ Audio.se('cancel'); B.phase='menu'; }
      if(edge.ok){ Audio.se('ok'); var chosen=mv[B.sub]; resolveTurn(chosen); }
      return;
    }
    if(B.phase==='switch'){
      var pr=state.party;
      B.sub=gridMove(B.sub,pr.length,3);
      if(edge.cancel){
        if(B.forceSwitch){ toast('えらばないと たたかえない'); }
        else { Audio.se('cancel'); B.phase='menu'; }
      }
      if(edge.ok){
        if(B.sub===B.pIdx && !B.forceSwitch){ toast('すでに せんとうちゅう'); }
        else if(pr[B.sub].hp<=0){ toast('そのエレモンは たたかえない'); }
        else if(B.forceSwitch){ // 戦闘不能後の交代：敵の追加行動なし
          Audio.se('ok'); B.forceSwitch=false; B.pIdx=B.sub; B.pHpShown=pMon().hp;
          pushMsg('いけ！ '+Mon.name(pMon())+'！'); B.phase='msg'; B.afterMsg='menu';
        }
        else { Audio.se('ok'); B.pIdx=B.sub; B.pHpShown=pMon().hp;
          pushMsg('いけ！ '+Mon.name(pMon())+'！');
          // 通常の交代は1ターン消費 → 敵行動
          var fm=aiChoose(); B.turnQ=[['f',fm]]; B.phase='msg';
          B.execI=0; B.afterMsg='exec';
        }
      }
      return;
    }
    if(B.phase==='item'){
      var keys=Object.keys(state.bag).filter(function(k){ return state.bag[k]>0; });
      if(keys.length===0){ if(edge.ok||edge.cancel){ Audio.se('cancel'); B.phase='menu'; } B._itemKeys=[]; return; }
      B._itemKeys=keys;
      B.sub=gridMove(B.sub,keys.length,2);
      if(edge.cancel){ Audio.se('cancel'); B.phase='menu'; }
      if(edge.ok){
        var key=keys[B.sub], it=DB.ITEMS[key];
        Audio.se('ok');
        if(it.kind==='heal'){
          var t=pMon();
          if(t.hp>=t.maxhp){ toast('HPは まんたん'); return; }
          t.hp=Math.min(t.maxhp,t.hp+it.value); state.bag[key]--;
          Audio.se('heal'); pushMsg(it.name+' で '+Mon.name(t)+' を かいふくした！');
          var fm2=aiChoose(); B.turnQ=[['f',fm2]]; B.execI=0; B.phase='msg'; B.afterMsg='exec';
        } else if(it.kind==='ball'){
          if(!B.wild){ toast('トレーナーの エレモンは つかまえられない'); return; }
          state.bag[key]--; doCatch(it.mul);
        }
      }
      return;
    }
    if(B.phase==='exec'){ execStep(); return; }
    if(B.phase==='catch'){
      // シェイク演出
      B.catchShake++;
      if(B.catchShake>50){
        if(B.catchResult>=4){ Audio.se('catch'); finishCatch(); }
        else { pushMsg(Mon.name(fMon())+' は ボールから でてしまった！（'+B.catchResult+'回 ゆれた）');
          var fm3=aiChoose(); B.turnQ=[['f',fm3]]; B.execI=0; B.phase='msg'; B.afterMsg='exec'; }
      }
      return;
    }
  }
  function attemptCatch(){
    if(!B.wild){ toast('トレーナーの エレモンは つかまえられない'); B.phase='menu'; return; }
    var balls=['ball','sball','mball'].filter(function(k){return state.bag[k]>0;});
    if(balls.length===0){ pushMsg('ボールを もっていない！'); B.phase='msg'; B.afterMsg='menu'; return; }
    // どうぐ画面のボールへ誘導
    B.phase='item'; B.sub=0;
    toast('「どうぐ」から ボールを えらぼう');
  }
  function doCatch(mul){
    B.msgQ=[];
    B.catchResult=tryCatch(mul);
    B.catchShake=0; B.phase='catch';
    Audio.se('ok');
  }
  function finishCatch(){
    var f=fMon();
    var caught=Mon.create(f.sid,f.lv); caught.hp=f.hp; caught.exp=f.exp; caught.moves=f.moves.slice();
    caught.active=(f.active||[]).slice(); Mon.ensureActive(caught);
    caught.met={area:state.player.area, lv:f.lv, when:Date.now()};
    var firstTime=!state.dex[f.sid];
    state.dex[f.sid]=true; state.stats.caught=(state.stats.caught||0)+1;
    if(state.party.length<6) state.party.push(caught); else state.box.push(caught);
    pushMsg(Mon.name(f)+' を つかまえた！'+(firstTime?' 図鑑に とうろくした！':''));
    if(state.party.length>=7 || state.box.length>0) pushMsg('（控えボックスに あずけた）');
    B.phase='msg'; B.afterMsg='end';
    Save.save(state);
  }
  function attemptRun(){
    if(!B.wild){ toast('トレーナー戦からは にげられない'); B.phase='menu'; return; }
    B.runTries++;
    var p=pMon(), f=fMon();
    var chance = p.spd>=f.spd ? 1 : 0.5 + 0.15*B.runTries;
    if(Math.random()<chance){ pushMsg('うまく にげきれた！',function(){ endBattle(); }); B.phase='msg'; B.afterMsg='wait'; }
    else { pushMsg('にげられなかった！');
      var fm=aiChoose(); B.turnQ=[['f',fm]]; B.execI=0; B.phase='msg'; B.afterMsg='exec'; }
  }
  function endBattle(){
    B=null;
    transition(function(){ scene=SC.FIELD; Audio.playBgm('field'); });
  }

  /* ===================== MENU (§9) ===================== */
  var menu={page:'root',sel:0,sub:0,lift:null,dragPtr:false,boxScroll:0,boxAct:null,statsFor:null,releaseFor:null};
  function menuInit(){ menu.page='root'; menu.sel=0; menu.sub=0; menu.lift=null; menu.dragPtr=false; menu.boxScroll=0;
    menu.boxAct=null; menu.statsFor=null; menu.releaseFor=null; }

  // ===== ボックス画面：スロット配置＆入替ロジック =====
  var BOX_COLS=6, BOX_VROWS=2;
  function partyRect(i){ return {x:150+i*108, y:152, w:100, h:96}; }
  function boxRect(vis){ var c=vis%BOX_COLS, rw=Math.floor(vis/BOX_COLS);
    return {x:150+c*108, y:300+rw*104, w:100, h:96}; }
  function boxTotalRows(){ return Math.ceil(state.box.length/BOX_COLS); }
  function boxMaxScroll(){ return Math.max(0, boxTotalRows()-BOX_VROWS); }
  function inRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
  // 画面座標→スロット参照（party/box/empty）
  function boxSlotAt(x,y){
    for(var i=0;i<6;i++){ if(inRect(x,y,partyRect(i)))
      return {kind:'party',idx:i,empty:i>=state.party.length}; }
    for(var v=0;v<BOX_COLS*BOX_VROWS;v++){ var abs=menu.boxScroll*BOX_COLS+v;
      if(inRect(x,y,boxRect(v))) return {kind:'box',idx:abs,empty:abs>=state.box.length}; }
    if(x>=150&&x<=790&&y>=296&&y<=296+BOX_VROWS*104) return {kind:'box',idx:-1,empty:true};
    return null;
  }
  function boxMonOf(s){ if(!s)return null;
    return s.kind==='party'?(state.party[s.idx]||null):(s.idx>=0?state.box[s.idx]:null); }
  // 入替/移動。src・dst はスロット参照
  function boxApply(src,dst){
    if(!src||!dst) return false;
    var P=state.party, X=state.box;
    if(src.kind===dst.kind && src.idx===dst.idx) return false;
    if(src.kind==='party' && dst.kind==='party'){
      if(dst.idx<P.length){ var t=P[src.idx]; P[src.idx]=P[dst.idx]; P[dst.idx]=t;
        toast('パーティの じゅんばんを いれかえた'); return true; }
      return false;
    }
    if(src.kind==='party' && dst.kind==='box'){
      if(dst.idx>=0 && dst.idx<X.length){ var a=P[src.idx]; P[src.idx]=X[dst.idx]; X[dst.idx]=a;
        toast(Mon.name(P[src.idx])+' ⇔ '+Mon.name(X[dst.idx])+' を いれかえた'); return true; }
      if(P.length>1){ var dep=P.splice(src.idx,1)[0]; X.push(dep);
        toast(Mon.name(dep)+' を ボックスに あずけた'); return true; }
      toast('パーティを 0匹には できない'); return false;
    }
    if(src.kind==='box' && dst.kind==='party'){
      if(dst.idx<P.length){ var b=X[src.idx]; X[src.idx]=P[dst.idx]; P[dst.idx]=b;
        toast(Mon.name(P[dst.idx])+' ⇔ '+Mon.name(X[src.idx])+' を いれかえた'); return true; }
      if(P.length<6){ var mv=X.splice(src.idx,1)[0]; P.push(mv);
        toast(Mon.name(mv)+' を パーティに いれた'); return true; }
      toast('パーティが いっぱい'); return false;
    }
    if(src.kind==='box' && dst.kind==='box'){
      if(dst.idx>=0 && dst.idx<X.length){ var c=X[src.idx]; X[src.idx]=X[dst.idx]; X[dst.idx]=c;
        toast('ボックスの ばしょを いれかえた'); return true; }
      return false;
    }
    return false;
  }
  function updateMenu(){
    if(menu.page==='root'){
      var items=['パーティ','ボックス','どうぐ','ずかん','せってい','セーブ','とじる'];
      if(edge.down){menu.sel=(menu.sel+1)%items.length;Audio.se('ok');}
      if(edge.up){menu.sel=(menu.sel+items.length-1)%items.length;Audio.se('ok');}
      if(edge.cancel||edge.menu){ Audio.se('cancel'); scene=SC.FIELD; return; }
      if(edge.ok){ Audio.se('ok');
        if(menu.sel===0){menu.page='party';menu.sub=0;}
        else if(menu.sel===1){menu.page='box';menu.sub=0;menu.lift=null;menu.dragPtr=false;menu.boxScroll=0;menu.boxAct=null;menu.statsFor=null;menu.releaseFor=null;}
        else if(menu.sel===2){menu.page='bag';menu.sub=0;}
        else if(menu.sel===3){menu.page='dex';menu.sub=0;}
        else if(menu.sel===4){menu.page='set';menu.sub=0;}
        else if(menu.sel===5){ if(Save.save(state)) toast('セーブしました'); else toast('セーブ失敗'); }
        else { scene=SC.FIELD; }
      }
      return;
    }
    if(menu.page==='box' && edge.cancel){
      if(menu.releaseFor){ menu.releaseFor=null; Audio.se('cancel'); return; }
      if(menu.statsFor){ menu.statsFor=null; Audio.se('cancel'); return; }
      if(menu.boxAct){ menu.boxAct=null; Audio.se('cancel'); return; }
      if(menu.lift){ menu.lift=null; menu.dragPtr=false; Audio.se('cancel'); return; }
    }
    if(edge.cancel){ Audio.se('cancel'); menu.page='root'; return; }
    if(menu.page==='party'){
      var n=state.party.length;
      if(edge.down){menu.sub=(menu.sub+1)%n;Audio.se('ok');}
      if(edge.up){menu.sub=(menu.sub+n-1)%n;Audio.se('ok');}
      if(edge.ok && n>1){ // 先頭と入替
        Audio.se('ok'); var t=state.party[0]; state.party[0]=state.party[menu.sub]; state.party[menu.sub]=t; menu.sub=0;
        toast('せんとうを いれかえた');
      }
    } else if(menu.page==='box'){
      // フラット選択列：party 0..5, box 0..(len-1)
      var pc=6, flat=pc+state.box.length;
      function flatSlot(k){ return k<pc ? {kind:'party',idx:k,empty:k>=state.party.length}
        : {kind:'box',idx:k-pc,empty:false}; }
      function ensureBoxVisible(absIdx){ var rw=Math.floor(absIdx/BOX_COLS);
        if(rw<menu.boxScroll) menu.boxScroll=rw;
        else if(rw>menu.boxScroll+BOX_VROWS-1) menu.boxScroll=rw-BOX_VROWS+1;
        menu.boxScroll=Math.max(0,Math.min(boxMaxScroll(),menu.boxScroll)); }

      // ===== 解放確認オーバーレイ =====
      if(menu.releaseFor){
        if(edge.left||edge.right){ menu.releaseFor.sel=(menu.releaseFor.sel||0)?0:1; Audio.se('ok'); }
        if(edge.ok){
          if((menu.releaseFor.sel||0)===0){ // はい
            var rs=menu.releaseFor.slot, target=boxMonOf(rs);
            if(target){ var nm=Mon.name(target);
              if(rs.kind==='box') state.box.splice(rs.idx,1);
              else if(rs.kind==='party' && state.party.length>1) state.party.splice(rs.idx,1);
              else { toast('パーティを 0匹には できない'); menu.releaseFor=null; return; }
              Audio.se('faint'); toast(nm+' を にがした…'); Save.save(state);
              menu.lift=null; menu.dragPtr=false;
              var nf=pc+state.box.length; if(menu.sub>=nf) menu.sub=Math.max(0,nf-1);
            }
          } else { Audio.se('cancel'); }
          menu.releaseFor=null;
        }
        return;
      }
      // ===== 強さを見る（3画面）=====
      if(menu.statsFor){
        var sM2=boxMonOf(menu.statsFor.slot);
        if(edge.left){ menu.statsFor.page=(menu.statsFor.page+2)%3; menu.statsFor.row=0; Audio.se('ok'); }
        if(edge.right){ menu.statsFor.page=(menu.statsFor.page+1)%3; menu.statsFor.row=0; Audio.se('ok'); }
        if(menu.statsFor.page===1 && sM2){
          var n=sM2.moves.length;
          if(menu.statsFor.row==null) menu.statsFor.row=0;
          if(edge.up){ menu.statsFor.row=Math.max(0,menu.statsFor.row-1); Audio.se('ok'); }
          if(edge.down){ menu.statsFor.row=Math.min(n-1,menu.statsFor.row+1); Audio.se('ok'); }
          if(edge.ok){ var id=sM2.moves[menu.statsFor.row];
            if(Mon.toggleActive(sM2,id)){ Audio.se('lvup'); Save.save(state); }
            else { Audio.se('cancel'); toast('変更できない（最低1つ・最大4つ）'); }
          }
        } else if(edge.ok){ menu.statsFor=null; Audio.se('cancel'); }
        return;
      }
      // ===== アクションポップアップ =====
      if(menu.boxAct){
        var acts=['移動','強さを見る','逃がす'];
        if(edge.up){ menu.boxAct.sel=(menu.boxAct.sel+2)%3; Audio.se('ok'); }
        if(edge.down){ menu.boxAct.sel=(menu.boxAct.sel+1)%3; Audio.se('ok'); }
        if(edge.ok){
          var sl=menu.boxAct.slot, sel=menu.boxAct.sel;
          menu.boxAct=null; Audio.se('ok');
          if(sel===0){ // 移動：そのキャラを持ち上げ（キーボード移動→Zで設置）
            if(boxMonOf(sl)){ menu.lift=sl; menu.dragPtr=false;
              var ax=sl.kind==='party'?sl.idx:(pc+sl.idx); menu.sub=ax;
              toast('置きたい場所で 決定（X でキャンセル）'); }
          } else if(sel===1){ // 強さを見る
            menu.statsFor={slot:sl,page:0};
          } else { // 逃がす
            menu.releaseFor={slot:sl,sel:1}; // 既定はキャンセル(いいえ)
          }
        }
        return;
      }

      // キーボード移動
      if(!menu.dragPtr){
        if(edge.left){ menu.sub=Math.max(0,menu.sub-1); Audio.se('ok'); }
        if(edge.right){ menu.sub=Math.min(flat-1,menu.sub+1); Audio.se('ok'); }
        if(edge.up){ menu.sub=Math.max(0,menu.sub-BOX_COLS); Audio.se('ok'); }
        if(edge.down){ menu.sub=Math.min(flat-1,menu.sub+BOX_COLS); Audio.se('ok'); }
        menu.sub=Math.max(0,Math.min(flat-1,menu.sub));
        if(menu.sub>=pc) ensureBoxVisible(menu.sub-pc);
      }
      // 決定：持ち上げ中なら設置／そうでなければアクションを開く
      if(edge.ok && !menu.dragPtr){
        var s0=flatSlot(menu.sub);
        if(menu.lift){ if(boxApply(menu.lift,s0)){ Save.save(state); Audio.se('lvup'); }
          menu.lift=null; }
        else if(boxMonOf(s0)){ menu.boxAct={slot:s0,sel:0}; Audio.se('ok'); }
      }
      // ポインタ：長押し→ドラッグ持ち上げ、短押し→アクションを開く
      if(menu.lift && menu.dragPtr){
        if(ptr.up){ var tgt=boxSlotAt(ptr.x,ptr.y);
          if(boxApply(menu.lift,tgt)){ Save.save(state); Audio.se('lvup'); }
          else Audio.se('cancel');
          menu.lift=null; menu.dragPtr=false; ptr.up=false; }
      } else if(!menu.lift){
        if(ptr.down && (performance.now()-ptr.t0)>240){
          var gs=boxSlotAt(ptr.sx,ptr.sy);
          if(gs && boxMonOf(gs)){ menu.lift=gs; menu.dragPtr=true; Audio.se('ok'); }
        }
        if(ptr.up){
          var dx=ptr.x-ptr.sx, dy=ptr.y-ptr.sy;
          if((performance.now()-ptr.t0)<260 && (dx*dx+dy*dy)<64){
            var ts=boxSlotAt(ptr.sx,ptr.sy);
            if(ts && boxMonOf(ts)){
              var ax2=ts.kind==='party'?ts.idx:(pc+ts.idx); menu.sub=ax2;
              menu.boxAct={slot:ts,sel:0}; Audio.se('ok');
            }
          }
          ptr.up=false;
        }
      }
    } else if(menu.page==='set'){
      var opts=['BGM','SE','テキスト速度','画面振動','色覚補助','チュートリアル再表示'];
      if(edge.down){menu.sub=(menu.sub+1)%opts.length;Audio.se('ok');}
      if(edge.up){menu.sub=(menu.sub+opts.length-1)%opts.length;Audio.se('ok');}
      if(edge.left||edge.right){
        var d=edge.right?1:-1;
        if(menu.sub===0){ settings.bgm=clamp01(settings.bgm+d*0.1); }
        else if(menu.sub===1){ settings.se=clamp01(settings.se+d*0.1); }
        else if(menu.sub===2){ settings.textSpeed=Math.max(1,Math.min(3,settings.textSpeed+d)); }
        else if(menu.sub===3){ settings.shake=!settings.shake; }
        else if(menu.sub===4){ settings.colorAssist=!settings.colorAssist; }
        Audio.setVol(settings.bgm,settings.se); Audio.shake=settings.shake;
        Audio.settings.shake=settings.shake; Save.saveSettings(settings);
      }
      if(edge.ok && menu.sub===5){ Audio.se('ok'); scene=SC.FIELD; openTutorial(null); }
    } else if(menu.page==='dex'){
      // スクロール
      var ids=Object.keys(DB.SPECIES);
      if(edge.down){menu.sub=Math.min(ids.length-1,menu.sub+1);Audio.se('ok');}
      if(edge.up){menu.sub=Math.max(0,menu.sub-1);Audio.se('ok');}
    }
  }

  /* ===================== 共通：クリーチャー描画 (§12) ===================== */
  // sidOrType: 種族id（LOOKに従い固有描画）または属性文字列（汎用）
  function drawCreature(cx,cy,sidOrType,r,t,back){
    var L=DB.LOOK[sidOrType];
    if(!L){ var el=sidOrType; L={body:'quad',ear:'round',tail:'thin',el:DB.TYPECOL[el]?el:'none',
      col:DB.TYPECOL[el]||'#9aa0a8',col2:'#ffffff',acc:'#888',eye:'round'}; }
    var bob=Math.sin(t)*r*0.05; cy+=bob;
    function hx(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
    function mix(h,to,a){ var c=hx(h); return 'rgb('+Math.round(c[0]+(to-c[0])*a)+','+
      Math.round(c[1]+(to-c[1])*a)+','+Math.round(c[2]+(to-c[2])*a)+')'; }
    // 淡い色合いに（パステル化）＋細く柔らかい線
    L={body:L.body,ear:L.ear,tail:L.tail,el:L.el,eye:L.eye,
       antler:L.antler,horn:L.horn,wing:L.wing,stocky:L.stocky,
       col:mix(L.col,255,0.30), col2:mix(L.col2,255,0.22), acc:mix(L.acc,255,0.22)};
    var OUT=mix(L.col,40,0.55);              // 体色になじむ濃すぎない輪郭
    var LW=Math.max(1.3,r*0.042);
    var SHA=mix(L.col,255,-0.10), LIT='rgba(255,255,255,.38)';
    function P(){ g.beginPath(); }
    function fill(c){ g.fillStyle=c; g.fill(); }
    function out(w){ g.strokeStyle=OUT; g.lineWidth=w||Math.max(1,r*0.028); g.stroke(); }
    function ell(x,y,a,b,c,ow){ P(); g.ellipse(x,y,a,b,0,0,7); fill(c); if(ow!==0) out(ow); }
    function tri(x1,y1,x2,y2,x3,y3,c,ow){ P(); g.moveTo(x1,y1); g.lineTo(x2,y2);
      g.lineTo(x3,y3); g.closePath(); fill(c); if(ow!==0) out(ow); }
    function shade(x,y,a,b){ g.save(); P(); g.ellipse(x,y,a,b,0,0,7); g.clip();
      g.fillStyle=SHA; P(); g.ellipse(x+a*0.4,y+b*0.45,a*1.05,b*1.05,0,0,7); g.fill();
      g.fillStyle=LIT; P(); g.ellipse(x-a*0.34,y-b*0.4,a*0.62,b*0.55,0,0,7); g.fill(); g.restore(); }

    // 接地影
    g.fillStyle='rgba(0,0,0,.2)'; P(); g.ellipse(cx,cy+r*1.02,r*0.78,r*0.2,0,0,7); g.fill();

    var B=L.body;

    // ---- 背面（戦闘の自分側）：シンプル動物シルエット ----
    if(back){
      var bx=cx, by=cy+r*0.18, brx=r*0.8, bry=r*0.78;
      ell(bx,by,brx,bry,L.col); shade(bx,by,brx,bry); P(); g.ellipse(bx,by,brx,bry,0,0,7); out(LW);
      var hbx=cx, hby=cy-r*0.5, hbr=r*0.5;
      // 耳（背面）
      if(L.ear==='long'){ ell(hbx-hbr*0.5,hby-hbr*1.1,hbr*0.3,hbr*0.95,L.col);
        ell(hbx+hbr*0.5,hby-hbr*1.1,hbr*0.3,hbr*0.95,L.col); }
      else if(L.ear==='pointy'){ tri(hbx-hbr*0.9,hby,hbx-hbr*1.1,hby-hbr*1.2,hbx-hbr*0.2,hby-hbr*0.5,L.col);
        tri(hbx+hbr*0.9,hby,hbx+hbr*1.1,hby-hbr*1.2,hbx+hbr*0.2,hby-hbr*0.5,L.col); }
      else if(L.ear==='round'){ ell(hbx-hbr*0.8,hby-hbr*0.6,hbr*0.42,hbr*0.42,L.col);
        ell(hbx+hbr*0.8,hby-hbr*0.6,hbr*0.42,hbr*0.42,L.col); }
      ell(hbx,hby,hbr,hbr,L.col); shade(hbx,hby,hbr,hbr); P(); g.ellipse(hbx,hby,hbr,hbr,0,0,7); out(LW);
      // しっぽ
      if(L.tail==='bushy') ell(bx+brx*0.9,by+bry*0.2,r*0.34,r*0.34,L.col);
      else if(L.tail!=='none'&&L.tail!=='stub') tri(bx+brx*0.8,by, bx+brx*1.4,by-r*0.2, bx+brx*0.9,by+r*0.3,L.col);
      return;
    }

    // ===== 共通：顔（目・鼻・口） =====
    function face(hx0,hy0,hr,opt){
      opt=opt||{};
      var EYE='#4a3f48';                       // 柔らかい瞳の色（真っ黒を避ける）
      var es=hr*(L.eye==='big'?0.34:0.30), exo=hr*0.40, ey=hy0+hr*0.10;
      function eye(x){
        if(L.eye==='sleepy'){ g.strokeStyle=EYE; g.lineWidth=Math.max(1.4,r*0.035); g.lineCap='round';
          P(); g.arc(x,ey+es*0.2,es*0.95,Math.PI*1.12,Math.PI*1.88); g.stroke(); g.lineCap='butt';
          return; }
        // まんまる＆やさしい瞳（sharpもまるく）
        P(); g.ellipse(x,ey,es*0.92,es,0,0,7);
        g.fillStyle=EYE; g.fill();
        g.save(); g.clip();

      ell(dbx+dbrx*0.66,dby+dbry*0.6,r*0.13,r*0.15,L.col);
      // 翼（pyrogon）
      if(L.wing){ P(); g.moveTo(dbx-dbrx*0.3,dby-dbry*0.2);
        g.quadraticCurveTo(dbx-dbrx*1.4,dby-dbry*0.9, dbx-dbrx*1.1,dby+dbry*0.3);
        g.quadraticCurveTo(dbx-dbrx*0.7,dby, dbx-dbrx*0.3,dby-dbry*0.2);
        fill(mix(L.acc,255,0.05)); out();
        P(); g.moveTo(dbx+dbrx*0.3,dby-dbry*0.2);
        g.quadraticCurveTo(dbx+dbrx*1.4,dby-dbry*0.9, dbx+dbrx*1.1,dby+dbry*0.3);
        g.quadraticCurveTo(dbx+dbrx*0.7,dby, dbx+dbrx*0.3,dby-dbry*0.2);
        fill(mix(L.acc,255,0.05)); out(); }
      // 大きな頭（中央・マズルなし）
      var dhr=r*0.62, dhx=cx, dhy=cy-r*0.16;
      if(L.horn){ tri(dhx-dhr*0.5,dhy-dhr*0.55,dhx-dhr*0.92,dhy-dhr*1.15,dhx-dhr*0.18,dhy-dhr*0.6,'#ffe0b8');
        tri(dhx+dhr*0.5,dhy-dhr*0.55,dhx+dhr*0.92,dhy-dhr*1.15,dhx+dhr*0.18,dhy-dhr*0.6,'#ffe0b8'); }
      if(L.el==='grass' && !L.horn){ tri(dhx,dhy-dhr*1.55,dhx-dhr*0.30,dhy-dhr*0.85,dhx+dhr*0.05,dhy-dhr*0.95,'#7fd06a'); }
      if(L.el==='earth' && !L.horn){ tri(dhx-dhr*0.26,dhy-dhr*0.85,dhx-dhr*0.32,dhy-dhr*1.4,dhx-dhr*0.04,dhy-dhr*0.85,'#bfe8ff');
        tri(dhx+dhr*0.05,dhy-dhr*0.85,dhx+dhr*0.16,dhy-dhr*1.5,dhx+dhr*0.30,dhy-dhr*0.85,'#dff2ff'); }
      ell(dhx,dhy,dhr,dhr*0.96,L.col); shade(dhx,dhy,dhr,dhr*0.96);
      P(); g.ellipse(dhx,dhy,dhr,dhr*0.96,0,0,7); out(LW);
      face(dhx,dhy,dhr,{});
      if(L.el==='fire'){ tri(dhx-r*0.12,dhy+dhr*0.62,dhx,dhy+dhr*1.0,dhx+r*0.12,dhy+dhr*0.62,L.acc,0); }
    }
    else { // フォールバック
      ell(cx,cy,r*0.8,r*0.8,L.col); P(); g.ellipse(cx,cy,r*0.8,r*0.8,0,0,7); out(LW);
      face(cx,cy-r*0.1,r*0.6,{});
    }
  }

  /* ===================== トースト描画 ===================== */
  function drawToasts(dt){
    for(var i=toasts.length-1;i>=0;i--){
      var ts=toasts[i]; ts.t-=dt;
      var idx=toasts.length-1-i;
      var a=Math.min(1,ts.t/400);
      g.globalAlpha=Math.max(0,a);
      g.fillStyle='rgba(20,26,40,.95)';
      var w=g.measureText(ts.msg).width+40;
      g.fillRect(940-w-16,16+idx*44,w,34);
      g.strokeStyle='#5a8cff'; g.strokeRect(940-w-16,16+idx*44,w,34);
      g.fillStyle='#cfe0ff'; g.font='14px Segoe UI'; g.textAlign='left';
      g.fillText(ts.msg,940-w,38+idx*44);
      g.globalAlpha=1;
      if(ts.t<=0) toasts.splice(i,1);
    }
  }

  /* ===================== メインループ (§16) ===================== */
  var last=0, acc=0, STEP=1000/60;
  function frame(now){
    try{
      if(!last) last=now;
      var dt=now-last; last=now;
      if(dt>200) dt=200; // タブ復帰時の暴走防止
      acc+=dt;
      var steps=0;
      while(acc>=STEP && steps<5){ tick(STEP); acc-=STEP; steps++; }
      render(dt);
      // エッジ入力リセット
      for(var k in edge) edge[k]=false;
    }catch(e){
      console.error(e);
      // 致命でなければ FIELD へ復帰を試みる
      try{ if(state){ scene=SC.FIELD; B=null; } }catch(_){}
    }
    requestAnimationFrame(frame);
  }
  function tick(dt){
    if(tut.on){ updateTutorial(); return; }
    if(fadeDir!==0){
      fade += fadeDir* (dt/250);
      if(fadeDir>0 && fade>=1){ fade=1; if(fadeCb){ var c=fadeCb; fadeCb=null; c(); } fadeDir=-1; }
      else if(fadeDir<0 && fade<=0){ fade=0; fadeDir=0; }
      return; // 遷移中は入力ロック（連打多重防止 §17）
    }
    if(scene===SC.TITLE) updateTitle();
    else if(scene===SC.FIELD) updateField(dt);
    else if(scene===SC.BATTLE) updateBattle();
    else if(scene===SC.MENU) updateMenu();
    else if(scene===SC.SHOP) updateShop();
    else if(scene===SC.END) updateEnd();
    if(shake>0) shake-=1;
    if(state&&state.stats) state.stats.playTime=(Date.now()-(state.stats.start||Date.now()))/1000;
  }
  function render(dt){
    zones.length=0; // クリックゾーンを毎フレーム再構築
    g.save();
    if(shake>0 && (Audio.settings.shake)){
      g.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
    }
    if(scene===SC.TITLE) drawTitle();
    else if(scene===SC.FIELD) drawField();
    else if(scene===SC.BATTLE){ if(B) drawBattle(); else drawField(); }
    else if(scene===SC.MENU) drawMenu();
    else if(scene===SC.SHOP) drawShop();
    else if(scene===SC.END) drawEnd();
    g.restore();
    if(tut.on) drawTutorial();
    drawToasts(dt);
    if(fade>0){ g.fillStyle='rgba(0,0,0,'+fade+')'; g.fillRect(0,0,960,640); }
  }

  // afterMsg='ending' のフック
  var _origUpdateBattle=updateBattle;

  /* ---------- 起動 ---------- */
  function boot(){
    try{
      settings=Save.loadSettings();
      Audio.setVol(settings.bgm,settings.se);
      Audio.settings.shake=settings.shake;
      resize();
      document.getElementById('ld').style.display='none';
      scene=SC.TITLE;
      requestAnimationFrame(frame);
    }catch(e){ fatal(e&&e.message||String(e)); }
  }

  // battleVictory の ending 連結（afterMsg 'ending' 対応）
  var realBattleVictory=battleVictory;
  // updateBattle 内 afterMsg ハンドラに 'ending' を足す
  (function patchEnding(){
    var orig=updateBattle;
    updateBattle=function(){
      if(B && B.phase==='msg' && B.msgQ.length===0 && B.afterMsg==='ending'){
        B.afterMsg=null; B=null;
        Save.save(state);
        transition(function(){ scene=SC.END; Audio.playBgm('win'); });
        return;
      }
      orig();
    };
  })();

  return {boot};
})();

/* ---------- 起動トリガ ---------- */
try{
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',Game.boot);
  else Game.boot();
}catch(e){ fatal(e&&e.message||String(e)); }

})();
</script>
